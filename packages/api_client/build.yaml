targets:
  $default:
    builders:
      json_serializable:
        options:
          # API snake_case, Dart camelCase. Tek yerde çevirmek, her alana
          # @JsonKey yazmaktan hem kısa hem hataya kapalı.
          field_rename: snake
          explicit_to_json: true
          create_to_json: true
          include_if_null: false
