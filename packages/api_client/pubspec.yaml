name: bld_api_client
description: >
  docs/openapi.yaml sözleşmesinin Dart karşılığı — DTO'lar, hata modeli, HTTP
  istemcisi ve OrderSource soyutlaması. musteriapp ve mutfakapp doğrudan HTTP
  çağırmaz, hepsi buradan geçer.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  bld_core: ^0.1.0
  # VARSAYIM: dokümanlar Dart HTTP istemcisini adlandırmıyor (AGENTS.md §2.4
  # "dokümanda belirtilen paketleri kullan" diyor ama belirtilmemiş).
  # dio seçildi: zorunlu başlıklar (X-App-Id, X-App-Version, Accept-Language),
  # token ekleme ve KDS'in üstel geri çekilmesi interceptor ile tek yerden
  # çözülüyor; saf http ile her çağrıda tekrar edilirdi. Saf Dart, Flutter
  # bağımlılığı yok. Bkz. docs/BILINMEYENLER.md.
  dio: ^5.7.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  meta: ^1.15.0

dev_dependencies:
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  lints: ^6.0.0
  test: ^1.25.0
