name: bld_design_system
description: >
  Marka tasarım belirteçleri (renk, aralık, tipografi). Saf Dart — Flutter'a
  bağımlı değildir ki hem Flutter uygulamaları hem araçlar aynı değerleri okusun.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0

# Belirteç üreteci. `tokens/bld.tokens.json` TEK KAYNAKTIR; bu komut ondan
# `lib/src/colors.dart`, `website/app/tokens.css` ve panelin `tokens.css`
# dosyasını üretir. `--check` ile hiçbir şey yazmaz, bayatsa 1 ile çıkar
# (CI'daki tazelik kapısı bunu kullanıyor).
#
#   dart run bld_design_system:gen_tokens
#   dart run bld_design_system:gen_tokens --check
executables:
  gen_tokens:

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
