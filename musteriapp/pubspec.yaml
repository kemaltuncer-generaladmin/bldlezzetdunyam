name: musteriapp
description: "Benim Lezzet Dünyam — müşteri mobil uygulaması (Android)."
publish_to: 'none'

# versionName Android'e buradan geçer ve `X-App-Version` başlığıyla aynı olmak
# zorundadır (docs/03-api-sozlesmesi.md §1.1). Tek kaynak: bu satır.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Ortak paketler. musteriapp kendi DTO'sunu ve para biçimleyicisini yazmaz.
  # VARSAYIM: kök pubspec.yaml'daki pub workspace'e katılmak yerine path
  # bağımlılığı kullanıldı — kök dosya bu ajanın alanı dışında (bkz.
  # docs/BILINMEYENLER.md).
  bld_api_client:
    path: ../packages/api_client
  bld_core:
    path: ../packages/core
  bld_design_system:
    path: ../packages/design_system

  cupertino_icons: ^1.0.8
  freezed_annotation: ^3.0.0
  go_router: ^16.0.0
  flutter_riverpod: ^2.6.1
  intl: any
  json_annotation: ^4.12.0
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2

  # Harita — teslimat noktasının iğneyle seçilmesi.
  #
  # NEDEN OpenStreetMap, Google Maps DEĞİL: Google Maps SDK'sı faturalandırma
  # hesabı ve API anahtarı istiyor. Anahtar derlemeye gömülmek zorunda ve
  # sızdığında fatura bize yazılıyor; ayrıca anahtarsız her ortam (yeni
  # kurulan geliştirme makinesi, CI) haritasız kalırdı. OSM anahtarsız
  # çalışır ve maliyeti yoktur.
  #
  # Karşılığı dürüstçe: OSM'de bina/kapı numarası Türkiye'de Google kadar
  # keskin değil. Adres serbest metni bu yüzden KALDIRILMADI — harita onun
  # yerine değil, yanına eklendi.
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Cihaz konumu — haritada "konumum" düğmesi. İzin reddedilirse harita elle
  # kaydırılarak kullanılmaya devam eder (konum bir kolaylık, kapı değil).
  geolocator: ^13.0.1

# `packages/*` pub workspace üyesidir ve birbirine `^0.1.0` (hosted) diye
# bakar. musteriapp workspace'e katılmadığı için o referanslar path'e
# çevrilmelidir; aksi halde pub yayınlanmamış paketi pub.dev'de arar.
dependency_overrides:
  bld_api_client:
    path: ../packages/api_client
  bld_core:
    path: ../packages/core
  bld_design_system:
    path: ../packages/design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0

  # Uygulama ikonu + açılış (splash). Üretilen native varlıklar commitlenir,
  # bu araçlar yalnızca üretim için gerekir (çalışma anında kullanılmaz).
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# Zemin rengi #941C01 = brand800 (`packages/design_system/tokens/bld.tokens.json`),
# logo gradyanının KOYU ucu. Eski #EA580C artık palette hiç yok — o turuncu
# emekliye ayrıldı.
#
# NEDEN gradyanın parlak ucu (brand500 #DD5D02) DEĞİL: `assets/icon/*` beyaz
# çizimler ve palet kuralı net — brand500 ve daha açığı beyaz taşımaz
# (3,72 < 4,50). brand800 beyazı 8,66'da taşır.
#
# ⚠ `android/` ve `ios/` altındaki ÜRETİLMİŞ varlıklar hâlâ eski turuncuyla
# basılı. Bu blok kaynaktır, onlar çıktı; nihai amblem çizildikten sonra
# `dart run flutter_launcher_icons` + `dart run flutter_native_splash:create`
# birlikte koşulmalı.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#941C01"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#941C01"
  image: assets/icon/splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#941C01"
    image: assets/icon/splash_logo.png

flutter:
  uses-material-design: true
  generate: true

  # Marka tipografisi. İkisi de OFL (lisanslar assets/fonts/*-OFL.txt).
  # Değişken (variable) fontlar: tek dosya, ağırlık tanımı YOK — Flutter
  # TextStyle.fontWeight'i fontun `wght` eksenine kendisi eşler. Çalışma
  # anında Google Fonts indirilmez; çevrimdışı menü kararıyla tutarlı.
  #
  # İKİSİ DE ALT KÜMELENMİŞ (latin + latin-ext + ₺, wght 400–700). Nasıl ve
  # neden: assets/fonts/README.md. Font dosyasını yayınlanan tam sürümle
  # DEĞİŞTİRMEYİN — paket 590 KB birden büyür.
  #
  # Sora KALDIRILDI: başlık ailesi artık Source Serif 4
  # (`BldFontFamily.display`). Sora geometrik bir sans'tı, logonun tırnaklı
  # harf biçimiyle ilgisi yoktu ve içinde `₺` bile bulunmuyordu.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Variable.ttf
