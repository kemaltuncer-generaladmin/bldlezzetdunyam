# Coolify dağıtımı — docs/08-kurulum-deploy.md §1.2
#
# Coolify bu dosyayı repo kökünden okur ve Traefik yönlendirmesini
# `SERVICE_FQDN_*` sihirli değişkenlerinden üretir. Bu yüzden burada
# Traefik etiketi ELLE yazılmaz; Coolify ekler.
#
# NEDEN KÖKTE: derleme bağlamları (`platform/`, `website/`) repo köküne
# göreli. Compose'u infra/ altına koymak her bağlamı `../` ile yazmayı
# gerektirir ve Coolify'ın taban dizin ayarıyla kolayca bozulur.
#
# Portlar DIŞARI AÇILMAZ: 80/443 Coolify'ın Traefik'inde. `web` ve `site`
# servislerine Traefik iç ağdan ulaşır.

services:
  # ── TastyIgniter API + admin panel ───────────────────────────────────
  app:
    build:
      context: .
      dockerfile: infra/platform/Dockerfile.prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Benim Lezzet Dunyam"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Coolify ortam degiskenlerinde APP_KEY tanimlayin}
      APP_URL: ${API_URL:-http://62.238.102.197}
      APP_LOCALE: tr
      IGNITER_LOCATION_MODE: single
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-bld}
      DB_USERNAME: ${MYSQL_USER:-bld}
      DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
      BROADCAST_DRIVER: log
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      MAIL_MAILER: log
      # ── Kurumsal site tazeleme ────────────────────────────────────────
      # Panelde içerik kaydedilince siteye "önbelleğini tazele" isteği gider.
      # Boş bırakılırsa istek gönderilmez ve site içeriği kendi ISR süresi
      # (5 dk) dolunca toparlar — veri kaybı YOK, yalnızca gecikme olur.
      # Sır, site tarafındaki CONTENT_REVALIDATE_SECRET ile AYNI olmalı.
      SITE_REVALIDATE_URL: ${SITE_REVALIDATE_URL:-}
      SITE_REVALIDATE_SECRET: ${CONTENT_REVALIDATE_SECRET:-}

      # BBD Store köprüsü (K-16). BBD ayrı bir sunucudaki kitap
      # e-ticaret sitesi; tek bağ mutfaktaki termal yazıcı.
      #
      # BOŞ BIRAKILIRSA UÇ KAPALIDIR ve her istek 401 döner — bilinçli.
      # Boş sırla imza doğrulamak, herkesin geçebildiği bir kapı olurdu.
      # Değer Coolify ortam değişkenlerinde tutulur, ASLA burada değil.
      BBD_WEBHOOK_SECRET: ${BBD_WEBHOOK_SECRET:-}

      # İade sürücüsü (K-13). Yalnız `online` ödemeli siparişler için;
      # `account` cari deftere, `cash` manuel iadeye gider. Gerçek sanal
      # POS bağlanınca buraya onun adı yazılacak.
      BLD_REFUND_DRIVER: ${BLD_REFUND_DRIVER:-simulated}
    volumes:
      # Yüklenen medya ve loglar imajda değil, kalıcı birimde durur —
      # yeni sürüm dağıtıldığında silinmemeleri gerekir.
      - platform-storage:/var/www/platform/storage/app
      - platform-logs:/var/www/platform/storage/logs
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Caddy: yalnızca php-fpm önyüzü, dışarı açık değil ────────────────
  web:
    build:
      context: .
      dockerfile: infra/platform/Dockerfile.web
    restart: unless-stopped
    depends_on: [app]
    volumes:
      # Yüklenen medya `app` tarafından bu birime yazılıyor, ama SUNAN
      # konteyner burası. Birim bağlanmadığı sürece `web` yalnızca imaja
      # gömülü statik `public/` kopyasını görüyordu ve menü fotoğrafları
      # 404 dönüyordu — ürünlerde `image_url` dolu olduğu hâlde.
      #
      # `:ro` — bu konteyner yalnızca sunar, hiçbir şey yazmaz. Yazma
      # yetkisi vermek, statik dosya sunucusuna gereksiz bir yetenek
      # bırakmak olurdu.
      - platform-storage:/var/www/platform/storage/app:ro
    environment:
      # ÇIPLAK ANAHTAR, DEĞER VERİLMEZ. Coolify bu deseni görünce alan
      # adını üretir, Traefik etiketlerini ekler ve konteyneri `coolify`
      # ağına bağlar. Değer atandığında (örn. `${API_FQDN:-/}`) sihirli
      # değişken işlenmiyor: konteyner etiketsiz kalıyor, proxy ağına
      # girmiyor ve dışarıdan 404 dönüyor. Alan adı Coolify arayüzündeki
      # "Domains" alanından verilir, compose'dan değil.
      - SERVICE_FQDN_WEB_80
    # Coolify'ın Traefik hizmetini kurabilmesi için portun bildirilmesi
    # gerekir; `ports` değil `expose` — dışarı açılmayacak, yalnızca
    # proxy'nin iç ağdan ulaşacağı port ilan ediliyor.
    expose:
      - "80"
    # Bind mount YOK: Caddyfile imaja gömülü (bkz. Dockerfile.web).
    # Coolify repo kaynağını sunucuda tutmaz; bind mount kaynağı bulamaz
    # ve Docker oraya klasör oluşturup konteyneri hiç başlatmaz.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Müşteri web sitesi (Next.js) ─────────────────────────────────────
  site:
    build:
      context: .
      dockerfile: website/Dockerfile
      args:
        # NEXT_PUBLIC_* değişkenleri DERLEME ANINDA gömülür; çalışma anında
        # değiştirilemezler. Bu yüzden ortam değişkeni değil build arg'ı
        # olarak veriliyorlar — Coolify'da değiştirilince yeniden derleme
        # gerekir, sadece yeniden başlatma yetmez.
        NEXT_PUBLIC_API_URL: ${SITE_API_URL:-https://api.benimlezzetdunyam.com.tr/api}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://benimlezzetdunyam.com.tr}
    restart: unless-stopped
    # ÇALIŞMA ANI değişkenleri — yukarıdaki NEXT_PUBLIC_* build arg'larının
    # aksine bunlar sunucuda okunuyor ve tarayıcıya GİTMİYOR. Değişince
    # yeniden derleme gerekmez, yeniden başlatma yeter.
    environment:
      # Panelden gelen tazeleme isteğini doğrulayan paylaşılan sır.
      # TANIMSIZSA tazeleme ucu tamamen kapalıdır (503) — boş sırla
      # herkesin tazeleme tetiklemesine izin vermiyoruz.
      CONTENT_REVALIDATE_SECRET: ${CONTENT_REVALIDATE_SECRET:-}
      # Teklif formunun gönderileceği hedef.
      #
      # DİKKAT: TANIMSIZ BIRAKILIRSA form, ziyaretçiye talebinin
      # İLETİLEMEDİĞİNİ açıkça söyler (sahte başarı göstermez) ve talep
      # yalnızca sunucu günlüğüne yazılır. Yayına çıkmadan önce
      # doldurulmalı; aksi hâlde formu dolduran her müşteri hata görür.
      QUOTE_WEBHOOK_URL: ${QUOTE_WEBHOOK_URL:-}
    depends_on: [web]
    # DİKKAT: burada `web`deki gibi çıplak bir `SERVICE_FQDN_SITE_3000`
    # sihirli değişkeni YOK. Coolify onu ortam haritasına çevirirken
    # anahtar olarak liste indeksini kullanıyor (`0: SERVICE_FQDN_SITE_3000`)
    # ve compose "non-string key in services.site.environment: 0" ile
    # patlıyor. Alan adı zaten Coolify'ın kalıcı `docker_compose_domains`
    # kaydından geliyor; Traefik etiketleri oradan üretiliyor.
    #
    # Traefik hedef portu `expose` üzerinden otomatik bulunur: konteyner
    # tek port açtığı için ayrıca loadbalancer etiketi gerekmiyor.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── MySQL ────────────────────────────────────────────────────────────
  db:
    # Sürüm sabit: kayan `mysql:8` etiketi 8.4'e geçince
    # --default-authentication-plugin kaldırıldığı için yığın kırılmıştı.
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # SERVICE_PASSWORD_* Coolify'ın ürettiği rastgele paroladır;
      # repoda hiçbir sır durmaz.
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bld}
      MYSQL_USER: ${MYSQL_USER:-bld}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  db-data:
  platform-storage:
  platform-logs:
