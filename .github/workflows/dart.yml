# Ortak Dart paketleri — packages/core, api_client, design_system
#
# Ayrı bir hat: bu paketler hem mutfakapp'in hem musteriapp'in tabanı.
# Burada kırılan bir şey iki istemciyi birden durdurur, o yüzden istemci
# derlemelerini beklemeden koşar. Paketlerin kendisi saf Dart'tır; Flutter
# SDK'sı yalnızca workspace çözümlemesi için kurulur (aşağıdaki nota bakın).
name: dart-paketleri

on:
  push:
    branches: [main]
    paths: ['packages/**', 'pubspec.yaml', '.github/workflows/dart.yml']
  pull_request:
    paths: ['packages/**', 'pubspec.yaml', '.github/workflows/dart.yml']

jobs:
  analiz-ve-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # K-01'de `mutfakapp` pub workspace'e üye oldu (kök `pubspec.yaml`).
      # Workspace'te bir Flutter paketi bulunduğu an çözümleme Flutter SDK'sını
      # gerektirir: çıplak `dart-lang/setup-dart` ile `dart pub get`
      # "mutfakapp depends on flutter_test from sdk which doesn't exist" verir.
      # Adımların geri kalanı saf Dart olarak kalır — Flutter yalnızca
      # bağımlılık çözümü için gerekli.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Üretilen dosyalar güncel mi
        # freezed/json_serializable çıktıları commitleniyor (AGENTS.md §4).
        # Elle düzenlenmiş veya bayat bir üretim dosyası, kaynakla sessizce
        # ayrışır ve hata çalışma anında ortaya çıkar.
        run: |
          dart run build_runner build
          if ! git diff --quiet -- 'packages/**/*.freezed.dart' 'packages/**/*.g.dart'; then
            echo '::error::Üretilen dosyalar bayat. dart run build_runner build koşup commitleyin.'
            git diff --stat -- 'packages/**/*.freezed.dart' 'packages/**/*.g.dart'
            exit 1
          fi

      - name: Analiz
        run: dart analyze packages/

      - name: Testler
        run: dart test packages/

      - name: Biçimlendirme
        run: dart format --output=none --set-exit-if-changed packages/
