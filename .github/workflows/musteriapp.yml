# Müşteri mobil uygulaması — Flutter Android + iOS
name: musteriapp

on:
  push:
    branches: [main]
    paths: ['musteriapp/**', 'packages/**', '.github/workflows/musteriapp.yml']
  pull_request:
    paths: ['musteriapp/**', 'packages/**', '.github/workflows/musteriapp.yml']

jobs:
  analiz-test-derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
        working-directory: musteriapp

      - name: Doğrudan HTTP çağrısı olmamalı
        # AGENTS.md §2.4: tüm ağ çağrıları packages/api_client üzerinden.
        # Tek bir doğrudan çağrı, sözleşme değiştiğinde derleme hatası
        # yerine çalışma anı hatası üretir.
        run: |
          if grep -rn "package:dio\|package:http/" musteriapp/lib/; then
            echo "::error::musteriapp/lib içinde doğrudan HTTP kullanımı — api_client üzerinden geçmeli."
            exit 1
          fi
          echo "Tüm çağrılar api_client üzerinden."

      - name: Üretilen l10n dosyaları güncel olmalı
        working-directory: musteriapp
        # `app_tr.arb`'ye anahtar eklenip `app_localizations*.dart`
        # yenilenmezse `flutter analyze` "böyle bir getter yok" hatalarıyla
        # düşer. Üretilen dosyalar bilerek commitleniyor (AGENTS.md §4 —
        # klonlayan ajan üreteci koşmadan derleyebilmeli), dolayısıyla
        # bayatlamaları sessiz ve tekrarlayan bir ihtimal.
        #
        # KAPI BURADA, ANALİZDE DEĞİL: bu adım üreteci koşturduğu için
        # kendisinden sonraki `flutter analyze` bayat dosyayla bile GEÇERDİ —
        # CI yeşil yanar, eksik olan yalnızca depoya bakan insanda patlardı.
        # Fark denetimi o boşluğu kapatıyor: üretilen çıktı commitlenenden
        # ayrıldığı anda iş burada durur.
        #
        # `git add -N`: yeni bir dil eklenirse üreteç yepyeni bir dosya
        # yazar; `git diff` izlenmeyen dosyayı görmez ve kapı sessizce
        # atlanırdı. `--intent-to-add` onları farka dahil eder.
        #
        # Üreteç deterministik — çıktıda tarih/sürüm damgası yok — bu yüzden
        # fark yalnızca gerçekten bayat dosyada oluşur, gürültü üretmez.
        run: |
          flutter gen-l10n
          git add --intent-to-add lib/src/l10n/
          if ! git diff --exit-code lib/src/l10n/; then
            echo "::error::Üretilen l10n dosyaları bayat. 'flutter gen-l10n' koşun ve lib/src/l10n/ altındaki değişiklikleri commitleyin."
            exit 1
          fi

      - name: Analiz (sıfır uyarı)
        working-directory: musteriapp
        run: flutter analyze

      - name: Testler
        working-directory: musteriapp
        run: flutter test

      - name: Release APK derlemesi
        working-directory: musteriapp
        # Release APK, `build.gradle.kts`'teki debug imzasıyla imzalanır
        # (I-06'ya kadar) — imzalama sırrı gerekmez ve APK cihaza doğrudan
        # `adb install` ile kurulabilir. AAB yerine APK: AAB kurmak bundletool
        # ister, APK istemez. Amaç hem Gradle'ı koşturmak hem indirilebilir
        # bir çıktı bırakmak.
        # Üretim API adresi derlemeye gömülür (docs/07 §3, app_config.dart).
        # Public endpoint, sır değil; cihazdaki uygulama buraya bağlanır.
        run: flutter build apk --release --dart-define=BLD_API_BASE_URL=https://api.benimlezzetdunyam.com.tr/api

      - name: APK'yı indirilebilir artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: musteriapp-release-apk
          path: musteriapp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios-derleme:
    # iOS derlemesi Xcode ister; yalnızca macOS runner'da koşabilir.
    # Ayrı iş olmasının sebebi: ubuntu işi Android'i derlerken bu paralel
    # koşsun, biri diğerini beklemesin.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
        working-directory: musteriapp

      - name: Bundle kimliği Android ile aynı olmalı
        # İki platformda ayrı kimlik, push kayıtlarını ve deep link'leri
        # iki ayrı uygulamaya böler. Elle senkron tutmak unutuluyor.
        run: |
          ANDROID=$(grep -oP 'applicationId = "\K[^"]+' \
            musteriapp/android/app/build.gradle.kts)
          IOS=$(grep -oP 'PRODUCT_BUNDLE_IDENTIFIER = \K[^;]+' \
            musteriapp/ios/Runner.xcodeproj/project.pbxproj \
            | grep -v RunnerTests | sort -u | head -1)
          echo "android=$ANDROID ios=$IOS"
          if [ "$ANDROID" != "$IOS" ]; then
            echo "::error::Kimlikler ayrışmış: android=$ANDROID ios=$IOS"
            exit 1
          fi

      - name: iOS derlemesi (imzasız)
        working-directory: musteriapp
        # --no-codesign: imzalama sertifikası CI gizli değişkenlerinde ve
        # yalnızca sürüm etiketlerinde kullanılır. Buradaki amaç Xcode
        # derlemesinin hiç koşmadan kalmasını engellemek — Dart analiz
        # geçiyor diye iOS'un da derlendiğini varsaymak, App Store
        # yüklemesinde patlamak demektir.
        run: flutter build ios --release --no-codesign
