# Müşteri mobil uygulaması — Flutter Android
name: musteriapp

on:
  push:
    branches: [main]
    paths: ['musteriapp/**', 'packages/**', '.github/workflows/musteriapp.yml']
  pull_request:
    paths: ['musteriapp/**', 'packages/**', '.github/workflows/musteriapp.yml']

jobs:
  analiz-test-derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
        working-directory: musteriapp

      - name: Doğrudan HTTP çağrısı olmamalı
        # AGENTS.md §2.4: tüm ağ çağrıları packages/api_client üzerinden.
        # Tek bir doğrudan çağrı, sözleşme değiştiğinde derleme hatası
        # yerine çalışma anı hatası üretir.
        run: |
          if grep -rn "package:dio\|package:http/" musteriapp/lib/; then
            echo "::error::musteriapp/lib içinde doğrudan HTTP kullanımı — api_client üzerinden geçmeli."
            exit 1
          fi
          echo "Tüm çağrılar api_client üzerinden."

      - name: Analiz (sıfır uyarı)
        working-directory: musteriapp
        run: flutter analyze

      - name: Testler
        working-directory: musteriapp
        run: flutter test

      - name: AAB derlemesi
        working-directory: musteriapp
        # İmzasız derleme: imzalama anahtarı CI gizli değişkenlerinde
        # tutulur ve yalnızca sürüm etiketlerinde kullanılır (I-06).
        # Buradaki amaç Gradle'ın hiç koşmadan kalmasını engellemek —
        # Dart derleniyor diye Android derlemesinin de çalıştığını
        # varsaymak, Play yüklemesinde patlamak demektir.
        run: flutter build appbundle --debug
