<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Benim Lezzet Dünyam">
  <!--
    Tarayıcı sekmesi simgesi.

    NEDEN "BLD" HARFLERİ DEĞİL: sekme simgesi 16 px çiziliyor ve üç harf o
    boyutta okunmuyor — gri bir lekeye dönüyor. Site içindeki 40 px'lik marka
    işareti harfleri kullanmaya devam ediyor; orada okunuyor.

    Motif, projede zaten var olan uygulama simgesinden geliyor
    (mutfakapp/assets/icons/bld_*.png): servis kapağı. Yeni bir sembol
    uydurmuyoruz — firmanın gerçek logosu geldiğinde bu dosya onunla
    değiştirilecek.

    Renkler globals.css'teki brand-500 → brand-700 ile aynı.
  -->
  <defs>
    <linearGradient id="bld-arka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bld-arka)"/>

  <!-- Kapak tutamağı -->
  <circle cx="32" cy="17" r="3.6" fill="#fff"/>
  <!-- Kapak kubbesi: 16 px'te bile ayırt edilsin diye kalın ve sade -->
  <path d="M13 41a19 19 0 0 1 38 0z" fill="#fff"/>
  <!-- Tabla -->
  <rect x="8" y="42.5" width="48" height="6" rx="3" fill="#fff"/>
</svg>
