name: mutfakapp
description: >
  Benim Lezzet Dünyam mutfak ekranı (KDS). Hedef platform yalnızca Linux
  desktop (Ubuntu) — Android hedefi ADR-04 ile iptal edilmiştir.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  bld_api_client: ^0.1.0
  bld_core: ^0.1.0
  bld_design_system: ^0.1.0

  # Sabit metinler `l10n` üzerinden gelir (AGENTS.md §4); gen_l10n çıktısı
  # intl'e bağımlıdır.
  intl: any

  # State yönetimi — AGENTS.md §4 zorunlu kılıyor.
  flutter_riverpod: ^3.4.0

  # Kiosk davranışı: açılışta tam ekran + always on top (docs/05 §6).
  window_manager: ^0.5.2

  # Cihaz token'ı ve ayarlar (docs/05 §2).
  shared_preferences: ^2.5.5

  # Kuyruk veritabanının yeri (XDG uygulama veri klasörü).
  path_provider: ^2.1.5

  # Kalıcı yazdırma kuyruğu (docs/05 §2, §5.4).
  #
  # `sqlite3_flutter_libs` bilinçli olarak KULLANILMADI: sürümü `0.6.0+eol`,
  # yani terk edilmiş. Ubuntu'da `libsqlite3.so.0` zaten kurulu geliyor
  # (`libsqlite3-0` paketi); kütüphane oradan açılıyor. `.deb` paketlenirken
  # `libsqlite3-0` bağımlılık olarak yazılmalı.
  sqlite3: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
