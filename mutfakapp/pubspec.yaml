name: mutfakapp
description: >
  Benim Lezzet Dünyam mutfak ekranı (KDS). Hedef platform yalnızca Linux
  desktop (Ubuntu) — Android hedefi ADR-04 ile iptal edilmiştir.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  bld_api_client: ^0.1.0
  bld_core: ^0.1.0
  bld_design_system: ^0.1.0

  # Sabit metinler `l10n` üzerinden gelir (AGENTS.md §4); gen_l10n çıktısı
  # intl'e bağımlıdır.
  intl: any

  # State yönetimi — AGENTS.md §4 zorunlu kılıyor.
  flutter_riverpod: ^3.4.0

  # Kiosk davranışı: açılışta tam ekran + always on top (docs/05 §6).
  window_manager: ^0.5.2
  crypto: ^3.0.6

  # Cihaz token'ı ve ayarlar (docs/05 §2).
  shared_preferences: ^2.5.5

  # Kuyruk veritabanının yeri (XDG uygulama veri klasörü).
  path_provider: ^2.1.5

  # Kalıcı yazdırma kuyruğu (docs/05 §2, §5.4).
  #
  # `sqlite3_flutter_libs` KULLANILMADI: sürümü `0.6.0+eol`, terk edilmiş.
  #
  # Sürüm 3.3+ KULLANILMADI: kütüphaneyi Dart'ın **deneysel** native assets
  # mekanizmasıyla (`@DefaultAsset`) yüklüyor ve `open.dart` kaldırılmış.
  # Mutfak kasası deneysel derleme bayrağına bağlanamaz. 2.9.x, sistemdeki
  # `libsqlite3`'ü açar; Ubuntu'da `libsqlite3-0` paketi zaten kuruludur ve
  # `.deb` paketlenirken bağımlılık olarak yazılmalıdır.
  sqlite3: ">=2.4.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
