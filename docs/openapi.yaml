      operationId: getAccountSummary
      security:
        - CustomerToken: []
      responses:
        '200':
          description: Güncel bakiye
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /account/statement:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: from
        in: query
        required: false
        schema: { type: string, format: date }
        description: 'Başlangıç tarihi (varsayılan 3 ay önce).'
      - name: to
        in: query
        required: false
        schema: { type: string, format: date }
        description: 'Bitiş tarihi (varsayılan bugün).'
    get:
      tags: [Cari hesap]
      summary: Cari ekstre
      description: Tarih aralığındaki hareketler, açılış ve kapanış bakiyesiyle.
      operationId: getAccountStatement
      security:
        - CustomerToken: []
      responses:
        '200':
          description: Ekstre
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStatement' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /account/payments:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Cari hesap]
      summary: Cari borç ödemesi başlat
      description: |
        İki mod, tek uç: `amount` ile istenen tutar, `full: true` ile borcun
        tamamı.

        **Tutar sunucuda doğrulanır.** `full` modunda istemcinin gönderdiği
        hiçbir rakam okunmaz; bakiye yeniden hesaplanır. Aksi hâlde
        istemcinin ekranındaki eski bakiye ile gerçek borç ayrıştığında
        (arada bir sipariş geçmişse) müşteri eksik ödeyip "kapattım" sanırdı.

        Borcu aşan ödeme reddedilir: fazla ödeme defterde negatif bakiye
        yaratır ve iadesi elle iş demektir.

        Ödeme BU UÇTA TAMAMLANMAZ. Yanıttaki `redirect_url` sağlayıcının
        sayfasıdır (bugün simülasyon); defter ancak ödeme kesinleşince
        yazılır.
      operationId: startAccountPayment
      security:
        - CustomerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: 'Ödenecek tutar (kuruş). `full` true ise yok sayılır.'
                full:
                  type: boolean
                  description: 'true ise o anki borcun tamamı ödenir.'
      responses:
        '201':
          description: Ödeme başlatıldı
          content:
            application/json:
              schema:
                type: object
                required: [payment_id, amount, balance, currency, status, redirect_url]
                properties:
                  payment_id: { type: integer }
                  amount: { type: integer, description: 'Ödenecek tutar (kuruş).' }
                  balance: { type: integer, description: 'İşlem başlatıldığı andaki borç (kuruş).' }
                  currency: { type: string, example: TRY }
                  status: { type: string, enum: [pending] }
                  redirect_url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

