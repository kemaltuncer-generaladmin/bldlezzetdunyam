openapi: 3.1.0

info:
  title: Benim Lezzet Dünyam — Sipariş API
  version: 1.0.0
  summary: Catering sipariş platformunun normatif API sözleşmesi.
  description: |
    Bu dosya **normatif sözleşmedir**. `docs/03-api-sozlesmesi.md` aynı sözleşmenin
    insan için yazılmış açıklamasıdır; ikisi çelişirse **bu dosya kazanır**.

    `packages/api_client` ve `website/lib/api` bu dosyadan üretilir.
    `platform/` aynı sözleşmeyi `openapi.json` olarak üretir; CI ikisi arasındaki
    anlamsal farkı kontrol eder ve fark varsa build kırmızıdır.

    ## Değişmezler
    - **Para** kuruş cinsinden tam sayıdır. `4550` = 45,50 TL. Ondalık float asla kullanılmaz.
    - **Tarih/saat** ISO 8601 UTC'dir. İstemci Europe/Istanbul'a çevirir.
    - **Uyumluluk:** alan eklenebilir; silinemez, adı/tipi değişemez. İstemciler bilmedikleri
      alanları yok sayar. Kırıcı değişiklik `/api/v2/` ile açılır.
    - **Kapsam dışı:** öğrenci ve kurum içi sipariş kanalları yoktur ve olmayacaktır
      (`docs/00-genel-bakis.md` §4). Sipariş çeşitliliği yalnızca `delivery_type` ile ifade edilir.

    ## Oran sınırları
    | Uç grubu | Sınır |
    |---|---|
    | `/auth/*` | 10 istek / dakika / IP |
    | `POST /orders` | 20 istek / saat / hesap |
    | `/kitchen/*` | 2000 istek / saat / cihaz (5 sn polling = 720/saat, üstüne BBD kuyruğu, heartbeat, sağlık, satış şalteri ve durum trafiği) |
    | `/control/kds/*` | 1200 istek / saat / **IP** (`bld-control`, K-21) |
    | `/addresses/suggest`, `/addresses/reverse` | 30 istek / dakika / **hesap** |
    | Diğer | 120 istek / dakika / IP |

    Mutfak sınırı **12.08.2026'da 1200'den 2000'e çıktı** ve bu tablo o gün
    güncellenmeden kalmıştı. Kasanın sürekli döngüleri tek başına 1140
    istek/saat ediyor (yoklama 720 + BBD kuyruğu 180 + heartbeat 60 + sağlık
    60 + satış şalteri 60 + abonelik 60); kalan pay F5, yeniden basma ve
    düzenleme ekranı gibi patlamalı kullanıcı trafiği için. Sınır aşıldığında
    kasa `429` alıyor ve **mutfak sipariş görmüyor** — ağ sağlam, sunucu
    ayakta, yalnız sayaç dolmuş olduğu için sahada teşhisi en zor arızalardan
    biri. Kaynak: `Extension::registerRateLimiters()`.

    Kontrol Merkezi sınırı neden **IP** başına: o yüzeyin kimliğini istek
    başına hesaplanan bir **imza** taşıyor, sabit bir anahtar değil — sayacı
    bağlayacak bir hesap kimliği yok. Kontrol Merkezi tek sunucudan çıkıyor,
    yani IP zaten o sistemin kendisi.

    Adres uçlarının sınırı neden **hesap** başına: dışarıdaki geocoder'a giden
    tek yol bu iki uç ve fatura orada doğuyor. IP başına sayılsaydı tek NAT
    arkasından çıkan bir ofisin çalışanları birbirini kilitlerdi — kurumsal
    müşterinin tipik ağı tam olarak budur.

    Sınır aşılırsa `429 RATE_LIMITED`.
  license:
    name: Tescilli — dahili kullanım
    identifier: LicenseRef-Proprietary

servers:
  - url: https://api.benimlezzetdunyam.com.tr/api
    description: Prod
  - url: https://staging-api.benimlezzetdunyam.com.tr/api
    description: Staging
  - url: http://localhost:4010/api
    description: Mock sunucu (infra/mock)

tags:
  - name: Sağlık
    description: Harici uptime izlemesi için. Kimlik gerektirmez.
  - name: Kimlik
    description: Müşteri kaydı, giriş, oturum. Token `customer` kapsamlıdır.
  - name: Katalog
    description: Vitrin ve menü. Kimlik gerektirmez; web sitesi bunları SSR ile çeker.
  - name: Adresler
    description: |
      Müşterinin adres defteri ve adres yazmayı kolaylaştıran yardımcı uçlar.
      Tümü kimlik gerektirir; müşteri yalnız kendi defterini görür.
  - name: Sipariş
    description: Müşterinin kendi siparişleri. Başkasının siparişi `404` döner.
  - name: Mutfak
    description: Tümü `kitchen` kapsamı gerektirir. Bu uçlar fiyat, müşteri iletişim bilgisi
      ve rapor **döndürmez**. Tek istisna, müşteri fişi ucundaki teslimat adresidir.
  - name: Site
    description: |
      Kurumsal web sitesinin içeriği. Kimlik gerektirmez — içeriğin tamamı
      zaten sitede herkese açık yayınlanıyor; token istemek statik üretimi
      zorlaştırıp hiçbir şeyi korumazdı.
  - name: Teklif
    description: |
      Kurumsal sitedeki "Teklif Al" formu. Kimlik gerektirmez — formu dolduran
      kişi henüz müşteri değil. Talepler panelde **İçerikler → Teklif
      Talepleri** ekranına düşer.
  - name: Sürüm
    description: İstemci sürüm kontrolü ve zorunlu güncelleme eşiği.
  - name: Cari hesap
    description: Kurumsal müşteri cari bakiye ve ekstre (B2B).
  - name: Abonelik
    description: Kurumsal öğle yemeği aboneliği — sipariş üreten kural (B2B).
  - name: Ortak
    description: |
      BLD'nin **istemcisi olmayan**, ayrı bir sistemle paylaşılan uçlar.
      Şu an tek üye BBD Store köprüsü (`POST /partner/bbd/orders`, K-16).
      Kimlik doğrulama paylaşılan sırla üretilen bir **HMAC imzasıdır**,
      token değil; `X-App-Id` / `X-App-Version` başlıkları istenmez —
      karşı taraf bizim uygulamamız değil.

      (Bu tanım K-21'de eklendi: etiket uçlarda kullanılıyordu ama `tags`
      listesinde tanımı yoktu ve üretilen belgede başlıksız bir bölüm
      olarak çıkıyordu.)
  - name: Kontrol Merkezi
    description: |
      **Yöneten** yüzey (K-21) — `/control/kds/*`. Ayrı bir depoda duran
      Kontrol Merkezi paneli mutfak kasalarını buradan yönetir: kasa açar,
      eşleme kodu üretir, iptal eder, ayar ve **kilit** iter, komut kuyruklar,
      sipariş revize eder ve durum geçirir.

      Kimlik doğrulama `ControlSignature`; cihaz token'ı **değil** ve
      `bbd.signature` **değil** (ikisinin de gerekçesi güvenlik şemasının
      açıklamasında). `X-App-Id` / `X-App-Version` / `Accept-Language`
      başlıkları **istenmez**: Kontrol Merkezi bir müşteri istemcisi değil,
      yöneten bir sistem.

      **Bu etiketteki her yazma ucu** `actor` + `reason` ister, `dry_run`
      kabul eder ve `veykemtu_control_audit` tablosuna **silinmeyen** bir
      denetim satırı bırakır. Fiyat gizliliği (ADR-08) burada geçerli
      **değildir**: kural mutfak kapsamına aitti, yönetim yüzeyine değil.

security:
  - CustomerToken: []

paths:

  /health:
    get:
      tags: [Sağlık]
      summary: Uptime kontrolü
      operationId: health
      security: []
      responses:
        '200':
          description: Ayakta
          content:
            application/json:
              schema:
                type: object
                required: [status, server_time]
                properties:
                  status: { type: string, const: ok }
                  server_time: { type: string, format: date-time }
        '429':
          $ref: '#/components/responses/RateLimited'

  # ─────────────────────────────── Kimlik ───────────────────────────────

  /auth/register:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Kimlik]
      summary: Müşteri kaydı
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Hesap oluştu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Kimlik]
      summary: Giriş
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '200':
          description: Giriş başarılı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/otp/request:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Kimlik]
      summary: Telefona giriş kodu gönder
      description: |
        Kurumsal müşteri her sipariş için şifre hatırlamak zorunda kalmasın diye
        ikinci bir giriş kapısı. E-posta + şifre yolu kapanmıyor.

        **Yanıt numara kayıtlı olsun olmasın AYNIDIR.** "Bu numara kayıtlı
        değil" demek, müşteri listesinin numara numara taranmasına izin
        vermek olurdu. Kayıtsız numaraya SMS gönderilmez; bunu yalnızca
        numaranın gerçek sahibi fark edebilir.

        Telefon biçimi serbesttir: `5551112233`, `05551112233`,
        `+905551112233` ve boşluklu yazımlar aynı numaraya çözülür.
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, minLength: 10, maxLength: 20, example: '05551112233' }
      responses:
        '202':
          description: İstek alındı (numara kayıtlıysa SMS gönderildi)
          content:
            application/json:
              schema:
                type: object
                required: [message, expires_in, resend_after]
                properties:
                  message: { type: string }
                  expires_in: { type: integer, description: 'Kodun ömrü (saniye).', example: 300 }
                  resend_after: { type: integer, description: 'Yeni kod istenebilmesi için beklenecek süre (saniye).', example: 60 }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/otp/verify:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Kimlik]
      summary: Giriş kodunu doğrula
      description: |
        Başarılı doğrulama şifreli girişle AYNI gövdeyi döndürür; istemci
        tarafında token'ın nereden geldiği fark etmez.

        Kod tek kullanımlıktır ve doğrulandığı anda aynı numaranın diğer açık
        kodları da tüketilir. Beş yanlış denemeden sonra kod ölür, yeni kod
        istenmelidir.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, minLength: 10, maxLength: 20, example: '05551112233' }
                code: { type: string, minLength: 6, maxLength: 6, example: '482913' }
      responses:
        '200':
          description: Giriş başarılı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '403':
          description: Hesap devre dışı (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Kimlik]
      summary: Token'ı iptal et
      operationId: logout
      responses:
        '204': { description: Çıkış yapıldı }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/me:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Kimlik]
      summary: Oturumdaki müşteri
      operationId: me
      responses:
        '200':
          description: Müşteri profili
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ─────────────────────────────── Katalog ──────────────────────────────
    patch:
      tags: [Kimlik]
      summary: Profil güncelle
      description: |
        Ad, soyad ve telefon güncellenir. Gönderilmeyen alanlar değişmez.

        **E-posta DEĞİŞTİRİLEMEZ.** Giriş kimliği odur; değiştirmek yeni
        adrese onay bağlantısı göndermeyi gerektirir, o olmadan hesabı
        başkasının e-postasına taşımanın yolu olur. Gövdede `email`
        gönderilirse sessizce yok sayılır.
      operationId: updateMe
      security:
        - CustomerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, maxLength: 64 }
                last_name: { type: string, maxLength: 64 }
                telephone:
                  type: string
                  pattern: '^[1-9][0-9]{9}$'
                  description: 10 hane, başında 0 veya +90 olmadan.
      responses:
        '200':
          description: Güncel profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Doğrulama hatası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/password:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Kimlik]
      summary: Parola değiştir
      description: |
        **Mevcut parola zorunludur.** Token'ı çalınmış bir oturumun
        parolayı değiştirip hesabı tamamen ele geçirmesini engelleyen tek
        şey budur.

        Başarılı olduğunda **diğer tüm token'lar iptal edilir** ve çağırana
        yeni bir token verilir. Parola değiştirmenin amacı "başkası
        giremesin"dir; eski oturumları açık bırakmak o amacı boşa çıkarır.

        `bld-auth` oran sınırına tabidir (dakikada 10): mevcut parolayı
        denemek kaba kuvvete açıktır.
      operationId: changePassword
      security:
        - CustomerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: Değiştirildi; yeni token döner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Mevcut parola yanlış veya doğrulama hatası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /locations:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Katalog]
      summary: Vitrinler
      description: |
        Faz 1'de tek vitrin döner. Dizi biçimi korunur ki ileride vitrin eklenirse
        istemciler kırılmasın.
      operationId: listLocations
      security: []
      responses:
        '200':
          description: Vitrin listesi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Location' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /locations/{id}/menu:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Katalog]
      summary: Vitrinin menüsü
      description: |
        `is_available: false` ürünler yanıtta **kalır** — istemci soluk gösterir,
        sepete eklenmesine izin vermez.
      operationId: getMenu
      security: []
      responses:
        '200':
          description: Kategoriler ve ürünler
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MenuCategory' }
        '404': { $ref: '#/components/responses/NotFound' }

  /locations/{id}/daily-menu:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: date
        in: query
        required: false
        description: |
          İşletme takvimindeki gün (Europe/Istanbul). Verilmezse **bugün**.
        schema: { type: string, format: date }
    get:
      tags: [Katalog]
      summary: Günün menüsü
      description: |
        Bir günün menüsü: paket olarak satılan bütün ve onu oluşturan kalemler.

        **Satılabilir olan yalnız budur.** `/locations/{id}/menu` bütün
        katalogu döndürmeye devam eder ama sipariş yalnız o günün menüsünden
        verilebilir; sunucu bunu `POST /orders` üzerinde yeniden denetler.

        Yayınlanmamış (taslak) bir gün **yokmuş gibi** döner (`id: null`,
        `items: []`). Yönetici bir ay öncesinden plan giriyor; yarım kalmış
        bir günün müşteriye görünmesi, pişmeyecek bir yemeğin satılması
        demek olurdu.

        `items[].price`, o gün için **geçerli** birim fiyattır: ürünün kendi
        fiyatı ya da o güne girilmiş fiyat istisnası. İstemci gördüğü fiyatla
        ödenecek fiyatı ayrı hesaplamaz.
      operationId: getDailyMenu
      security: []
      responses:
        '200':
          description: O günün menüsü. Menü yoksa da 200 döner — boş gün bir hata değildir.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DailyMenu' }
        '404': { $ref: '#/components/responses/NotFound' }

  /locations/{id}/menu-calendar:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: from
        in: query
        required: false
        description: Başlangıç günü. Verilmezse bugün.
        schema: { type: string, format: date }
      - name: to
        in: query
        required: false
        description: |
          Bitiş günü (dahil). Verilmezse `from` + 30 gün. Aralık en fazla
          **92 gün** olabilir; daha genişi `422 VALIDATION_FAILED`.
        schema: { type: string, format: date }
    get:
      tags: [Katalog]
      summary: Menü takvimi
      description: |
        Bir aralıktaki günlerin durumu — gün seçiciyi çizmek için.

        Yalnız **menüsü olan ya da kapalı olan** günler döner; hiçbir şeyi
        olmayan gün listede yer almaz. Yüz günlük boş bir dizi göndermek,
        istemciye "her gün bir şey var" izlenimi verip her birini ayrı
        sorgulatırdı.
      operationId: getMenuCalendar
      security: []
      responses:
        '200':
          description: Günler
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MenuCalendarDay' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ─────────────────────────────── Sipariş ──────────────────────────────

  /addresses:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Adresler]
      summary: Adres defteri
      description: |
        Müşterinin kayıtlı adresleri. Varsayılan adres başta döner.

        Bu liste **sipariş adreslerini içermez**: her sipariş kendi
        değişmez adres kopyasını tutar. İkisi karışsaydı, kırk sipariş
        veren müşteri defterinde kırk satır görürdü.
      operationId: listAddresses
      security:
        - CustomerToken: []
      responses:
        '200':
          description: Adres listesi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SavedAddress' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Adresler]
      summary: Adres ekle
      description: |
        İlk adres kendiliğinden varsayılan olur — müşteriyi tek adresi
        için ayrıca "varsayılan yap" demeye zorlamak anlamsız.
      operationId: createAddress
      security:
        - CustomerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedAddressInput' }
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedAddress' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Doğrulama hatası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # Sabit parçalı iki yol, `/addresses/{id}` ÖNÜNDE tanımlıdır ve sunucuda da
  # o sırayla kaydedilmelidir. `{id}` tamsayı olarak yazılı olsa bile yönlendirici
  # önce eşleşeni alır; `/addresses/{id}` üstte kalsaydı `suggest` bir kimlik
  # sanılıp `404` dönerdi.

  /addresses/suggest:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: q
        in: query
        required: true
        description: |
          Aranan serbest metin — mahalle, sokak, bina adı ya da bunların
          karışımı.

          **En az 3 karakter.** Tek harfe geocoder çağırmak sağlayıcı kotasını
          "k", "ka" gibi hiçbir şey ayırt etmeyen sorgularla yakar ve
          önbelleği de aynı çöple doldurur.

          İstemci yazarken **300 ms debounce** uygular ve 3 karakterin altında
          hiç çağırmaz. Sunucu kuralı yine de denetler: istemcideki debounce
          bir kolaylıktır, kota koruması değildir.
        schema:
          type: string
          minLength: 3
          maxLength: 120
          examples: ['Feritpaşa Kültür']
      - name: limit
        in: query
        required: false
        description: |
          Kaç öneri dönsün. Üst sınır **10**: liste bir metin alanının altında
          açılan bir katman ve telefonda onuncu satır zaten klavyenin altında
          kalıyor. Ayrıca her satır sağlayıcıdan gelen bir yük.
        schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
    get:
      tags: [Adresler]
      summary: Adres önerisi
      description: |
        Müşteri adresi yazarken açılan öneri listesi. Seçilen öneri hem metin
        alanlarını hem de harita iğnesini tek dokunuşta doldurur.

        **Sonuçlar hizmet alanı kutusuna kilitlidir** (`docs/00-genel-bakis.md`
        §hizmet alanı; sunucudaki karşılığı `Services\ServiceArea`). Kutu
        dışındaki eşleşmeler yanıttan **düşürülür**, "teslimat yok" diye
        işaretlenip gösterilmez: müşteriye seçebileceğini sandığı bir satır
        gösterip ödeme ekranında reddetmek, o satırı hiç göstermemekten daha
        kötüdür.

        Öneri nesnesindeki `latitude`/`longitude` **her zaman doludur** —
        kutuya göre eleme zaten koordinat üzerinden yapılıyor, koordinatı
        olmayan bir aday listeye giremez.

        ## Sağlayıcıya ulaşılamazsa: `200` + boş `data`

        Geocoder çöktüğünde, zaman aşımına uğradığında ya da kotası dolduğunda
        bu uç **hata döndürmez**; boş bir liste döner. Öneri bir
        **kolaylıktır**: adres alanları elle de doldurulabiliyor ve harita
        iğnesi isteğe bağlı. Sağlayıcı arızasını `5xx` yapmak, dışarıdaki bir
        servisin kendi sipariş akışımızı durdurabilmesi demek olurdu.

        Boş liste iki farklı şeyi anlatır ve istemci ikisini **ayırt etmez**:
        "bu metne uyan adres yok" ve "şu an öneri veremiyoruz". İkisinde de
        doğru davranış aynıdır — alanları elle doldurtmak. Ayrım sunucu
        günlüğüne yazılır, kullanıcıya değil.

        İstemci bu yüzden öneri listesini **hiçbir zaman zorunlu bir adım**
        yapmaz: liste boşsa form yine gönderilebilir olmalıdır.

        ## `422` ne zaman

        Yalnızca isteğin kendisi bozuksa: `q` yok ya da 3 karakterden kısa.
        Bu bir istemci hatasıdır (debounce kapısı sızdırmış demektir), kullanıcı
        hatası değil — sağlayıcı arızasıyla aynı yanıta karışmasın diye ayrı
        tutuluyor.
      operationId: suggestAddresses
      security:
        - CustomerToken: []
      responses:
        '200':
          description: |
            Öneri listesi. Eşleşme yoksa **ya da** sağlayıcıya ulaşılamıyorsa
            `data: []` — ikisi de `200`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items: { $ref: '#/components/schemas/AddressSuggestion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /addresses/reverse:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: lat
        in: query
        required: true
        description: İğnenin enlemi.
        schema: { type: number, format: double, minimum: -90, maximum: 90 }
      - name: lng
        in: query
        required: true
        description: |
          İğnenin boylamı. `lat` ile birlikte **zorunludur**; yarısı gelen bir
          çift `422` döner. Kayıtlı adreste yarım koordinat sessizce `null`'a
          düşüyor (bkz. `SavedAddressInput`) ama burada çifti tamamlamanın
          yolu yok — sorulacak bir nokta yoksa soru da yoktur.
        schema: { type: number, format: double, minimum: -180, maximum: 180 }
    get:
      tags: [Adresler]
      summary: Koordinattan adres (ters geocoding)
      description: |
        Haritaya iğne bırakıldığında adres metnini kendiliğinden doldurur.
        `/addresses/suggest`'in tersi: orada metinden noktaya, burada noktadan
        metne gidiliyor.

        **Yanıttaki `latitude`/`longitude`, isteğin kendi koordinatlarıdır** —
        sağlayıcının oturttuğu (snap) nokta değil. Geocoder tipik olarak
        sokak ya da bina merkezine oturtur; istemci o noktayı iğneye
        yazsaydı iğne kullanıcının parmağının altından birkaç on metre
        kayardı. Kapıyı müşteri biliyor, geocoder değil: sağlayıcıdan yalnız
        **metin** alınır.

        Kutu dışı nokta `422 VALIDATION_FAILED` döner
        (`details.reason = "out_of_service_area"`). Bu bir kolaylık ucu olsa da
        buradaki `422` doğru yanıttır: kullanıcı haritayı gördü ve teslimat
        yapmadığımız bir yeri kasten seçti; sessiz bir boş yanıt "arıza var"
        gibi okunur, oysa söylenecek net bir şey var.

        Sağlayıcıya ulaşılamazsa `200` + `data: null` — gerekçe
        `/addresses/suggest` ile aynıdır. Aynı şey, sağlayıcının o noktada
        adres bilmediği durumda da döner (arazi, yeni yapılan yol): istemci
        iğneyi **korur** ve metin alanlarını elle doldurtur. İki durumun
        ayrımı kullanıcı için bir fark yaratmaz.
      operationId: reverseGeocodeAddress
      security:
        - CustomerToken: []
      responses:
        '200':
          description: |
            Tek öneri nesnesi. `data: null` = sağlayıcı o noktayı bilmiyor ya
            da şu an erişilemiyor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/AddressSuggestion'
                      - type: 'null'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: |
            `lat`/`lng` eksik, aralık dışı ya da hizmet alanı kutusunun
            dışında (`details.reason = "out_of_service_area"`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /addresses/{id}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Adresler]
      summary: Adres güncelle
      description: |
        Defterdeki kaydı değiştirir. **Geçmiş siparişlerin adresini
        DEĞİŞTİRMEZ** — onlar kendi kopyalarını taşır.
      operationId: updateAddress
      security:
        - CustomerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedAddressInput' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedAddress' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Doğrulama hatası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Adresler]
      summary: Adres sil
      description: |
        Defterden siler. Geçmiş siparişler etkilenmez.

        Silinen adres varsayılansa, kalanlardan biri varsayılan yapılır:
        müşteri ödeme ekranında hiçbir adres seçili görmemeli.
      operationId: deleteAddress
      security:
        - CustomerToken: []
      responses:
        '204': { description: Silindi }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Sipariş]
      summary: Sipariş oluştur
      description: |
        Tutar **sunucuda** hesaplanır. İstemcinin gönderdiği tutar alanları yok sayılır.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '201':
          description: Sipariş oluştu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: |
            Doğrulama hatası. Olası kodlar: `VALIDATION_FAILED`, `LOCATION_CLOSED`,
            `ITEM_UNAVAILABLE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Sipariş]
      summary: Kendi siparişlerim
      description: En yeni önce.
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Sipariş listesi
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrderSummary' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Sipariş]
      summary: Sipariş detayı
      description: |
        Başkasının siparişi istenirse **`404 NOT_FOUND`** döner — varlık sızdırılmaz
        (`403` dönmek siparişin var olduğunu ele verirdi).
      operationId: getOrder
      responses:
        '200':
          description: Sipariş
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/orders/{id}/tracking:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Sipariş]
      summary: İmzalı takip (giriş gerektirmez)
      description: |
        Fişteki takip QR'ının arkasındaki uç (K-20). **Kimlik gerektirmez**;
        yetki URL'deki HMAC imzasındadır.

        NEDEN AYRI BİR UÇ: `GET /orders/{id}` oturum istiyor ve fişteki QR'ı
        okutan müşteri sipariş durumunu değil giriş ekranını görüyordu. Aynı
        uca "imza varsa oturumu atla" diye bir kapı açmak, tek bir uçta iki
        farklı yetki seviyesi demekti; ilk dikkatsiz düzenleme adresi kimliği
        doğrulanmamış ziyaretçiye açardı. Ayrı rota, yetki sınırını bir
        yönlendirme gerçeği hâline getiriyor.

        Yanıt siparişin **daraltılmış** yüzüdür: adres, ad, telefon ve kalem
        listesi dönmez (`PublicOrderTracking`).

        Girişli `/orders/{id}` ve `/siparis/{id}` sayfası olduğu gibi duruyor.
      operationId: getPublicOrderTracking
      security: []
      parameters:
        - name: e
          in: query
          required: true
          schema: { type: integer, format: int64 }
          description: Son geçerlilik (unix saniye). İmzaya dâhildir — uzatılamaz.
        - name: s
          in: query
          required: true
          schema: { type: string }
          description: base64url kodlu, 128 bite kırpılmış HMAC-SHA256.
      responses:
        '200':
          description: Takip özeti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicOrderTracking' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Sipariş]
      summary: Siparişi iptal et
      description: Yalnızca `yeni` ve `onaylandi` durumlarında. Sonrasında `422 INVALID_TRANSITION`.
      operationId: cancelOrder
      responses:
        '200':
          description: Güncel sipariş
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidTransition' }

  # ────────────────────────────── Cari hesap ────────────────────────────

  /account/summary:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
