  /subscriptions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Abonelik]
      summary: Aboneliği iptal et
      operationId: cancelSubscription
      security:
        - CustomerToken: []
      responses:
        '200':
          description: Güncel abonelik
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /subscriptions/{id}/exceptions:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Abonelik]
      summary: Tek-günlük istisna gir
      description: Belirli bir günü atla veya adedini değiştir (kural değişimi değil).
      operationId: addSubscriptionException
      security:
        - CustomerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionExceptionInput' }
      responses:
        '200':
          description: Güncel abonelik
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/push-token:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Sipariş]
      summary: FCM push token'ı kaydet
      operationId: registerPushToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token, platform]
              properties:
                fcm_token: { type: string, minLength: 1 }
                platform: { type: string, enum: [android] }
      responses:
        '204': { description: Kaydedildi }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ─────────────────────────────── Mutfak ───────────────────────────────

  /kitchen/pair:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Mutfak]
      summary: Cihaz eşleme
      description: |
        Admin panelden alınan tek kullanımlık kod ile cihaz kaydı. Dönen token süresizdir,
        admin panelden iptal edilebilir (sonraki isteklerde `403 DEVICE_REVOKED`).
      operationId: pairKitchenDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairing_code, device_name]
              properties:
                pairing_code:
                  type: string
                  pattern: '^[A-Z0-9]{4}-[A-Z0-9]{4}$'
                  examples: ['K7X2-9QMD']
                device_name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Eşleme başarılı
          content:
            application/json:
              schema:
                type: object
                required: [device_id, token, server_time]
                properties:
                  device_id: { type: integer, format: int64 }
                  token: { type: string }
                  server_time: { type: string, format: date-time }
        '404':
          description: Kod geçersiz veya süresi dolmuş
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /kitchen/orders:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Mutfak]
      summary: Aktif siparişler
      description: |
        Varsayılan: `teslim_edildi` ve `iptal` **hariç** bugünün siparişleri.

        **Artımlı çekme.** Yanıttaki `max_id` bir sonraki isteğin `after` değeridir;
        `server_time` bir sonraki isteğin `since` değeridir. Durum değişimlerini yakalamak
        için `since` kullanılmalıdır — `after` yalnızca yeni siparişleri getirir.
      operationId: listKitchenOrders
      security:
        - KitchenToken: []
      parameters:
        - name: after
          in: query
          description: Bu sipariş kimliğinden büyükleri getir (yalnızca yeni siparişler).
          schema: { type: integer, format: int64 }
        - name: since
          in: query
          description: Bu zaman damgasından sonra **güncellenenleri** getir.
          schema: { type: string, format: date-time }
        - name: include_completed
          in: query
          description: '`true` ise bugünün tamamlananları da gelir.'
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Sipariş listesi
          content:
            application/json:
              schema:
                type: object
                required: [data, server_time, max_id]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KitchenOrder' }
                  server_time:
                    type: string
                    format: date-time
                    description: Bir sonraki `since` değeri.
                  max_id:
                    type: integer
                    format: int64
                    description: Bir sonraki `after` değeri. Liste boşsa önceki değer korunur.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }

  /kitchen/subscription-orders:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Mutfak]
      summary: Bugün ve yarının abonelik siparişleri
      description: |
        Ana pano (`/kitchen/orders`) yalnız bugünü gösterir. Abonelik yemekleri
        önceden hazırlandığı için mutfak yarını da görmek ister. Bu uç yalnız
        `is_subscription` siparişleri, terminal olmayanları döner; salt bilgidir
        (durum ilerletme ana panoda). `today`/`tomorrow` ayrı gruplanır.
      operationId: listKitchenSubscriptionOrders
      security:
        - KitchenToken: []
      responses:
        '200':
          description: Bugün ve yarının abonelik siparişleri
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KitchenSubscriptionOrders' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }

  /kitchen/orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Mutfak]
      summary: Durum ilerlet
      description: |
        Geçiş matrisi `docs/02-veri-modeli.md` §3'tedir ve **sunucuda** uygulanır.
        `yolda` yalnızca `delivery_type=delivery` siparişlerde geçerlidir.
      operationId: setKitchenOrderStatus
      security:
        - KitchenToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: Güncel sipariş özeti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KitchenOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidTransition' }

  /kitchen/orders/{id}/receipt:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Mutfak]
      summary: Fiş içeriği
      description: |
        Yazdırma verisini **sunucu** hazırlar; KDS yalnızca ESC/POS'a biçimlendirip basar.
        Fiş metninin ne yazacağına dair karar istemcide değildir.
      operationId: getReceipt
      security:
        - KitchenToken: []
      parameters:
        - name: type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ReceiptType' }
      responses:
        '200':
          description: Fiş verisi
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/KitchenReceipt'
                  - $ref: '#/components/schemas/CustomerReceipt'
                  - $ref: '#/components/schemas/CourierReceipt'
                discriminator:
                  propertyName: type
                  mapping:
                    mutfak: '#/components/schemas/KitchenReceipt'
                    musteri: '#/components/schemas/CustomerReceipt'
                    kurye: '#/components/schemas/CourierReceipt'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
        '404': { $ref: '#/components/responses/NotFound' }

  /kitchen/print-jobs/{order_id}/ack:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: order_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Mutfak]
      summary: Fiş basıldı bildirimi
      description: |
        Denetim içindir. **İdempotent:** aynı `(order_id, type, revision)` üçlüsü için
        tekrarlanan çağrı yeni kayıt açmaz, yine `204` döner. KDS bu çağrı başarısız
        olursa sessizce yutar — fişin basılmış olması ack'e bağlı değildir.

        **K-20:** tekillik eskiden `(order_id, type)` çiftiydi ve revizyon sonrası
        yeniden basılan fişin ack'i **sessizce yutuluyordu**. Sonucu `printed_at`
        alanında görünüyordu: yeniden basılan fiş, yerini aldığı ESKİ fişin saatiyle
        damgalanıyordu. Elinde iki kâğıt olan kurye hangisinin yeni olduğunu
        kâğıttaki tek zaman damgasından anlayamıyordu.
      operationId: ackPrintJob
      security:
        - KitchenToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, printed_at]
              properties:
                type: { $ref: '#/components/schemas/ReceiptType' }
                printed_at: { type: string, format: date-time }
                revision:
                  type: integer
                  minimum: 0
                  default: 0
                  description: |
                    Fişin hangi revizyon için basıldığı (K-20). Alan
                    **isteğe bağlıdır**: göndermeyen eski KDS sürümleri `0`
                    kovasına düşer, yani düzenlenmemiş sipariş için bugünkü
                    davranış aynen sürer.
      responses:
        '204': { description: Kaydedildi }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
        '404': { $ref: '#/components/responses/NotFound' }

  /kitchen/production-list:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Mutfak]
      summary: Üretim listesi
      description: |
        Aktif siparişlerin (`onaylandi` + `hazirlaniyor`) ürün bazında toplamı.
        Çoktan aza sıralıdır.
      operationId: getProductionList
      security:
        - KitchenToken: []
      responses:
        '200':
          description: Ürün toplamları
          content:
            application/json:
              schema:
                type: object
                required: [data, as_of]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [menu_id, name, total]
                      properties:
                        menu_id: { type: integer, format: int64 }
                        name: { type: string }
                        total: { type: integer, minimum: 0 }
                  as_of: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }

  /kitchen/busy:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Mutfak]
      summary: Yoğunluk şalteri
      description: |
        Mutfaktaki tek tuş. Açıkken müşteri arayüzlerinde gecikme uyarısı
        çıkar ve admin panelde görünür.

        **Sipariş almayı DURDURMAZ.** Siparişi gerçekten kesen şalter
        `ordering_enabled`'dır; onun mutfak ucu `POST /kitchen/ordering`
        (K-11) ve orada onay + sebep + süre + kasanın açılış şifresi
        isteniyor. Bu uç yalnızca uyarır.

        Durum vitrine yazılır, cihaza değil: iki kasa olsa ikisi de aynı
        şeyi gösterir ve müşteri tarafı zaten vitrini okur.
      operationId: setKitchenBusy
      security:
        - KitchenToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [busy]
              properties:
                busy: { type: boolean }
      responses:
        '200':
          description: Yeni durum
          content:
            application/json:
              schema:
                type: object
                required: [busy, busy_message, server_time]
                properties:
                  busy: { type: boolean }
                  busy_message: { type: string }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
        '422':
          description: Doğrulama hatası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /partner/bbd/orders:
    post:
      tags: [Ortak]
      summary: BBD Store siparişi (webhook)
      description: |
        **BBD Store bir KİTAP e-ticaret sitesidir**, catering değil; ayrı
        bir sunucuda ayrı bir projedir.

        **KÖPRÜNÜN TEK VARLIK SEBEBİ TERMAL YAZICIYI PAYLAŞMAK (K-16).**
        BBD'de bir sipariş onaylandığında mutfaktaki kasa BBD'ye özel bir
        ses çalıyor ve aynı yazıcıdan bir **paketleme fişi** basıyor.
        Başka hiçbir şey yok.

        Bu siparişler BLD'nin `orders` tablosuna **girmez**, KDS
        panosunda görünmez, üretim listesine / vardiya istatistiğine /
        `orders_today` sayacına / cari hesaba **karışmaz**. Tek bağ ses
        ve kâğıttır; geri bildirim, durum senkronizasyonu yoktur.

        **Kimlik doğrulama HMAC imzasıyla, token'la değil.** Arada
        paylaşılan tek şey bir sır; sabit bir Bearer token her istekte
        ağdan geçen ve loglara düşen bir parola olurdu.

        ```
        imza = HMAC_SHA256(BBD_WEBHOOK_SECRET, ham istek gövdesi)
        X-BBD-Signature: sha256=<hex>
        ```

        İmza **ham gövde** üzerinde hesaplanır; JSON yeniden
        serileştirilmez (boşluk ve anahtar sırası imzayı değiştirir).

        **İDEMPOTENT:** aynı `external_id` ikinci kez gelirse yeni satır
        açılmaz, fiş iki kez basılmaz ve yanıt yine `200` olur
        (`accepted: false`). `409` dönmek, karşı tarafı sonsuz yeniden
        denemeye sokardı.

        `X-App-Id` / `X-App-Version` başlıkları **istenmez**: BBD bizim
        istemcimiz değil, ortak bir sistem.
      operationId: receiveBbdOrder
      security: []
      parameters:
        - name: X-BBD-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: '`external_id` ile aynı olmalı; tekilleştirme gövdeye bakar.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BbdOrderRequest' }
      responses:
        '200':
          description: Alındı (yeni ya da tekrar)
          content:
            application/json:
              schema:
                type: object
                required: [external_id, accepted, server_time]
                properties:
                  external_id: { type: string }
                  accepted:
                    type: boolean
                    description: '`false` = bu `external_id` zaten kayıtlıydı.'
                  server_time: { type: string, format: date-time }
        '401':
          description: İmza doğrulanamadı ya da sır yapılandırılmamış
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Şema hatası — tekrar denemek işe yaramaz
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /kitchen/bbd-orders:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Mutfak]
      summary: Basılmayı bekleyen BBD fişleri
      description: |
        `since` YOK, `printed_at IS NULL` VAR: BBD fişleri bir liste
        değil, bir **kuyruk**. Zaman damgasıyla artımlı çekmek, ağ
        kesintisinde basılmamış bir fişi sonsuza dek atlayabilirdi.

        Kasa **yalnız basım başarılıysa** ack gönderiyor; başarısızsa fiş
        kuyrukta kalıyor ve bir sonraki turda geri geliyor.

        En fazla 20 satır döner: kasa uzun süre kapalı kalmışsa 200 fişi
        tek seferde basmaya kalkmamalı.
      operationId: listBbdOrders
      security: [{ KitchenToken: [] }]
      responses:
        '200':
          description: Bekleyen fişler
          content:
            application/json:
              schema:
                type: object
                required: [data, server_time]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BbdQueuedReceipt' }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }

  /kitchen/bbd-orders/{receipt}/ack:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: receipt
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Mutfak]
      summary: BBD fişi basıldı
      description: |
        İdempotent: ilk `printed_at` korunur. Ağ hatasında kasa tekrar
        gönderirse "ne zaman basıldı" cevabı değişmemeli.
      operationId: ackBbdReceipt
      security: [{ KitchenToken: [] }]
      responses:
        '204': { description: Kaydedildi }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
        '404': { $ref: '#/components/responses/NotFound' }

  /kitchen/subscription-plan:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Mutfak]
      summary: Abonelik üretim planı
      description: |
        Mutfağın sabah baktığı ekran (K-15). `subscription-orders`
        ucundan farkı: **ürün bazında toplamlar**, teslimat saatleri ve
        **uyarılar** taşır.

        Uyarılar en önemli parçadır ve en kolay atlanandır: üretim
        koşmamışsa (`not_generated`) mutfak "bugün abonelik yok" sanıp
        hazırlık yapmıyor. Diğerleri kapalı gün, duraklatılmış abonelik
        ve tek-gün istisnaları.
      operationId: getSubscriptionPlan
      security: [{ KitchenToken: [] }]
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: string
            enum: [today, tomorrow, week]
            default: today
          description: |
            `today` = bugün + yarın. `week` yalnız istendiğinde
            hesaplanır — mutfağın bakmadığı altı gün için boşuna sorgu
            olmasın.
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema:
                type: object
                required: [days, server_time]
                properties:
                  days:
                    type: array
                    items: { $ref: '#/components/schemas/SubscriptionPlanDay' }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }

  /kitchen/orders/{id}/editable:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Mutfak]
      summary: Düzenlenebilir sipariş görüntüsü
      description: |
        **FİYAT YOKTUR** (ADR-08). Personel adet değiştirirken fiyata
        bakmıyor; iade/fark tutarı kaydetme onayında tek bir sayı olarak
        gösteriliyor ve o cari bakiye değil.
      operationId: getEditableOrder
      security: [{ KitchenToken: [] }]
      responses:
        '200':
          description: Düzenlenebilir sipariş
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EditableOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
        '404': { $ref: '#/components/responses/NotFound' }

  /kitchen/orders/{id}/revisions:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Mutfak]
      summary: Revizyon geçmişi
      operationId: listOrderRevisions
      security: [{ KitchenToken: [] }]
      responses:
        '200':
          description: Revizyonlar
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrderRevision' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Mutfak]
      summary: Siparişi düzenle (yeni revizyon)
      description: |
        **AKIŞ (K-12).** Mutfak personeli müşteriyle **telefonda konuşur**,
        anlaşır, sonra değişikliği buraya yazar. Onay beklenmez; onay zaten
        alınmıştır. Bu uç bir talep değil, bir **kayıt** ucudur.

        Sunucu tek işlemde: satırları yeniden yazar, toplamları yeniden
        hesaplar, `orders.updated_at`'i **dokunur** (KDS'in değişikliği
        görmesi buna bağlı), revizyon belgesini yazar, cari hesabı düzeltir
        ve gerekiyorsa iade başlatır.

        `items` **tam listedir**, fark değil: eksik gönderilen kalem
        siparişten çıkarılır. Boş liste `422` — tümünü kaldırmak "iptal"
        demektir ve o ayrı bir durum geçişidir.

        Teslim edilmiş ya da iptal edilmiş sipariş düzenlenemez (`422`).

        Abonelikten doğan sipariş düzenlenebilir ama **yalnız o günü**
        etkiler; abonelik tanımı değişmez.
      operationId: createOrderRevision
      security: [{ KitchenToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, items]
              properties:
                reason: { type: string, maxLength: 160 }
                note: { type: [string, 'null'], maxLength: 1000 }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [menu_id, quantity]
                    properties:
                      menu_id: { type: integer, format: int64 }
                      quantity: { type: integer, minimum: 1, maximum: 999 }
                      option_value_ids:
                        type: array
                        items: { type: integer, format: int64, minimum: 1 }
                        description: |
                          Kalemde seçili seçenek değerlerinin kimlikleri.
                          `options` aynı seçeneklerin insana gösterilen
                          adlarıdır; ikisi eşleniktir. İstemci düzenlemede
                          bunu `GET .../editable` yanıtındaki
                          `items[].option_value_ids` alanından **AYNEN geri
                          göndermelidir** — göndermezse sunucu satırı
                          seçeneksiz yeniden fiyatlar ve seçenek sessizce
                          kaybolur. Kimlik kaydı bulunmayan eski satırlarda
                          `editable` **boş dizi** döner.

                          Değerler `menu_option_value_id`'dir
                          (`LineResolver::resolve`); ürün seçicideki
                          `options[].values[].id` alanı da aynı kimliği
                          taşır.

                          `required` listesinde **yoktur**: alan sonradan
                          eklendi ve seçeneksiz ürünlerde hiç gönderilmez.
                      note: { type: [string, 'null'], maxLength: 255 }
                requested_at: { type: [string, 'null'], format: date-time }
                customer_note: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: Revizyon uygulandı
          content:
            application/json:
              schema:
                type: object
                required: [order, revision]
                properties:
                  order: { $ref: '#/components/schemas/KitchenOrder' }
                  revision: { $ref: '#/components/schemas/OrderRevisionResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Düzenlenemez sipariş ya da doğrulama hatası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /kitchen/menu:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Mutfak]
      summary: Ürün ekleme için menü (fiyatsız)
      description: |
        Düzenleme ekranının ürün seçicisi. Yalnız **eklenebilir** ürünleri
        döndürür; `menu-availability` ucundan farkı bu — orada amaç
        kapatmak/açmak olduğu için kapalı ürünler de listelenir.
      operationId: getKitchenMenu
      security: [{ KitchenToken: [] }]
      responses:
        '200':
          description: Ürünler
          content:
            application/json:
              schema:
                type: object
                required: [data, server_time]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KitchenMenuItem' }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }

  /kitchen/ordering:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Mutfak]
      summary: Satış şalterinin durumu
      description: |
        Süresi dolmuş bir durdurma bu uçta **kendiliğinden kalkar** —
        yanıt her zaman gerçeği söyler. Tembel değerlendirme bilinçli:
        zamanlayıcıya bağlansaydı, kuyruk durduğunda dükkân kapalı
        kalırdı.
      operationId: getKitchenOrdering
      security: [{ KitchenToken: [] }]
      responses:
        '200':
          description: Şalter durumu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KitchenOrdering' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
    post:
      tags: [Mutfak]
      summary: Sipariş almayı durdur / aç
      description: |
        **KURAL DEĞİŞİKLİĞİ (K-11, 11.08.2026).** `ordering_enabled`
        eskiden yalnız yöneticinindi (`docs/03` §3: "mutfak personeli tek
        tuşla cirosu kapatabilmemeli"). Sahada kural tersine işledi:
        yazıcı bozulduğunda ya da malzeme bittiğinde mutfak sipariş
        almaya devam ediyor, gelenleri tek tek telefonla iptal ediyordu.
        Müşteri için "siparişim alındı, sonra arandı ve iptal edildi",
        kapalı bir dükkândan çok daha kötü.

        Şalter artık mutfaktan da çevriliyor ama **tek tuşla değil**: kasa
        onay, sebep, süre ve açılış şifresi istiyor (`docs/05` §11).

        `minutes` anlamları:
        * yok / `null` — süresiz (elle açılana kadar),
        * `0` — bugünün sonuna kadar (yarın sabah kendiliğinden açılır),
        * `>0` — o kadar dakika.

        `reason` müşteriye gösterilir (`Location.ordering_pause_reason`).
      operationId: setKitchenOrdering
      security: [{ KitchenToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                reason: { type: [string, 'null'], maxLength: 160 }
                minutes: { type: [integer, 'null'], minimum: 0, maximum: 1440 }
      responses:
        '200':
          description: Yeni durum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KitchenOrdering' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
        '422':
          description: Doğrulama hatası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /kitchen/menu-availability:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Mutfak]
      summary: Ürünler ve "bugün tükendi" işaretleri
      description: |
        **FİYAT YOKTUR** — ADR-08 korunuyor. Mutfak neyin bittiğine karar
        verirken fiyata bakmıyor; para bilgisi bu ekranda yalnızca
        sızıntı riski.

        `listed` yöneticinin KALICI kararı (`menus.menu_status`),
        `sold_out` mutfağın GÜNLÜK kararı. İkisi ayrı tutuluyor: aynı
        alanı paylaşsalardı akşam tükenen ürünü sabah yöneticinin elle
        geri açması gerekirdi.
      operationId: getKitchenMenuAvailability
      security: [{ KitchenToken: [] }]
      responses:
        '200':
          description: Ürün listesi
          content:
            application/json:
              schema:
                type: object
                required: [data, server_time]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KitchenMenuItem' }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
    post:
      tags: [Mutfak]
      summary: Ürünü bugünlük tükendi işaretle / işareti kaldır
      description: |
        İşaret **gün dönümünde kendiliğinden geçersizleşir**; temizleyecek
        bir cron yoktur, dolayısıyla cron durduğunda ürünlerin kapalı
        kalması gibi bir arıza da yoktur.

        **Abonelik siparişleri bu işaretten etkilenmez**: abonelik bir
        sözleşmedir, günlük stok kararı onu iptal edemez. Bir abonelik
        gününü atlamak için `veykemtu_subscription_exceptions` kaydı
        girilir — ayrı ve bilinçli bir karardır.
      operationId: setKitchenMenuAvailability
      security: [{ KitchenToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [menu_id, sold_out]
              properties:
                menu_id: { type: integer, format: int64 }
                sold_out: { type: boolean }
                reason: { type: [string, 'null'], maxLength: 160 }
      responses:
        '200':
          description: Güncel ürün listesi
          content:
            application/json:
              schema:
                type: object
                required: [data, server_time]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KitchenMenuItem' }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Doğrulama hatası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /kitchen/health:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Mutfak]
      summary: Kasa sağlık bildirimi
      description: |
        Kasa kendi durumunu bildirir, sunucu da kasanın bilemeyeceğini
        döndürür. **Çift yönlü olması bilinçlidir:** ekrandaki sağlık
        paneli ikisini birden gösteriyor ve iki ayrı çağrı yapmasının
        anlamı yok.

        Bugünkü sipariş sayısını cihaz hesaplayamaz: mutfak listesi
        yalnızca **aktif** siparişleri taşır, teslim edilenler düşer.
        Vardiya boyunca kaç sipariş geçtiğini yalnızca sunucu bilir.

        `heartbeat` ile karıştırılmamalı: o yalnızca "cihaz ayakta"
        der. "Ayakta" ile "çalışıyor" aynı şey değildir — yazıcının
        kâğıdı bitmiş, kuyrukta on basılmamış fiş birikmiş ve uygulama
        hâlâ düzenli yoklama yapıyor olabilir.

        Bildirilen değerler **doğrulanmaz**, kaydedilir. Yazıcının
        gerçekten çalıştığını sunucudan anlamanın yolu yok; cihazın
        beyanına güveniyoruz ve zaman damgasıyla saklıyoruz ki bayat veri
        taze sanılmasın.
      operationId: reportKitchenHealth
      security:
        - KitchenToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [printer_ok, print_queue_pending, print_queue_failed]
              properties:
                printer_ok:
                  type: boolean
                  description: Yazıcı cihazına yazılabiliyor mu?
                print_queue_pending:
                  type: integer
                  minimum: 0
                  description: Kuyrukta bekleyen fiş sayısı.
                print_queue_failed:
                  type: integer
                  minimum: 0
                  description: Basılamamış ve vazgeçilmiş fiş sayısı.
                app_version: { type: string, maxLength: 32 }
                command_results:
                  type: array
                  maxItems: 50
                  description: Bir önceki turda teslim edilen komutların sonuçları.
                  items:
                    type: object
                    required: [id, ok]
                    properties:
                      id: { type: integer, format: int64 }
                      ok: { type: boolean }
                      message: { type: [string, 'null'], maxLength: 255 }
      responses:
        '200':
          description: Vitrin özeti
          content:
            application/json:
              schema:
                type: object
                required: [server_time, orders_today, orders_active]
                properties:
                  server_time: { type: string, format: date-time }
                  orders_today:
                    type: integer
                    description: |
                      Bugün oluşturulan sipariş sayısı, **iptaller hariç**.
                      Gün sınırı Europe/Istanbul'a göredir: UTC gece yarısı
                      kullanılsaydı 00:00–03:00 arası siparişler "dün"
                      sayılırdı.
                  orders_active:
                    type: integer
                    description: Mutfak ekranında kart olarak duran sipariş sayısı.
                  settings:
                    $ref: '#/components/schemas/KitchenSettings'
                  commands:
                    type: array
                    description: |
                      Kasanın çalıştıracağı tek seferlik komutlar. Yanıtta
                      dönen komutlar **teslim edilmiş** sayılır ve tekrar
                      gönderilmez; kasa sonuçlarını bir sonraki bildirimde
                      `command_results` ile bildirir.

                      Sonucu gelmeyen komut 10 dakika sonra yeniden
                      gönderilir: kasa komutu alıp çökmüş olabilir ve
                      komutun hiç çalışmaması sessiz bir başarısızlıktır.
                    items: { $ref: '#/components/schemas/KitchenCommand' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }
        '422':
          description: Doğrulama hatası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /kitchen/heartbeat:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Mutfak]
      summary: Canlılık bildirimi
      description: |
        Cihazın `last_seen_at` alanını günceller. 60 saniyede bir gönderilir.
        `last_seen_at` 5 dakikadan eskiyse admin panelde uyarı çıkar.
      operationId: kitchenHeartbeat
      security:
        - KitchenToken: []
      responses:
        '200':
          description: Sunucu bilgisi
          content:
            application/json:
              schema:
                type: object
                required: [server_time, min_supported_version]
                properties:
                  server_time: { type: string, format: date-time }
                  min_supported_version: { $ref: '#/components/schemas/SemVer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrRevoked' }

  # ─────────────────────────────── Sürüm ────────────────────────────────

  /site-content:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Site]
      summary: Kurumsal site içeriği
      description: |
        Kurumsal sitenin panelden yönetilen içeriğinin tamamı **tek pakette**.

        Ayrı uçlar (marka, iletişim, hizmetler…) yapılmadı: sitenin her sayfası
        aynı çekirdek veriye ihtiyaç duyuyor ve ayrı uçlarla ana sayfa yedi
        istek atardı; biri geciktiğinde sayfa yarım kalırdı.

        **Doldurulmamış bölüm `null` döner, hata değildir.** Yeni kurulan bir
        sistemde panel boşken sitenin hiç açılmaması kabul edilemezdi; site
        `null` gelen bölümü çizmez, kendi yedek değerine düşer.
      operationId: getSiteContent
      security: []
      responses:
        '200':
          description: İçerik paketi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteContent' }

  # ─────────────────────────────── Teklif ───────────────────────────────

  /quote-requests:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    post:
      tags: [Teklif]
      summary: Teklif talebi gönder
      description: |
        Kurumsal sitedeki "Teklif Al" formunun gönderim ucu. Kimlik
        gerektirmez: teklif isteyebilmek için önce hesap açtırmak, formun
        terk edilmesinin en yaygın sebebidir. Koruma oran sınırındadır
        (10 istek / saat / IP).

        **DOĞRULAMA BİLİNÇLİ OLARAK GEVŞEKTİR.** Bu ucun başarısızlığı
        "hatalı istek" değil, kaybedilmiş iştir; ziyaretçi formu bir kez
        doldurur ve 422 gördüğünde çoğu zaman tekrar denemez. Bu yüzden:

        - **Bilinmeyen alanlar sessizce yok sayılır.** Şemada olmayan bir
          alan (`utm_source` gibi) isteği reddettirmez. Site sözleşmeden bir
          sürüm önde gidebilmelidir.
        - **`service_type`, `frequency` ve `menu_preference` enum DEĞİLDİR.**
          Değerler `website/content/services.ts` slug'larından gelir ve yeni
          bir hizmet önce orada doğar; enum kısıtı o aradaki her talebi çöpe
          atardı. Aşağıdaki `examples` listeleri bilgi amaçlıdır, kısıt değil.
        - **Çözümlenemeyen tarih ve rakam olmayan kişi sayısı boş bırakılır**,
          talep yine kaydedilir.
        - **Sütun sınırını aşan metin kesilir**, reddedilmez.

        Reddedilen yalnızca iki durum vardır ve ikisi de bilinçli kayıptır:
        KVKK onayının olmaması ve kişiye ulaşmanın hiçbir yolunun olmaması.

        **Tekilleştirme yapılmaz.** Aynı kişinin ikinci gönderimi ikinci bir
        kayıttır: aynı firma iki farklı etkinlik için teklif isteyebilir.
      operationId: createQuoteRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequestInput' }
      responses:
        '201':
          description: |
            Talep kaydedildi.

            **Yanıt kaydın kendisini ve `id`'sini DÖNMEZ.** Uç herkese açık;
            artan bir kimlik döndürmek, formu iki kez dolduran herkese
            firmanın aldığı talep sayısını sızdırırdı.
          content:
            application/json:
              schema:
                type: object
                required: [status, received_at]
                properties:
                  status: { $ref: '#/components/schemas/QuoteStatus' }
                  received_at: { type: string, format: date-time }
        '422':
          description: |
            KVKK onayı yok (`kvkk_accepted` `true` değil), ad boş, ya da
            telefon ve e-postanın ikisi birden boş.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /app-version:
    parameters: [$ref: '#/components/parameters/AppId', $ref: '#/components/parameters/AppVersion', $ref: '#/components/parameters/AcceptLanguage']
    get:
      tags: [Sürüm]
      summary: Uygulama sürüm bilgisi
      description: İstemci sürümü `min_supported` altındaysa zorunlu güncelleme ekranı gösterir.
      operationId: getAppVersion
      security: []
      parameters:
        - name: app_id
          in: query
          required: true
          schema: { type: string, enum: [musteriapp, mutfakapp] }
      responses:
        '200':
          description: Sürüm bilgisi
          content:
            application/json:
              schema:
                type: object
                required: [app_id, latest, min_supported]
                properties:
                  app_id: { type: string, enum: [musteriapp, mutfakapp] }
                  latest: { $ref: '#/components/schemas/SemVer' }
                  min_supported: { $ref: '#/components/schemas/SemVer' }
                  download_url:
                    type: [string, 'null']
                    format: uri
                    description: Yalnızca `mutfakapp` için dolu (`.deb` adresi).
                  notes: { type: [string, 'null'] }
        '422':
          description: |
            `app_id` eksik veya enum dışı. Geçersiz enum bir **doğrulama**
            hatasıdır, "kayıt yok" değil — mock ile sunucu bu noktada
            ayrışmıştı, sözleşme 422'de netleştirildi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ══════════════════ KONTROL MERKEZİ (K-21) ══════════════════
  #
  # Tam URL'ler `/api/control/kds/...`; buradaki yollar `servers[].url`
  # içindeki `/api` önekine GÖREDİR (dosyanın geri kalanıyla aynı kural).
  # İMZA HESABI YOLU `/api` ÖNEKİYLE ALIR — kanonik yükün ikinci satırı
  # `/api/control/kds/devices`'tır, `/control/kds/devices` değil.
  #
  # Hiçbirinde `X-App-Id` / `X-App-Version` / `Accept-Language` yoktur.

  /control/kds/overview:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
    get:
      tags: [Kontrol Merkezi]
      summary: Panel açılış özeti
      description: |
        Tek istekte cihaz, sipariş ve fiş sayıları. Üçünü ayrı ayrı çekip
        saydırmak panel her açıldığında üç ağır sorgu demekti; sayılar da
        istemcide hesaplanırdı ve "kaç sipariş aktif" sorusunun cevabı
        istemci sürümüne göre değişirdi.

        **BURADAKİ SAYILAR TANIMDIR, TAHMİN DEĞİL.** Her birinin tanımı
        `ControlOverview` şemasında alan alan yazılı.
      operationId: controlKdsOverview
      security: [{ ControlSignature: [] }]
      responses:
        '200':
          description: Özet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlOverview' }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /control/kds/devices:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
    get:
      tags: [Kontrol Merkezi]
      summary: Kasa listesi
      description: |
        Bütün kasalar — **iptal edilmişler dâhil**. İptal satırı silinmiyor
        (`veykemtu_kitchen_devices` satırı yerinde kalır); `revoked_at`
        dolu olan kayıt listede durur ve `online` her zaman `false` döner.
      operationId: controlKdsListDevices
      security: [{ ControlSignature: [] }]
      responses:
        '200':
          description: Kasalar
          content:
            application/json:
              schema:
                type: object
                required: [data, server_time]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ControlDevice' }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Kontrol Merkezi]
      summary: Kasa aç (+ ilk eşleme kodu)
      description: |
        Kayıt açılır ve **hemen ardından** ilk eşleme kodu üretilir; admin
        ekranındaki `formAfterCreate` ile aynı gerekçe: "cihazı ekledim ama
        eşleyemiyorum" diye ikinci bir adım aranmasın.

        Yanıttaki `device.pairing.code` bu uçta **açıkça döner** — kodu
        üreten uçların yanıtı, kodun okunabildiği iki yerden biri.
      operationId: controlKdsCreateDevice
      security: [{ ControlSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ControlIntent'
                - type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Kasa açıldı (ya da kuru prova sonucu)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ControlWriteEnvelope'
                  - type: object
                    properties:
                      device: { $ref: '#/components/schemas/ControlDevice' }
                      would:
                        type: object
                        properties:
                          action: { type: string, const: device.create }
                          name: { type: string }
                          pairing_ttl_minutes: { type: integer, examples: [10] }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /control/kds/devices/{id}:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Kontrol Merkezi]
      summary: Kasayı yeniden adlandır
      description: |
        **Yalnız ad.** Ayarlar ayrı uçtan yazılır ve kilitler de o ucun
        içindedir (`PATCH /control/kds/devices/{id}/settings`).
      operationId: controlKdsRenameDevice
      security: [{ ControlSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ControlIntent'
                - type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Ad değişti (ya da kuru prova sonucu)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ControlWriteEnvelope'
                  - type: object
                    properties:
                      device: { $ref: '#/components/schemas/ControlDevice' }
                      would:
                        type: object
                        properties:
                          action: { type: string, const: device.rename }
                          from: { type: string }
                          to: { type: string }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /control/kds/devices/{id}/pairing-code:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Kontrol Merkezi]
      summary: Yeni eşleme kodu üret
      description: |
        Kod biçimi `XXXX-XXXX` (`^[A-Z0-9]{4}-[A-Z0-9]{4}$`), **10 dakika**
        ömürlü ve **tek kullanımlık**. Karıştırılması kolay karakterler
        (`0`/`O`, `1`/`I`) alfabede yoktur — kod mutfakta elle, çoğu zaman
        kötü ışıkta giriliyor.

        **İPTAL EDİLMİŞ KASAYA KOD ÜRETİLMEZ (`422`).** Üretilse bile
        `pairingCodeIsUsable()` iptali eleyip kodu geçersiz sayardı, yani
        sessizce çalışmayan bir kod verilmiş olurdu.
      operationId: controlKdsRefreshPairingCode
      security: [{ ControlSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlIntent' }
      responses:
        '200':
          description: Yeni kod (ya da kuru prova sonucu)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ControlWriteEnvelope'
                  - type: object
                    properties:
                      device: { $ref: '#/components/schemas/ControlDevice' }
                      would:
                        type: object
                        properties:
                          action: { type: string, const: device.pairing_code }
                          device_id: { type: integer, format: int64 }
                          pairing_ttl_minutes: { type: integer, examples: [10] }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Doğrulama hatası ya da kasa **iptal edilmiş**. Denetim satırı
            yine yazılır: gerçek gönderimde `result = "failed"`, kuru
            provada `result = "dry_run"` kalır ve sebep
            `payload_json.error` alanına düşer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /control/kds/devices/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Kontrol Merkezi]
      summary: Kasayı iptal et
      description: |
        **SATIR DA TOKEN DA SİLİNMEZ**, yalnız `revoked_at` damgalanır.

        Token kasten bırakılıyor: silinseydi `findToken()` `null` döner ve
        istek `401 UNAUTHENTICATED` ile biterdi — KDS'in beklediği
        `403 DEVICE_REVOKED` dalına hiç ulaşılmaz, mutfak "eşleme iptal
        edildi" yerine genel bir oturum hatası görürdü. Erişim yine kapalı:
        her mutfak ucu `bld.auth` içinde `isRevoked()` denetiminden geçiyor.

        **İKİNCİ İPTAL DAMGAYI OYNATMAZ.** `revoked_at` "ne zaman iptal
        edildi" sorusunun cevabı ve denetim değeri ilk damgadadır; istek
        yine `200` döner ve `would.already_revoked` / denetim yükü durumu
        anlatır.
      operationId: controlKdsRevokeDevice
      security: [{ ControlSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlIntent' }
      responses:
        '200':
          description: İptal edildi (ya da kuru prova sonucu)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ControlWriteEnvelope'
                  - type: object
                    properties:
                      device: { $ref: '#/components/schemas/ControlDevice' }
                      would:
                        type: object
                        properties:
                          action: { type: string, const: device.revoke }
                          device_id: { type: integer, format: int64 }
                          already_revoked: { type: boolean }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /control/kds/devices/{id}/settings:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Kontrol Merkezi]
      summary: Yönetilen ayarları ve kilitleri yaz
      description: |
        **YAZIM KISMİDİR.** Gönderilmeyen anahtar değişmez; `null`
        gönderilen anahtar "yönetici dokunmadı"ya geri döner.

        **AYARLAR `settings` NESNESİNİN ALTINDADIR**, gövdenin kökünde
        değil. Kökte olsalardı `reason` / `actor` / `dry_run` ile aynı ad
        alanını paylaşırlardı ve `reason` adında bir ayar eklemek imkânsız
        hâle gelirdi. Ayrıca `GET /control/kds/devices` yanıtındaki
        `device.settings` ile simetrik: okunan biçim ile yazılan biçim aynı.

        **TANINMAYAN ANAHTAR SESSİZCE YUTULMAZ → `422`.** Bu uç kilit
        yazıyor: `allow_settngs: false` gibi bir yazım hatası göz ardı
        edilseydi yönetici kilidi koyduğunu sanır, kasa serbest kalır ve
        yanlışlığı ancak birinin o ekrana girmesiyle öğrenirdik.

        **BOŞ `settings` NESNESİ DE `422`** — yönetilen anahtarlardan
        hiçbiri gövdede yoksa istek bir şey söylemiyor demektir.

        **SINIR DIŞI DEĞER SESSİZCE KIRPILMAZ → `422`.** Servis (
        `KitchenDeviceSettings`) değeri zaten kırpıyor; buradaki kuralların
        işi kırpmayı önlemek değil **görünür** kılmak. Makine istemcisinde
        sessiz kırpma daha tehlikeli: Kontrol Merkezi 70 yazıp 60
        kaydedildiğini fark etmez ve ekranında yanlış değeri gösterirdi.

        **`late_after_minutes` yine de sunucuda düzeltilir:** uyarı
        eşiğinden küçük bırakılırsa uyarı eşiğine çekilir — küçük olsaydı
        kart hiç kırmızıya dönmezdi.

        Yazma başarılıysa `device.settings_updated_at` ilerler ve kasa yeni
        değerleri **bir sonraki sağlık bildiriminin yanıtında** alır
        (`GET /kitchen/health`); anında değil.
      operationId: controlKdsUpdateDeviceSettings
      security: [{ ControlSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ControlIntent'
                - type: object
                  required: [settings]
                  properties:
                    settings:
                      allOf:
                        - $ref: '#/components/schemas/KitchenSettings'
                        - type: object
                          description: |
                            `updated_at` **yazılamaz** (sunucu damgalar) ve
                            gönderilirse "tanınmayan anahtar" sayılır.
      responses:
        '200':
          description: Ayarlar yazıldı (ya da kuru prova sonucu)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ControlWriteEnvelope'
                  - type: object
                    properties:
                      device: { $ref: '#/components/schemas/ControlDevice' }
                      would:
                        type: object
                        properties:
                          action: { type: string, const: device.settings }
                          device_id: { type: integer, format: int64 }
                          settings:
                            type: object
                            additionalProperties: true
                            description: |
                              İsteğin **tanınan** anahtarları, ham hâliyle.
                              Kırpma burada uygulanmaz; kırpılacak bir değer
                              zaten `422` alırdı.
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Tanınmayan anahtar, boş `settings` nesnesi, sınır dışı değer ya
            da tip hatası (`VALIDATION_FAILED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /control/kds/devices/{id}/commands:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Kontrol Merkezi]
      summary: Komut geçmişi (son 50)
      description: |
        En yeni önce. Üç damga, üç ayrı soru: **gönderildi mi**
        (`created_at`), **kasaya ulaştı mı** (`delivered_at`), **çalıştı mı**
        (`executed_at` + `succeeded`)? Tek bir "durum" alanı "kasa aldı ama
        çalıştıramadı" hâlini anlatamazdı.
      operationId: controlKdsListDeviceCommands
      security: [{ ControlSignature: [] }]
      responses:
        '200':
          description: Komutlar
          content:
            application/json:
              schema:
                type: object
                required: [data, server_time]
                properties:
                  data:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/ControlCommandLog' }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Kontrol Merkezi]
      summary: Kasaya tek seferlik komut kuyrukla
      description: |
        **ANINDA DEĞİL.** Komut kasanın bir sonraki **sağlık bildiriminin
        yanıtına** biniyor (`GET /kitchen/health`). Yanıttaki
        `arrives_within_seconds` bunu açıkça söylüyor — söylenmeseydi
        Kontrol Merkezi'ndeki kullanıcı "olmadı" deyip aynı düğmeye tekrar
        basar ve **iki fiş** çıkardı. Değer kasanın `health_seconds`
        ayarıdır (dokunulmamışsa derleme varsayılanı).

        `reprint` komutu `payload.order_id` **ve** `payload.type` ister;
        eksikse `422`. Diğer komutlarda yük gönderilse bile `null`'a
        indirgenir.

        **İPTAL EDİLMİŞ KASAYA KOMUT GÖNDERİLEMEZ (`422`)** — kasa hiçbir
        uca giremediği için komut sonsuza kadar kuyrukta kalırdı.
      operationId: controlKdsSendDeviceCommand
      security: [{ ControlSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ControlIntent'
                - type: object
                  required: [command]
                  properties:
                    command:
                      type: string
                      enum: [test_receipt, reprint, clear_failed, silence_alarm, restart]
                    payload:
                      type: [object, 'null']
                      description: 'Yalnız `reprint` için zorunlu.'
                      properties:
                        order_id: { type: integer, format: int64, minimum: 1 }
                        type: { $ref: '#/components/schemas/ReceiptType' }
      responses:
        '200':
          description: Komut kuyruğa girdi (ya da kuru prova sonucu)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ControlWriteEnvelope'
                  - type: object
                    properties:
                      command:
                        type: object
                        required: [id, command, payload]
                        properties:
                          id: { type: integer, format: int64 }
                          command: { type: string }
                          payload:
                            type: object
                            additionalProperties: true
                          created_at: { type: [string, 'null'], format: date-time }
                      arrives_within_seconds:
                        type: integer
                        description: |
                          Komutun kasaya en geç ne kadar sürede varacağı —
                          cihazın `health_seconds` ayarı.
                      would:
                        type: object
                        properties:
                          action: { type: string, const: device.command }
                          device_id: { type: integer, format: int64 }
                          command: { type: string }
                          payload: { type: [object, 'null'], additionalProperties: true }
                          arrives_within_seconds: { type: integer }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Tanımsız komut, yüksüz `reprint` ya da **iptal edilmiş kasa**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /control/kds/print-jobs:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
      - name: device_id
        in: query
        required: false
        schema: { type: integer, format: int64, minimum: 1 }
      - name: order_id
        in: query
        required: false
        schema: { type: integer, format: int64, minimum: 1 }
      - name: limit
        in: query
        required: false
        description: |
          Tavan **200**: denetim ekranı sayfalıyor ve sınırsız bir liste yıl
          sonunda on binlerce satır döndürürdü.
        schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    get:
      tags: [Kontrol Merkezi]
      summary: Fiş denetim kaydı
      description: |
        **BU BİR KUYRUK DEĞİLDİR.** `veykemtu_print_jobs` yalnızca
        **denetim** tablosudur: hangi fiş, hangi kasada, ne zaman basıldı.
        KDS'in kalıcı kuyruğu **kasanın diskindedir** ve sunucuda karşılığı
        yoktur — buradan bir işi silmek ya da yeniden sıraya almak mümkün
        değil, çünkü silinecek bir sıra yok.

        "Kaç iş bekliyor / kaçı başarısız" sorusunun cevabı cihaz
        sağlığından okunur (`device.health.print_queue_pending` /
        `print_queue_failed`) ve o değerleri kasa **beyan eder**; sunucu
        doğrulayamaz.

        Bir işi yeniden bastırmanın tek yolu `reprint` komutudur
        (`POST /control/kds/devices/{id}/commands`).

        En yeni önce sıralanır: denetim sorusu neredeyse her zaman "az önce
        ne basıldı" biçiminde geliyor.
      operationId: controlKdsListPrintJobs
      security: [{ ControlSignature: [] }]
      responses:
        '200':
          description: Fiş kayıtları
          content:
            application/json:
              schema:
                type: object
                required: [data, server_time]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ControlPrintJob' }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /control/kds/orders:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
      - name: since
        in: query
        required: false
        description: |
          Artımlı imleç. **Durum değişimlerini de yakalar** (`updated_at`
          üzerinden); yalnız yeni siparişleri isteyen bir imleç, düzenlenmiş
          bir siparişi kaçırırdı.
        schema: { type: string, format: date-time }
      - name: include_completed
        in: query
        required: false
        description: |
          Terminal siparişleri de getir. **`boolean` değil `string` enum:**
          sorgu dizesinde boolean ancak metin olarak ifade edilebilir ve
          Laravel'in `boolean` kuralı `"true"` dizgesini reddeder. Aynı hata
          mutfak ucunda KDS'i kör etmişti.
        schema: { type: string, enum: ['1', '0', 'true', 'false'] }
    get:
      tags: [Kontrol Merkezi]
      summary: Sipariş listesi
      description: |
        **KAPSAM MUTFAK PANOSUYLA AYNI** (`GET /kitchen/orders`): işletme
        gününe ait siparişler, terminal olanlar hariç. Kontrol
        Merkezi'ndeki ekran mutfağın gördüğünü göstermek için var; iki uç
        farklı bir küme dönseydi "bende görünüyor, mutfakta yok"
        tartışması çözülemezdi.

        Yanıt `KitchenOrder` şemasıdır — yani **fiyat taşımaz**. Fiyatın
        gerektiği tek yer düzenleme ekranının ürün seçicisidir
        (`GET /control/kds/menu`).
      operationId: controlKdsListOrders
      security: [{ ControlSignature: [] }]
      responses:
        '200':
          description: Siparişler
          content:
            application/json:
              schema:
                type: object
                required: [data, server_time]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KitchenOrder' }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /control/kds/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Kontrol Merkezi]
      summary: Tek sipariş — düzenlenebilir görünüm
      description: |
        `GET /kitchen/orders/{id}/editable` ile **aynı şema**. Kalemlerdeki
        `option_value_ids` revizyon gövdesine aynen geri gönderilmelidir.
      operationId: controlKdsShowOrder
      security: [{ ControlSignature: [] }]
      responses:
        '200':
          description: Sipariş
          content:
            application/json:
              schema:
                type: object
                required: [data, server_time]
                properties:
                  data: { $ref: '#/components/schemas/EditableOrder' }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /control/kds/orders/{id}/revisions:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Kontrol Merkezi]
      summary: Revizyon geçmişi
      description: |
        Mutfaktaki karşılığından (`GET /kitchen/orders/{id}/revisions`) tek
        farkı `created_by_device_id` alanını da taşıması: revizyonun
        **kasadan mı merkezden mi** geldiği buradan okunur (`null` =
        merkez).

        **`server_time` DÖNMEZ** — bu uç bir imleç taşımıyor.
      operationId: controlKdsListOrderRevisions
      security: [{ ControlSignature: [] }]
      responses:
        '200':
          description: Revizyonlar
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ControlOrderRevision' }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Kontrol Merkezi]
      summary: Siparişi düzenle (yeni revizyon)
      description: |
        Gövde `POST /kitchen/orders/{id}/revisions` ile **birebir aynı**,
        üstüne `actor` + `dry_run`. `reason` burada da **160 karakteri**
        aşamaz: aynı metin `veykemtu_order_revisions.reason` sütununa da
        yazılıyor ve taşan gerekçe sessizce kırpılmak yerine `422` alır.

        İş mantığı `OrderEditor`'da — mutfak kasasının kullandığı sınıfın
        **ta kendisi**. Ayrı bir kopya yazılsaydı sipariş merkezden
        düzenlendiğinde cari hesap ya da iade kaydı sessizce oluşmayabilirdi.

        `items` **tam listedir**, delta değil. Fark göndermek iki tarafın
        "şu anki hâl" konusunda anlaşmasını gerektirirdi; eşzamanlı bir kasa
        düzenlemesiyle yarışan bir merkez isteği sessizce yanlış sipariş
        üretirdi. **Boş liste `422`** — siparişi boşaltmak iptal değildir ve
        iptalin kendi durumu, kendi cari kaydı vardır.

        **ÇAĞIRAN AYRIMI:** `created_by_device_id` **NULL** kalır (kasa yok)
        ve revizyon **notunun başına** `Kontrol Merkezi · <actor>` etiketi
        yazılır. Etiket `created_by_staff` sütununa yazılamıyor: o sütun
        `unsignedBigInteger` (bir yönetici kimliği) ve tipini değiştirmek
        yayınlanmış bir şemayı kırmak olurdu.

        **KURU PROVA GERÇEKTEN DENETLER:** teslim edilmiş ya da iptal
        edilmiş sipariş `dry_run: true` ile de `422` alır. Yalnız isteği
        yankılasaydı, "kuru prova geçti" diyen bir ekran gerçek gönderimde
        patlardı.
      operationId: controlKdsCreateOrderRevision
      security: [{ ControlSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ControlOrderIntent'
                - type: object
                  required: [items]
                  properties:
                    note: { type: [string, 'null'], maxLength: 1000 }
                    items:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [menu_id, quantity]
                        properties:
                          menu_id: { type: integer, format: int64, minimum: 1 }
                          quantity: { type: integer, minimum: 1, maximum: 999 }
                          option_value_ids:
                            type: array
                            items: { type: integer, format: int64, minimum: 1 }
                            description: |
                              `GET /control/kds/orders/{id}` yanıtındaki
                              `items[].option_value_ids` **aynen geri
                              gönderilir**; gönderilmezse sunucu satırı
                              seçeneksiz yeniden fiyatlar ve seçenek
                              sessizce kaybolur. Kimlikler ürün seçicideki
                              `options[].values[].id` ile aynı uzaydadır.
                          note: { type: [string, 'null'], maxLength: 255 }
                    requested_at: { type: [string, 'null'], format: date-time }
                    customer_note: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: Revizyon uygulandı (ya da kuru prova sonucu)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ControlWriteEnvelope'
                  - type: object
                    properties:
                      order: { $ref: '#/components/schemas/KitchenOrder' }
                      revision: { $ref: '#/components/schemas/OrderRevisionResult' }
                      would:
                        type: object
                        properties:
                          action: { type: string, const: order.revise }
                          order_id: { type: integer, format: int64 }
                          next_revision_no: { type: integer, minimum: 1 }
                          items:
                            type: array
                            items: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Düzenlenemez sipariş (teslim edilmiş / iptal), boş kalem listesi,
            160 karakteri aşan gerekçe ya da doğrulama hatası.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /control/kds/orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Kontrol Merkezi]
      summary: Durum geçişi
      description: |
        Kararı `OrderStatusTransition` verir — mutfağın kullandığı sınıfın
        **ta kendisi**: aynı matris, aynı 120 saniyelik geri alma penceresi,
        aynı iptal ters kaydı. Geçersiz geçiş `422 INVALID_TRANSITION` ve
        **kuru provada da** aynı yanıt gelir.

        Gerekçe `status_history`'ye yorum olarak da düşer, başına
        `Kontrol Merkezi · <actor>` etiketiyle: "bu sipariş neden iptal
        edildi" sorusunun cevabı siparişin **kendi geçmişinde** durmalı,
        yalnız ayrı bir denetim tablosunda değil.

        `user_id` **yazılmaz**: geçişi bir admin kullanıcısı değil, Kontrol
        Merkezi yaptı ve o kişinin BLD'de hesabı yok.
      operationId: controlKdsSetOrderStatus
      security: [{ ControlSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ControlOrderIntent'
                - type: object
                  required: [status]
                  properties:
                    status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: Durum değişti (ya da kuru prova sonucu)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ControlWriteEnvelope'
                  - type: object
                    properties:
                      order: { $ref: '#/components/schemas/KitchenOrder' }
                      would:
                        type: object
                        properties:
                          action: { type: string, const: order.status }
                          order_id: { type: integer, format: int64 }
                          from: { $ref: '#/components/schemas/OrderStatus' }
                          to: { $ref: '#/components/schemas/OrderStatus' }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Geçersiz geçiş (`INVALID_TRANSITION`) ya da doğrulama hatası
            (`VALIDATION_FAILED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /control/kds/menu:
    parameters:
      - $ref: '#/components/parameters/ControlTimestamp'
      - $ref: '#/components/parameters/ControlNonce'
    get:
      tags: [Kontrol Merkezi]
      summary: Ürün seçici (düzenleme ekranı için)
      description: |
        **NEDEN VAR:** revizyon ucu `menu_id` istiyor ve o sayı kimsenin
        ezberinde değil. Seçici olmadan elle yazılan bir kimlik siparişe
        başka bir ürün koyar ve bunu ancak mutfak, tabağı hazırlarken fark
        eder.

        Yalnız **eklenebilir** ürünler listelenir (`listed = true`);
        satıştan kaldırılmış bir ürünü seçtirmek düzenlemeyi kaydetme anında
        hataya çevirirdi. Bugünlük tükenmiş ürün listede **kalır ama
        işaretlidir** (`sold_out`): gizlemek "ürün nerede" sorusunu
        doğururdu, işaretsiz bırakmak mutfağın bugün yapamayacağı bir kalemi
        siparişe koydururdu.

        **FİYAT VE SEÇENEKLER BURADA VAR, `/kitchen/menu`'DE YOK — bilinçli.**
        ADR-08 **mutfak kapsamını** para görmekten men ediyor; kasa ekranı
        gün boyu mutfakta açık duruyor ve fiyat orada yalnız sızıntı riski.
        Kontrol Merkezi ise bir yönetim yüzeyi: revizyonun **iade mi ek
        tahsilat mı** üreteceğini göndermeden önce görebilmek gerekiyor.
        Seçenekler ise zorunlu: `LineResolver` satırı `option_value_ids` ile
        fiyatlıyor ve kimlikler gönderilmezse seçenekli bir ürün seçeneksiz
        yeniden fiyatlanır.
      operationId: controlKdsMenu
      security: [{ ControlSignature: [] }]
      responses:
        '200':
          description: Ürünler
          content:
            application/json:
              schema:
                type: object
                required: [data, server_time]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ControlMenuItem' }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/ControlUnauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

# ══════════════════════════════ COMPONENTS ══════════════════════════════

components:

  securitySchemes:
    CustomerToken:
      type: http
      scheme: bearer
      description: Müşteri hesabı token'ı (`customer` kapsamı). `/kitchen/*` uçlarına erişemez.
    KitchenToken:
      type: http
      scheme: bearer
      description: |
        Cihaz token'ı (`kitchen` kapsamı). `POST /kitchen/pair` ile alınır.
        Fiyat, müşteri iletişim bilgisi ve rapor uçlarına erişemez.

    ControlSignature:
      type: apiKey
      in: header
      name: X-Control-Signature
      description: |
        Kontrol Merkezi imzası (K-21) — `/control/kds/*` uçlarının tamamı.
        Uygulaması `Http\Middleware\VerifyControlSignature`.

        ## Üç başlık birden gönderilir

        | Başlık | Değer |
        |---|---|
        | `X-Control-Timestamp` | UNIX saniye, **yalnız rakam** |
        | `X-Control-Nonce` | isteğe özgü rastgele dize, **16–128 karakter** |
        | `X-Control-Signature` | `^sha256=[0-9a-f]{64}$` |

        `X-Control-Signature` bu şemanın kendisidir; diğer ikisi her yolda
        zorunlu başlık parametresi olarak ayrıca tanımlıdır. Üçünden biri
        eksikse istek `401 UNAUTHENTICATED` alır.

        ## Kanonik yük

        ```
        METOT \n YOL \n ZAMAN \n NONCE \n sha256_hex(ham gövde)
        ```

        ```
        imza = 'sha256=' + HMAC_SHA256(BLD_CONTROL_SECRET, kanonik_yük)
        ```

        - **METOT** büyük harf (`GET`, `POST`, `PATCH`).
        - **YOL** `/api` öneki **dâhil**, sorgu dizesi **hariç**
          (`/api/control/kds/devices/7/revoke`). Sorgu dizesi imzaya
          girmez: iki taraf parametre sırasını tutturamazdı ve süzgeçler
          yalnız okuma uçlarında var — yazma uçlarının tamamı gövdeli.
        - **Gövde ham hâliyle** özetlenir; gövdesiz isteklerde boş dizenin
          SHA-256'sı kullanılır. JSON yeniden serileştirilmez — boşluk ya
          da anahtar sırası imzayı değiştirir.

        ## Tekrar (replay) saldırısına kapalı

        - **Zaman penceresi ±300 saniye.** Dışındaki istek reddedilir
          (saat kayması payı dâhil).
        - **Nonce 600 saniye (pencerenin iki katı) hatırlanır** ve aynı
          nonce ikinci kez **kabul edilmez**. Pencere kadar tutmak
          yetmezdi: pencerenin son saniyesinde imzalanmış bir istek,
          unutulduktan sonra hâlâ zaman denetiminden geçebilirdi.
        - Nonce **imza doğrulandıktan sonra** işaretlenir. Tersi olsaydı
          imzasız bir istemci rastgele nonce'lar göndererek meşru
          istemcinin nonce'unu "kullanılmış" işaretleyip onu
          kilitleyebilirdi.
        - Metot ve yol imzaya girdiği için `POST .../revoke` imzası
          `GET .../devices` olarak yeniden kullanılamaz.

        ## Neden `bbd.signature` DEĞİL

        Aynı deseni taşısalar da **ayrı sır, ayrı şema** ve ayrılık
        bilinçli:

        - **Yön ters.** BBD bize sipariş **yazıyor** (tek uç, tek işlem).
          Kontrol Merkezi **yönetiyor**: kasa iptal ediyor, ayar itiyor,
          sipariş revize ediyor, durum geçiriyor.
        - **Yetki seviyesi farklı.** Tek sırrı iki seviye için kullanmak,
          BBD'nin sırrını ele geçiren birine mutfağı yönetme hakkı da
          verirdi.
        - **Kapsam farklı.** `bbd.signature` yalnız **gövdeyi** imzalar;
          zaman damgası ve nonce yoktur, yani ağı dinleyen biri geçerli
          bir isteği sınırsız kez oynatabilir. Orada etki `external_id`
          tekilliğiyle sınırlı kalıyor; burada kalmazdı — "cihazı iptal
          et" isteğini tekrar oynatmak mutfağı sipariş göremez hâle
          getirir.

        ## Neden cihaz token'ı DEĞİL

        `/kitchen/*` uçları bir **kasanın** token'ıyla korunuyor ve her
        istek o kasanın `last_seen_at` alanını tazeliyor. Kontrol Merkezi
        oraya eşleşerek girseydi, panelde açık duran bir ekran mutfakta
        olmayan bir kasayı "çevrimiçi" gösterir ve yöneticinin gördüğü
        tablo kendi kendini doğrulardı.

        ## Sır tanımlı değilse uç KAPALIDIR

        `BLD_CONTROL_SECRET` boşsa her istek `401` alır. Boş sırla imza
        doğrulamak herkesin geçtiği bir kapıdır.

        ## Red sebepleri ayrıştırılır

        `bbd.signature`'ın aksine `error.message` hangi denetimin
        düştüğünü söyler ("İstek zaman penceresinin dışında.", "Bu istek
        daha önce işlendi.", "İmza doğrulanamadı.", "İmza başlıkları
        eksik.", "Kontrol Merkezi entegrasyonu yapılandırılmamış."). Bu uç
        bir saldırgana değil, bakımını yaptığımız **tek** istemciye hizmet
        ediyor ve "saat kaymış" ile "sır yanlış" ayrımı olmadan sahada
        teşhis imkânsız. Mesajların hiçbiri sırrın varlığını ya da
        uzunluğunu ele vermez; `error.code` her hâlde `UNAUTHENTICATED`.

  parameters:
    AppId:
      name: X-App-Id
      in: header
      required: true
      schema: { type: string, enum: [website, musteriapp, mutfakapp] }
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      schema: { $ref: '#/components/schemas/SemVer' }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: true
      schema: { type: string, default: tr }
    ControlTimestamp:
      name: X-Control-Timestamp
      in: header
      required: true
      description: |
        İsteğin imzalandığı an, **UNIX saniye** (yalnız rakam). Sunucu
        saatinden ±300 saniyeden fazla sapan istek `401` alır. Kanonik
        yükün üçüncü satırıdır — bkz. `ControlSignature`.
      schema: { type: string, pattern: '^[0-9]{1,11}$' }
      examples: { simdi: { value: '1755432000' } }
    ControlNonce:
      name: X-Control-Nonce
      in: header
      required: true
      description: |
        İsteğe özgü rastgele dize. **Aynı nonce ikinci kez kabul edilmez**
        (600 saniye hatırlanır) — tekrar saldırısına karşı tek gerçek
        koruma budur. Uzunluk sınırı 16–128 karakter: sınırsız bir nonce,
        önbelleği şişiren bir istemciye kapı açardı.
      schema: { type: string, minLength: 16, maxLength: 128 }
      examples: { hex: { value: 'a3f1c09b77e24d5088ba61fe' } }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    Unauthenticated:
      description: Token yok veya geçersiz (`UNAUTHENTICATED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ForbiddenOrRevoked:
      description: Kapsam yetersiz (`FORBIDDEN`) veya cihaz iptal edilmiş (`DEVICE_REVOKED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Yetki yok (`FORBIDDEN`). İmzalı bağlantılarda **bozuk imza ile süresi
        dolmuş bağlantı aynı kodu döner**; ayrımı yalnız `message` taşır.
        Ayrı kod vermek, elinde geçersiz bir bağlantı olan kişiye "imza
        doğruydu ama süresi geçti" bilgisini verirdi.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Kayıt yok (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Alan doğrulama hatası (`VALIDATION_FAILED`); `details` alan bazlıdır
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidTransition:
      description: Geçersiz durum geçişi (`INVALID_TRANSITION`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Çok fazla istek (`RATE_LIMITED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ControlUnauthenticated:
      description: |
        Kontrol Merkezi imzası kabul edilmedi (`UNAUTHENTICATED`). Beş ayrı
        sebep aynı kodu döner, ayrımı yalnız `message` taşır:

        | `message` | Sebep |
        |---|---|
        | `İmza başlıkları eksik.` | Üç başlıktan biri yok |
        | `İstek zaman penceresinin dışında.` | \|şimdi − timestamp\| > 300 sn |
        | `Bu istek daha önce işlendi.` | Nonce tekrar kullanıldı |
        | `İmza doğrulanamadı.` | HMAC tutmadı, timestamp rakam değil ya da nonce 16–128 aralığı dışında |
        | `Kontrol Merkezi entegrasyonu yapılandırılmamış.` | `BLD_CONTROL_SECRET` boş |

        **Denetim satırı YAZILMAZ** — istek kapıdan hiç geçmedi.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ── Temel tipler ────────────────────────────────────────────────────

    Money:
      type: integer
      format: int64
      minimum: 0
      description: '**Kuruş** cinsinden tam sayı. `4550` = 45,50 TL.'
      examples: [4550]

    Currency:
      type: string
      const: TRY

    SemVer:
      type: string
      pattern: '^\d+\.\d+\.\d+$'
      examples: ['1.0.0']

    OrderStatus:
      type: string
      enum: [yeni, onaylandi, hazirlaniyor, hazir, yolda, teslim_edildi, iptal]
      description: |
        Geçiş matrisi (`docs/02-veri-modeli.md` §3):

        | Kaynak | İzinli hedefler |
        |---|---|
        | `yeni` | `onaylandi`, `iptal` |
        | `onaylandi` | `hazirlaniyor`, `iptal` |
        | `hazirlaniyor` | `hazir`, `iptal` |
        | `hazir` | `yolda` (delivery), `teslim_edildi` (pickup), `iptal` |
        | `yolda` | `teslim_edildi`, `iptal` |
        | `teslim_edildi` | — (terminal) |
        | `iptal` | — (terminal) |

        **GERİ ALMA PENCERESİ (K-10, 11.08.2026).** Matrise ek olarak,
        mutfak kapsamı **tek adım geri** alabilir — yalnız son durum
        değişikliğinden sonraki **120 saniye** içinde:

        | Kaynak | Geri alınabilir hedef |
        |---|---|
        | `hazirlaniyor` | `onaylandi` |
        | `hazir` | `hazirlaniyor` |
        | `yolda` | `hazir` |

        `yeni`ye dönüş ve terminal durumlardan (`teslim_edildi`, `iptal`)
        geri alma **yoktur**: mutfak fişi `onaylandi`da basılıyor ve basılı
        kâğıt geri alınamaz; iptal ise cari hesaba ters kayıt yazıyor ve
        geri alması bir muhasebe düzeltmesi olur.

        Pencere dışındaki ya da iki adımlık bir geri alma isteği
        `422 INVALID_TRANSITION` döner. Gerekçe: dokunmatik monitörde
        kartlar parmağın altında ve yanlışlıkla kaydırma gerçek; geri
        alınamayan bir dokunuş siparişi yanlış sütuna gönderip mutfağı
        gereksiz fiş basmaya zorluyordu.

    DeliveryType:
      type: string
      enum: [delivery, pickup]

    PaymentMethod:
      type: string
      enum: [online, cash, account]
      description: |
        `online` = sanal POS, `cash` = kapıda ödeme, `account` = cari hesap.

        Faz 1'de `online`, gerçek tahsilat yapmayan bir **simülasyon**
        geçidine bağlıdır; akış gerçek POS ile aynıdır.

    PaymentStatus:
      type: string
      enum: [pending, paid]
      description: |
        Faz 1'de yalnızca bu iki değer üretilir. Sanal POS devreye girdiğinde
        `failed`/`refunded` **eklenebilir** (ek değer, kırıcı değişiklik değil);
        istemciler bilmedikleri değeri "belirsiz" olarak göstermeli, çökmemelidir.

    ReceiptType:
      type: string
      enum: [mutfak, musteri, kurye]
      description: |
        `kurye` K-14 ile eklendi: kuryenin eline giden fiş (ad + telefon,
        adres + harita QR, tahsil edilecek tutar, revizyon özeti).
        Yalnız `delivery` siparişte basılır — gel-al'da kurye yoktur.

        **K-20 (14.08.2026) — `kurye` ARTIK OTOMATİK BASILMIYOR.** Kuryenin
        ihtiyaç duyduğu her şey (ad, telefon, adres + harita QR, tahsil
        edilecek tutar, revizyon özeti, teslim QR'ı) `musteri` fişine taşındı;
        sipariş başına tam iki kâğıt çıkıyor. Kâğıt kapıda kuryenin elinde,
        sonra müşteride kalıyor.

        Enum değeri **silinmedi** (additive-only, `docs/03` §1.4) ve uç
        çalışmaya devam ediyor: `kurye` fişi KDS'ten **elle yeniden
        bastırılabilen** bir kaçış kapısı olarak duruyor.

    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - INVALID_TRANSITION
        - LOCATION_CLOSED
        - ITEM_UNAVAILABLE
        - DEVICE_REVOKED
        - RATE_LIMITED
        - SERVER_ERROR

    Error:
      type: object
      required: [error]
      description: Tüm hataların tek biçimi.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Kullanıcıya gösterilebilir Türkçe metin.
            details:
              type: [object, 'null']
              additionalProperties: true
      examples:
        - error:
            code: INVALID_TRANSITION
            message: Sipariş bu duruma geçirilemez.
            details: { from: yeni, to: hazir }

    PaginationMeta:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        last_page: { type: integer, minimum: 1 }

    # ── Kimlik ──────────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [first_name, last_name, email, telephone, password, kvkk_accepted]
      properties:
        first_name: { type: string, minLength: 1, maxLength: 64 }
        last_name: { type: string, minLength: 1, maxLength: 64 }
        email: { type: string, format: email }
        telephone:
          type: string
          pattern: '^[1-9][0-9]{9}$'
          description: Başında 0 veya +90 olmadan 10 hane.
          examples: ['5551234567']
        password: { type: string, format: password, minLength: 8 }
        kvkk_accepted:
          type: boolean
          const: true
          description: '`false` ise `422 VALIDATION_FAILED`. Onay zaman damgasıyla saklanır.'
        company_name:
          type: string
          maxLength: 160
          description: >-
            Ticari unvan (kurumsal/B2B). Şimdilik opsiyonel; web ve mobil kayıt
            formları bu alanı göndermeye başlayınca zorunlu olacak. Sunucu her
            yeni kaydı `corporate` olarak işaretler.
        contact_person: { type: string, maxLength: 120, description: Yetkili kişi. }
        tax_office: { type: string, maxLength: 120, description: Vergi dairesi. }
        tax_number: { type: string, maxLength: 32, description: Vergi / TCKN no. }
        company_phone: { type: string, maxLength: 32, description: Kurum telefonu. }

    AuthResponse:
      type: object
      required: [token, customer]
      properties:
        token: { type: string }
        customer:
          type: object
          required: [id, first_name]
          properties:
            id: { type: integer, format: int64 }
            first_name: { type: string }

    Customer:
      type: object
      required: [id, first_name, last_name, email, telephone]
      properties:
        id: { type: integer, format: int64 }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        telephone: { type: string }
        default_location_id: { type: [integer, 'null'], format: int64 }
        account_type:
          type: string
          enum: [corporate, individual]
          description: B2B — yeni kayıtlar `corporate`. Bireysel hesap sipariş veremez.
        can_order:
          type: boolean
          description: İstemci sipariş yolunu bununla açar/kapatır; sunucu da denetler.
        company_name: { type: [string, 'null'] }
        contact_person: { type: [string, 'null'] }

    # ── Cari hesap ──────────────────────────────────────────────────────

    AccountSummary:
      type: object
      required: [balance, currency, as_of]
      properties:
        balance:
          type: integer
          format: int64
          description: Güncel bakiye (kuruş). Pozitif = müşterinin borcu, negatif = fazla ödeme.
        currency: { $ref: '#/components/schemas/Currency' }
        as_of: { type: string, format: date-time }

    AccountEntry:
      type: object
      required: [date, entry_type, amount, running_balance, source]
      properties:
        date: { type: string, format: date }
        entry_type:
          type: string
          enum: [debit, credit]
          description: '`debit` = borç (sipariş/abonelik), `credit` = alacak (tahsilat/iptal).'
        amount: { $ref: '#/components/schemas/Money' }
        running_balance:
          type: integer
          format: int64
          description: O satırdan sonraki yürüyen bakiye (kuruş, işaretli).
        source:
          type: string
          enum: [order, subscription, payment, manual, adjustment]
        description: { type: [string, 'null'] }

    AccountStatement:
      type: object
      required: [opening_balance, closing_balance, currency, from, to, entries]
      properties:
        opening_balance: { type: integer, format: int64 }
        closing_balance: { type: integer, format: int64 }
        currency: { $ref: '#/components/schemas/Currency' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        entries:
          type: array
          items: { $ref: '#/components/schemas/AccountEntry' }

    # ── Abonelik ────────────────────────────────────────────────────────

    Subscription:
      type: object
      required:
        [id, status, location_id, delivery_type, start_date, service_days,
         default_quantity, payment_mode, menu_mode, lines, delivery_points, created_at]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [pending, active, paused, cancelled] }
        location_id: { type: integer, format: int64 }
        delivery_type: { $ref: '#/components/schemas/DeliveryType' }
        start_date: { type: string, format: date }
        end_date: { type: [string, 'null'], format: date }
        service_days:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: ISO hafta günleri (1 Pazartesi .. 7 Pazar).
        delivery_time_from: { type: [string, 'null'], examples: ['12:00'] }
        delivery_time_to: { type: [string, 'null'], examples: ['13:00'] }
        default_quantity: { type: integer, minimum: 1 }
        agreed_unit_price:
          oneOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
          description: Porsiyon başı anlaşmalı fiyat. Talepte null; admin belirler.
        payment_mode: { type: string, enum: [account, prepaid_monthly] }
        menu_mode: { type: string, enum: [fixed_list, daily_menu] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionLine' }
        delivery_points:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionDeliveryPoint' }
        created_at: { type: string, format: date-time }

    SubscriptionLine:
      type: object
      required: [quantity]
      properties:
        menu_id: { type: [integer, 'null'], format: int64 }
        quantity: { type: integer, minimum: 1 }
        agreed_unit_price:
          oneOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
        label: { type: [string, 'null'] }

    SubscriptionDeliveryPoint:
      type: object
      required: [id, address_id]
      properties:
        id: { type: integer, format: int64 }
        address_id: { type: integer, format: int64 }
        quantity: { type: [integer, 'null'] }
        note: { type: [string, 'null'] }

    SubscriptionCreate:
      type: object
      required: [location_id, delivery_type, start_date, service_days, default_quantity]
      properties:
        location_id: { type: integer, format: int64 }
        delivery_type: { $ref: '#/components/schemas/DeliveryType' }
        start_date: { type: string, format: date }
        end_date: { type: [string, 'null'], format: date }
        service_days:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1, maximum: 7 }
        default_quantity: { type: integer, minimum: 1, maximum: 9999 }
        delivery_time_from: { type: string, examples: ['12:00'] }
        delivery_time_to: { type: string, examples: ['13:00'] }
        menu_mode:
          type: string
          enum: [fixed_list, daily_menu]
          default: fixed_list
          description: >-
            Porsiyonun içeriği nereden gelir. `fixed_list` aboneliğin kendi
            `lines` satırlarını kullanır; `daily_menu` o günün yayınlanmış
            menüsünü kullanır ve `lines` GÖNDERİLEMEZ (gönderilirse 422).
            Her iki modda da fiyat aboneliğin anlaşmalı porsiyon fiyatıdır.
        lines:
          type: array
          description: >-
            Yalnız `menu_mode = fixed_list` içindir.
          items:
            type: object
            required: [menu_id, quantity]
            properties:
              menu_id: { type: integer, format: int64 }
              quantity: { type: integer, minimum: 1 }
              label: { type: string }
        delivery_points:
          type: array
          items:
            type: object
            required: [address_id]
            properties:
              address_id: { type: integer, format: int64 }
              quantity: { type: integer, minimum: 1 }
              note: { type: string }
        customer_note: { type: string }

    SubscriptionExceptionInput:
      type: object
      required: [service_date]
      properties:
        service_date: { type: string, format: date }
        skip: { type: boolean }
        quantity_override: { type: integer, minimum: 1, maximum: 9999 }

    # ── Katalog ─────────────────────────────────────────────────────────

    Location:
      type: object
      required:
        [id, name, slug, is_open, ordering_enabled, min_order_total,
         delivery_fee, payment_methods, eta]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        is_open:
          type: boolean
          description: Çalışma saatlerinden **türetilir**. Şu an sipariş saati içinde miyiz?
        ordering_enabled:
          type: boolean
          description: |
            Elle ana şalter. `false` ise saat uygun olsa bile sipariş alınmaz.

            Yönetici admin panelden, **mutfak da** `POST /kitchen/ordering`
            ile çevirebilir (K-11). Süreli bir durdurmanın süresi dolduysa
            bu alan okuma anında kendiliğinden `true` döner.
        ordering_pause_reason:
          type: [string, 'null']
          description: |
            Durdurma sebebi — müşteriye gösterilir. "Şu anda sipariş
            alınmıyor" tek başına müşteriyi tekrar tekrar denemeye itiyor;
            sebep ve saat beklemeyi bilinçli kılıyor.
        ordering_resumes_at:
          type: [string, 'null']
          format: date-time
          description: Süreli durdurmanın bitişi; süresizse `null`.
        daily_menu_enabled:
          type: boolean
          default: false
          description: |
            Satış **günün menüsü** üzerinden mi yürüyor? (B-19)

            Sunucu tarafı şalter, bilerek: istemciler günün menüsü akışına
            geçerken bir ay ileriye menü girilmiş olması gerekiyor. Şalter
            olmasaydı, geri dönmek üç uygulamayı birden yeniden yayınlamak
            demekti. `false` iken eski katalog akışı aynen çalışır.
        max_lookahead_days:
          type: integer
          minimum: 0
          default: 30
          description: |
            Bugünden itibaren kaç gün sonrasına sipariş alınabileceği.
            Gün seçici takvimi bu kadar ileriye çizer; sunucu aynı sınırı
            `POST /orders` üzerinde yeniden uygular.
        order_cutoff:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Günlük son sipariş saati (Europe/Istanbul) veya `null`.
          examples: ['16:00']
        min_order_total:
          allOf: [$ref: '#/components/schemas/Money']
          description: Altında sipariş `422 VALIDATION_FAILED`.
        delivery_fee:
          allOf: [$ref: '#/components/schemas/Money']
          description: |
            `delivery_type=delivery` siparişlere eklenecek sabit teslimat
            ücreti; gel-al siparişte uygulanmaz.

            **Neden sözleşmede:** bu alan olmadan istemci, kullanıcıya
            siparişi onaylatmadan önce **toplam tutarı gösteremiyordu** —
            yalnızca ara toplamı gösterip "teslimat sipariş adımında
            hesaplanır" demek zorunda kalıyordu. Mesafeli satışta ödenecek
            tutarın onaydan önce görünmesi gerekir.

            Gösterim içindir; **bağlayıcı olan sunucunun hesabıdır**
            (`OrderDetail.delivery_fee`). İkisi ayrışırsa sunucu haklıdır.
        payment_methods:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PaymentMethod' }
          description: |
            Bu vitrinde **açık** olan ödeme yöntemleri. İstemci ödeme ekranında yalnızca
            bunları gösterir. Listede olmayan yöntemle sipariş → `422 VALIDATION_FAILED`.
        busy:
          type: boolean
          description: |
            Mutfak yoğun mu? Mutfak ekranındaki tek tuşla açılır
            (`POST /kitchen/busy`).

            **Sipariş almayı ENGELLEMEZ.** İstemci yalnızca `busy_message`
            uyarısını gösterir. Siparişi gerçekten kesen şalter
            `ordering_enabled`'dır ve o yöneticinindir.
        busy_message:
          type: string
          description: |
            `busy` doğruyken gösterilecek metin. Yönetici admin panelden
            değiştirebilir. İstemciler kendi metnini gömmemelidir: metin
            değişince üç uygulamayı birden yayınlamak gerekirdi.
          example: Mutfağımız şu anda yoğun. Siparişiniz alınır ancak hazırlanması normalden uzun sürebilir.
        eta:
          $ref: '#/components/schemas/LocationEta'

    LocationEta:
      type: object
      description: |
        Teslim süresi tahmini, teslim türüne göre ayrı. İki tür ayrı verilir
        çünkü gel-alda **yol süresi yoktur** — müşteri hazır olduğunda gelir.
        Tek bir tahmin verilseydi istemci gel-al seçildiğinde de yolu içeren
        bir süre gösterirdi.
      required: [delivery, pickup]
      properties:
        delivery: { $ref: '#/components/schemas/EtaWindow' }
        pickup: { $ref: '#/components/schemas/EtaWindow' }

    EtaWindow:
      type: object
      description: |
        Sipariş verildiği andan teslime kadar geçecek sürenin **aralığı**.

        **Neden aralık, neden tek sayı değil:** "45 dakika" bir taahhüttür ve
        47. dakikada ihlal edilir. "40–55 dakika" hem dürüsttür hem mutfağa
        nefes alanı bırakır.

        Aralık beş dakikaya yuvarlanır: "37–51 dakika" sahte bir kesinlik
        iddiasıdır.
      required: [min_minutes, max_minutes, source, busy]
      properties:
        min_minutes:
          type: integer
          minimum: 5
          description: Aralığın alt ucu (dakika).
          examples: [60]
        max_minutes:
          type: integer
          minimum: 10
          description: Aralığın üst ucu (dakika). Her zaman `min_minutes`'tan büyüktür.
          examples: [85]
        source:
          type: string
          enum: [measured, configured]
          description: |
            Tahminin nereden geldiği.

            - `measured` — son 14 günde tamamlanmış siparişlerin gerçekleşen
              sürelerinden ölçüldü (medyan → 80. yüzdelik). Bu yola girmek
              için en az 8 örnek gerekir.
            - `configured` — henüz yeterli örnek yok, yöneticinin admin
              panelde girdiği hazırlık/teslimat süresinden türetildi.

            İstemci bu alana göre farklı davranmak ZORUNDA değildir; alan
            teşhis içindir ("neden bu süre?" sorusunun cevabı).
        busy:
          type: boolean
          description: |
            Mutfak yoğunluğu bu aralığa **yansıtıldı mı?** `true` ise hem alt
            hem üst uç, yöneticinin girdiği yoğunluk ek süresi kadar uzatıldı.
            `Location.busy` ile aynı kaynağı okur.

    KitchenSettings:
      type: object
      description: |
        Kasanın **sunucudan yönetilen** ayarları. Yönetici admin panelden
        değiştirir, kasa uygular; kasadaki ayar ekranı bunları yalnızca
        gösterir.

        **`null` = yönetici dokunmadı.** O alanda kasa kendi derleme
        varsayılanını kullanır. Sunucu varsayılanı dayatmıyoruz: yazıcı
        yolu gibi değerler makineye özgü ve yanlış bir varsayılan fiş
        basımını durdurur.
      properties:
        poll_seconds:
          type: [integer, 'null']
          minimum: 3
          maximum: 60
          description: |
            Sipariş yoklama aralığı.

            **Alt sınır 2'den 3'e çıktı (12.08.2026).** 2 saniyelik
            yoklama saatte 1800 istek demek ve diğer kasa döngüleriyle
            birlikte `bld-kitchen` oran sınırını (2000/saat) aşıyordu;
            aşıldığında kasa `429` alıyor ve **mutfak sipariş görmüyor**.
            Sunucu 3'ün altındaki değeri 3'e çeker.
        sound_enabled:
          type: [boolean, 'null']
          description: |
            Yeni sipariş sesi. **Bağlantı uyarısını KAPATMAZ** — o
            susturulamaz (`docs/05` §3).
        warning_after_minutes:
          type: [integer, 'null']
          minimum: 1
          maximum: 480
          description: Sipariş bu süreden uzun beklerse kart uyarı rengine döner.
        late_after_minutes:
          type: [integer, 'null']
          minimum: 1
          maximum: 480
          description: |
            Geciken eşiği. `warning_after_minutes`'ten küçük olamaz —
            küçük olsaydı kart hiç kırmızıya dönmezdi, uyarı eşiği zaten
            geçilmiş olurdu. Sunucu küçük değeri uyarı eşiğine çeker.
        printer_device_path: { type: [string, 'null'], maxLength: 128 }
        printer_code_page:
          type: [integer, 'null']
          minimum: 0
          maximum: 255
          description: |
            `ESC t n` kod sayfası. Sahada doğrulanan değer **29**; yanlışı
            tüm Türkçe harfleri boşluk bastırır (`docs/05` §5.2).
        health_seconds:
          type: [integer, 'null']
          minimum: 10
          maximum: 300
          description: |
            Sağlık bildiriminin sıklığı. Komutlar bu yanıtla taşındığı
            için aynı zamanda "komut ne kadar sürede varır" demektir.
        connection_alarm_seconds:
          type: [integer, 'null']
          minimum: 10
          maximum: 600
          description: Bağlantı uyarısının tekrar aralığı.
        alarm_silenceable:
          type: [boolean, 'null']
          description: |
            Mutfak, yeni sipariş alarmını susturabilsin mi? Kapatılırsa
            alarmı durdurmanın tek yolu siparişi onaylamaktır.
        volume_percent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: |
            Uygulamanın kendi ses seviyesi (oynatıcıya `--volume` olarak
            geçer). Kasanın **hoparlör** seviyesinden ayrıdır; hoparlör
            kısıksa bu tek başına yetmez.
        audio_sink:
          type: [string, 'null']
          maxLength: 128
          description: |
            Ses çıkışı (PipeWire/PulseAudio sink adı ya da düğüm numarası).
            **Boş dize = varsayılan çıkışa dön.** `null` bu alanda da
            "yönetici dokunmadı" demek olduğu için, seçimi geri almanın
            tek yolu boş dizedir.
        tts_enabled:
          type: [boolean, 'null']
          description: |
            Türkçe sesli anons ("12 numaralı yeni sipariş, 4 ürün").
            Kasada `spd-say`/`espeak-ng` yoksa sessizce devre dışı kalır.
        tts_rate_percent:
          type: [integer, 'null']
          minimum: 50
          maximum: 200
          description: Anons hızı; 100 = aracın varsayılanı.
        alarm_repeat_seconds:
          type: [integer, 'null']
          minimum: 0
          maximum: 120
          description: |
            Alarm tekrarları arasındaki bekleme. `0` = aralıksız (varsayılan
            "onaylayana kadar susmaz" davranışı).
        alarm_max_repeats:
          type: [integer, 'null']
          minimum: 0
          maximum: 60
          description: |
            En fazla tekrar sayısı. `0` = sınırsız. Sınır, kimse gelmediğinde
            personelin hoparlörün fişini çekmesini önlemek içindir.
        touch_mode:
          type: [boolean, 'null']
          description: |
            Dokunmatik monitör kipi: dokunma hedefleri büyür, açılır menüler
            alt sayfaya döner, klavye gerektiren alanlarda ekran klavyesi
            açılır.

        # ── Kilit politikası (K-21) ─────────────────────────────────────
        #
        # `required` listesine EKLENMEDİ ve eklenmeyecek: alanlar
        # `2026_08_17_000001` göçüyle geldi ve göçten önce yazılmış
        # istemciler bunları hiç görmüyor.
        allow_settings:
          type: [boolean, 'null']
          description: |
            Kasadaki **ayarlar ekranının tamamı** açılabilir mi?

            **`null` = yönetici dokunmadı = SERBEST.** Üç hâlin üçü de
            ayrı: `null` "kimse karar vermedi", `true` "yönetici açıkça
            izin verdi", `false` "kilitli". `null`'ı `true` ile
            birleştirmek ileride varsayılanı sıkılaştırmayı imkânsız
            kılardı. Aynı semantik aşağıdaki altı alanın hepsinde geçerli.

            **Kilit ancak açıkça `false` yazılınca doğar.** Sütunlara
            `false` varsayılanı konsaydı göç koştuğu saniyede sahadaki
            bütün kasalar kilitlenir, mutfak ayar ekranına giremez ve
            kimse sebebini anlamazdı.

            Kasa tarafında düğme **gizlenmez, pasifleşir**
            (`docs/05-mutfakapp.md` §8): gizlenen düğme personeli
            "bozuldu" sanısına iter ve destek çağrısı üretir.
        allow_server_change:
          type: [boolean, 'null']
          description: |
            Sunucu adresini değiştirme ve eşlemeyi sıfırlama.
            **En yıkıcı olanı:** yanlış adres yazılan kasa hiçbir sipariş
            göremez ve geri dönüş yolu yine aynı ekrandan geçer.
        allow_window_controls:
          type: [boolean, 'null']
          description: |
            Tam ekrandan çıkma / pencereyi küçültme. Kiosk kipinin tek
            kaçış kapısı.
        allow_order_edit:
          type: [boolean, 'null']
          description: |
            Kasadan sipariş düzenleme (K-12 revizyonu). **Para hareketi
            üretir:** iade ve ek tahsilat buradan doğuyor.
        allow_manual_reprint:
          type: [boolean, 'null']
          description: Karttan ya da ayarlardan elle yeniden fiş bastırma.
        allow_sales_control:
          type: [boolean, 'null']
          description: |
            Satış şalteri ve "bugün tükendi" işaretleri (K-11).
            **Ciroyu kapatan tuş.**
        lock_message:
          type: [string, 'null']
          maxLength: 160
          description: |
            Kilitli bir düğmeye basınca kasada gösterilecek metin.

            Neden ayrı bir alan: metin kasaya gömülseydi ("Bu işlem
            yönetici tarafından kapatılmıştır") mutfak **kime
            başvuracağını** bilemezdi. Yöneticinin "Kapatıldı — Ahmet
            Bey'i arayın, 0532..." yazabilmesi gerekiyor.

            160 karakter: kasa bunu tek satırlık bir uyarı şeridinde
            gösteriyor, paragraf değil. Boş dize `null`'a düşer —
            `audio_sink`'in aksine burada "boş metin" diye anlamlı bir
            değer yok; metin yoksa kasa kendi genel uyarısını gösterir.

        updated_at: { type: [string, 'null'], format: date-time }

    BbdOrderRequest:
      type: object
      required: [external_id, items]
      description: |
        BBD Store'un gönderdiği **kitap** siparişi. BBD'nin ürünleri BLD
        menüsünde eşleştirilmez; ad fişe **olduğu gibi** basılır.
      properties:
        external_id:
          type: string
          maxLength: 128
          description: BBD'nin kendi kimliği. Tekilleştirmenin dayanağı.
        order_number: { type: [string, 'null'], maxLength: 64 }
        created_at: { type: [string, 'null'], format: date-time }
        customer_label: { type: [string, 'null'], maxLength: 120 }
        phone: { type: [string, 'null'], maxLength: 32 }
        delivery_type:
          type: [string, 'null']
          enum: [delivery, pickup, null]
          description: |
            Kitap satışında `delivery` **kargo** demek (kurye değil),
            `pickup` mağazadan teslim. `pickup` ise fişe adres bloğu
            basılmaz — basılan adres paketin yanlışlıkla kargoya
            verilmesine yol açar.
        address:
          type: [string, 'null']
          maxLength: 255
          description: |
            **Serbest metin** — BLD'nin yapılandırılmış adres modeli
            değil. BBD'nin biçimi bizimkiyle aynı olmak zorunda değil ve
            ayrıştırmaya çalışmak ilk farklı biçimde yanlış satır basardı.
        note: { type: [string, 'null'], maxLength: 500 }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [name, quantity]
            properties:
              name:
                type: string
                maxLength: 200
                description: |
                  Kitap adı. Uzun olabilir; fiş şablonu **çift boyda
                  basmaz**, satıra sarar. (Mutfak fişinde ürün adı çift
                  boydur çünkü bir metreden okunuyor; kitap adı çift
                  boyda 24 sütuna sığmaz ve fiş okunmaz hâle gelir.)
              quantity: { type: integer, minimum: 1, maximum: 9999 }
              sku:
                type: [string, 'null']
                maxLength: 64
                description: Stok kodu / ISBN — raftan bulmanın en hızlı yolu.
              attributes:
                type: array
                maxItems: 5
                items: { type: string, maxLength: 80 }
                description: 'Yazar, cilt, baskı gibi ek nitelikler.'
              note: { type: [string, 'null'], maxLength: 255 }
        amount_kurus:
          type: [integer, 'null']
          minimum: 0
          description: |
            Kuruş. Gönderilmezse fişe tutar satırı **basılmaz** —
            uydurulmuş ya da sıfır bir tutar, kapıda ödemede yanlış
            tahsilata yol açar.
        cargo_company:
          type: [string, 'null']
          maxLength: 60
          description: Kargo firması — paketleyen kişi doğru poşeti seçsin diye.
        tracking_number:
          type: [string, 'null']
          maxLength: 64
          description: |
            Kargo takip numarası. Fişe **çift genişlikte** basılır: paketin
            üstündeki etiketle elle karşılaştırılıyor ve tek bir yanlış
            hane yanlış pakete gider.
        payment_label:
          type: [string, 'null']
          maxLength: 60
          description: |
            "Ödendi (kredi kartı)" / "Kapıda ödeme" gibi **serbest metin**.
            Enum değil: BBD'nin ödeme yöntemleri bizimkilerle aynı olmak
            zorunda değil ve bilinmeyen bir değeri "Bilinmeyen"e düşürmek,
            paketleyene yanlış bilgi vermek olurdu.

    BbdQueuedReceipt:
      type: object
      required: [id, external_id, payload]
      properties:
        id:
          type: integer
          format: int64
          description: BLD'deki satır kimliği; ack bununla gönderilir.
        external_id: { type: string }
        received_at: { type: [string, 'null'], format: date-time }
        payload:
          allOf: [$ref: '#/components/schemas/BbdOrderRequest']
          description: BBD'nin gönderdiği ham gövde; fiş bundan üretilir.

    SubscriptionPlanDay:
      type: object
      required: [date, orders, totals, warnings]
      properties:
        date: { type: string, format: date }
        totals:
          type: array
          description: Ürün bazında toplam — mutfağın sabah baktığı tek şey.
          items:
            type: object
            required: [name, quantity]
            properties:
              name: { type: string }
              quantity: { type: integer, minimum: 0 }
        orders:
          type: array
          description: |
            `KitchenOrder` alanlarına ek olarak `delivery_time` (`HH:mm`)
            ve `subscription_label` taşır. Bu ikisi `KitchenOrder`
            şemasına girmez: pano kartının onlara ihtiyacı yok ve her
            yoklamada taşımak boşuna bant genişliği.
          items: { type: object, additionalProperties: true }
        warnings:
          type: array
          items:
            type: object
            required: [kind, message]
            properties:
              kind:
                type: string
                enum: [not_generated, closed_day, paused, exception]
                description: |
                  `not_generated` **kritiktir** ve arayüzde kırmızı
                  gösterilir: üretim cron'u koşmamış demektir ve mutfak
                  bunu bilmezse hazırlık yapmaz. Diğerleri bilgidir.
              message: { type: string }

    EditableOrder:
      type: object
      required: [id, order_number, status, delivery_type, items]
      description: |
        Düzenleme ekranının gördüğü sipariş. **Fiyat alanı yoktur**
        (ADR-08); telefon vardır (K-14).
      properties:
        id: { type: integer, format: int64 }
        order_number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        delivery_type: { $ref: '#/components/schemas/DeliveryType' }
        requested_at: { type: [string, 'null'], format: date-time }
        customer_name: { type: [string, 'null'] }
        customer_phone: { type: [string, 'null'] }
        customer_note: { type: [string, 'null'] }
        revision_no: { type: integer, minimum: 0 }
        is_subscription:
          type: boolean
          description: |
            Abonelikten doğan sipariş. Düzenleme YALNIZ O GÜNÜ etkiler;
            abonelik tanımı değişmez.
        items:
          type: array
          items:
            type: object
            required: [order_menu_id, menu_id, name, quantity]
            properties:
              order_menu_id: { type: integer, format: int64 }
              menu_id: { type: integer, format: int64 }
              name: { type: string }
              quantity: { type: integer, minimum: 1 }
              options:
                type: array
                items: { type: string }
              option_value_ids:
                type: array
                items: { type: integer, format: int64, minimum: 1 }
                description: |
                  Kalemde seçili seçenek değerlerinin kimlikleri. `options`
                  aynı seçeneklerin insana gösterilen adlarıdır; ikisi
                  eşleniktir. İstemci düzenlemede bunu revizyon gövdesindeki
                  `items[].option_value_ids` alanına **AYNEN geri
                  göndermelidir** — göndermezse sunucu satırı seçeneksiz
                  yeniden fiyatlar ve seçenek sessizce kaybolur. Kimlik
                  kaydı bulunmayan eski satırlarda **boş dizi** döner.

                  Adları kimliğe geri çevirmek seçenek değildir: aynı adı
                  taşıyan iki değer (iki ayrı grupta "Bol") yanlış eşleşir
                  ve sessiz kaybın yerini sessiz **yanlışlık** alırdı.

                  `required` listesinde **yoktur**: alan K-21 ile eklendi
                  ve ondan önce yazılmış istemciler onu hiç görmüyor.
              note: { type: [string, 'null'] }

    OrderRevision:
      type: object
      required: [revision_no, reason]
      properties:
        revision_no: { type: integer, minimum: 1 }
        reason: { type: string }
        note: { type: [string, 'null'] }
        refund_kurus: { type: integer, minimum: 0 }
        extra_charge_kurus: { type: integer, minimum: 0 }
        created_at: { type: [string, 'null'], format: date-time }

    OrderRevisionResult:
      type: object
      required: [revision_no, refund_kurus, extra_charge_kurus]
      description: |
        Bir düzenlemenin sonucu. `refund_kurus` ve `extra_charge_kurus`
        **ikisi de pozitif**; hangisinin dolu olduğu yönü belirler. Tek
        işaretli alan yerine iki alan: iade ile ek tahsilat muhasebede ayrı
        kalemler ve raporda ayrı toplanır.
      properties:
        id: { type: integer, format: int64 }
        revision_no: { type: integer, minimum: 1 }
        reason: { type: string }
        refund_kurus: { type: integer, minimum: 0 }
        extra_charge_kurus: { type: integer, minimum: 0 }
        summary_lines:
          type: array
          items: { type: string }
          description: 'İnsan okuyabilir değişiklik satırları ("Mercimek: 20 → 10").'
        settlement:
          type: object
          description: Para farkının nasıl kapatıldığı.
          properties:
            kind: { type: string, enum: [refund, extra_charge, none] }
            status: { type: string, enum: [succeeded, pending, manual, failed] }
            message: { type: [string, 'null'] }

    KitchenOrdering:
      type: object
      required: [ordering_enabled, server_time]
      properties:
        ordering_enabled: { type: boolean }
        reason:
          type: [string, 'null']
          description: Durdurma sebebi; müşteriye de gösterilir.
        resumes_at:
          type: [string, 'null']
          format: date-time
          description: |
            Süreli durdurmanın bitişi. `null` = süresiz (elle açılana
            kadar) ya da şalter zaten açık.
        busy:
          type: boolean
          description: Yoğunluk uyarısı — satışı kesmez, yalnız uyarır.
        server_time: { type: string, format: date-time }

    KitchenMenuItem:
      type: object
      required: [menu_id, name, listed, sold_out]
      description: |
        Mutfağın gördüğü ürün. **Fiyat alanı yoktur** (ADR-08).
      properties:
        menu_id: { type: integer, format: int64 }
        name: { type: string }
        listed:
          type: boolean
          description: Yöneticinin kalıcı kararı — ürün menüde mi?
        sold_out:
          type: boolean
          description: Mutfağın günlük kararı — bugün tükendi mi?
        sold_out_reason: { type: [string, 'null'] }

    KitchenCommand:
      type: object
      required: [id, command, payload]
      properties:
        id: { type: integer, format: int64 }
        command:
          type: string
          enum: [test_receipt, reprint, clear_failed, silence_alarm, restart]
        payload:
          type: object
          additionalProperties: true
          description: '`reprint` için `order_id` ve `type`; diğerlerinde boş.'

    SavedAddress:
      type: object
      required: [id, line1, district, city, is_default]
      description: |
        Müşterinin adres defterindeki bir kayıt.

        **Sipariş adresi buradan KOPYALANIR, bağlanmaz.** Sipariş kayıtlı
        adrese işaret etseydi, müşteri adresini düzelttiğinde geçmiş
        siparişlerin teslimat adresi de geçmişe dönük değişirdi ve teslim
        edilmiş bir siparişin nereye gittiği okunamaz olurdu.
      properties:
        id: { type: integer, format: int64 }
        label:
          type: [string, 'null']
          description: Müşterinin verdiği ad — "Ev", "Ofis", "Şantiye".
          examples: ['Ofis']
        line1:
          type: string
          maxLength: 255
          description: |
            Adresin **tek satırlık** hâli ve bugüne kadarki tek biçimi.
            Zorunlu kalır ve kalmaya devam edecek: fiş, kurye ekranı ve eski
            istemci sürümleri yalnız bunu okuyor.

            Aşağıdaki yapılandırılmış alanlar doluysa sunucu `line1`'i
            onlardan **türetebilir**; müşteri yine de kendi yazdığını
            görebilmeli diye türetme yalnızca `line1` boş geldiğinde çalışır.
        neighbourhood:
          type: [string, 'null']
          maxLength: 96
          description: |
            Mahalle. `line1`'i parçalarına ayıran alanların ilki (B-21);
            eski kayıtlarda `null`'dır ve öyle kalır — geçmiş adresleri
            geriye dönük ayrıştırmak, ayrıştırmanın yanlış olduğu her satırda
            kuryeyi yanlış kapıya götürürdü.
          examples: ['Feritpaşa Mah.']
        street:
          type: [string, 'null']
          maxLength: 128
          description: Cadde / sokak / bulvar.
          examples: ['Kültür Sk.']
        building_no:
          type: [string, 'null']
          maxLength: 24
          description: |
            Bina / dış kapı numarası. Metin, sayı değil: `12/A`, `3-5` gibi
            değerler sahada yaygın.
          examples: ['12/A']
        floor: { type: [string, 'null'], maxLength: 16, description: 'Kat. `Zemin`, `Bodrum` gibi değerler de geçerli — bu yüzden metin.' }
        door_no: { type: [string, 'null'], maxLength: 16, description: 'Daire / iç kapı numarası.' }
        district: { type: string, maxLength: 96 }
        city: { type: string, maxLength: 96 }
        note:
          type: [string, 'null']
          description: Kuryeye not. Fişte görünür.
        is_default:
          type: boolean
          description: |
            Ödeme ekranında önceden seçili gelen adres. Aynı anda **en
            fazla bir** adres varsayılandır; yeni bir adres varsayılan
            yapıldığında eskisi kendiliğinden bırakır.
        latitude:
          type: [number, 'null']
          format: double
          description: |
            Haritadan seçilen nokta. `longitude` ile birlikte anlamlıdır;
            yalnızca biri doluysa yanıtta ikisi de `null` döner.
        longitude: { type: [number, 'null'], format: double }

    SavedAddressInput:
      type: object
      required: [line1, district, city]
      properties:
        label: { type: [string, 'null'], maxLength: 64 }
        line1:
          type: string
          maxLength: 255
          description: |
            **Zorunlu kalır.** Yapılandırılmış alanlar (`neighbourhood` …
            `door_no`) eklendi diye `line1` isteğe bağlı yapılamaz: bugün
            sahada olan istemci sürümleri yalnız bu alanı gönderiyor ve
            zorunluluğu kaldırmak `SavedAddress.line1`'i de fiilen
            boşaltılabilir hâle getirirdi (`docs/03` §1.4).

            Formu yapılandırılmış alanlarla dolduran yeni istemci `line1`'i
            de gönderir; göndermezse sunucu dolu alanlardan türetir.
        neighbourhood: { type: [string, 'null'], maxLength: 96 }
        street: { type: [string, 'null'], maxLength: 128 }
        building_no: { type: [string, 'null'], maxLength: 24 }
        floor: { type: [string, 'null'], maxLength: 16 }
        door_no:
          type: [string, 'null']
          maxLength: 16
          description: |
            Beş yapılandırılmış alanın hepsi **isteğe bağlıdır** ve
            `latitude`/`longitude` ile aynı güncelleme kuralını izler:
            `null` göndermek alanı **siler**, alanı hiç göndermemek mevcut
            değeri **korur**. Bunlar birbirinden bağımsızdır — koordinat
            çiftinin aksine yarısının dolu olması geçerli bir durumdur
            (kat bilinip daire no bilinmemesi olağan).
        district: { type: string, maxLength: 96 }
        city: { type: string, maxLength: 96 }
        note: { type: [string, 'null'], maxLength: 255 }
        is_default: { type: boolean }
        latitude:
          type: [number, 'null']
          format: double
          minimum: -90
          maximum: 90
          description: |
            İsteğe bağlı. Güncellemede **`null` göndermek koordinatı siler** —
            alanı hiç göndermemek ise mevcut koordinatı korur. İğnesini
            kaldıran müşterinin eski noktası kayıtta kalmasın diye bu ikisi
            ayrı davranışlardır.
        longitude: { type: [number, 'null'], format: double, minimum: -180, maximum: 180 }

    AddressSuggestion:
      type: object
      required: [label, line1, district, city, latitude, longitude, source]
      description: |
        Geocoder'dan gelen tek bir adres adayı. `/addresses/suggest` bunlardan
        bir liste, `/addresses/reverse` tek tanesini döndürür.

        **Bu bir kayıt değildir**, bir öneridir: hiçbir yerde saklanmaz ve
        kimliği yoktur. Müşteri seçtiğinde istemci alanları forma taşır;
        kaydedilen şey `SavedAddressInput`'tur. Öneriye kimlik verip
        `SavedAddress`'e bağlamak, sağlayıcı o kimliği değiştirdiği ya da
        sürücü Google Places'e geçtiği gün defterdeki adresleri kırardı.

        Alan adları `SavedAddress` ile **birebir aynıdır** — istemci öneriyi
        forma alan alan kopyalar, arada eşleme tablosu tutmaz.
      properties:
        label:
          type: string
          description: |
            Listede gösterilecek tek satırlık metin. Sunucu kurar; istemci
            parçaları birleştirip kendi satırını yazmaz — aynı öneri web'de
            ve mobilde farklı görünmesin.

            **CSS `text-transform` ile büyütülmez** (`docs/03` §1.1): Türkçe
            metin böyle büyütüldüğünde `İ`/`ı` kırılır ve mahalle adlarının
            yarısı bu harfleri taşır.
          examples: ['Feritpaşa Mah., Kültür Sk. No:12, Selçuklu / Konya']
        line1:
          type: string
          maxLength: 255
          description: |
            Önerinin tek satırlık hâli — doğrudan `SavedAddressInput.line1`'e
            yazılabilir. `label`'dan farkı: `label` ilçe ve ili de içerir,
            `line1` içermez (onlar ayrı alanlar ve formda ayrı kutular).
          examples: ['Feritpaşa Mah. Kültür Sk. No:12']
        neighbourhood: { type: [string, 'null'], maxLength: 96 }
        street: { type: [string, 'null'], maxLength: 128 }
        district:
          type: string
          maxLength: 96
          description: |
            **Her zaman hizmet alanındaki ilçelerden biridir**; başkası
            yanıta hiç girmez. İstemci bu değeri ilçe seçicisine doğrudan
            yazabilir.
          examples: ['Selçuklu']
        city:
          type: string
          maxLength: 96
          description: 'Faz 1''de her zaman `Konya` — hizmet alanı tek il.'
          examples: ['Konya']
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: |
            **Null olamaz.** Hizmet alanı elemesi koordinat üzerinden
            yapılıyor; koordinatı olmayan bir aday listeye zaten giremez.
            İstemci bu yüzden her öneride iğneyi güvenle yerleştirebilir.

            `/addresses/reverse` yanıtında bu değer **isteğin kendi
            koordinatıdır**, sağlayıcının oturttuğu nokta değil.
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        source:
          type: string
          description: |
            Öneriyi üreten sürücü. Bugünkü tek değer `osm_nominatim`.

            **Kapalı bir enum DEĞİL, bilerek.** Sürücü değişebilir (docs/11
            §F2-01 Google Places'i planlıyor) ve enum'a üye eklemek
            istemcilerdeki kapsayıcı `switch`'i ve üretilen TypeScript
            birleşimini kırardı — `ErrorCode` için verilen kararın aynısı.
            İstemci bu alanı **dallanma için kullanmaz**; sağlayıcı atıfını
            göstermek ve günlükte hangi sürücünün konuştuğunu bilmek için
            var.
          examples: ['osm_nominatim']

    DailyMenu:
      type: object
      required: [date, closed, is_orderable, currency, items]
      description: |
        Bir günün menüsü. Paket olarak da, kalem kalem de satılır.
      properties:
        id:
          type: [integer, 'null']
          format: int64
          description: |
            O günün yayınlanmış menüsünün kimliği. **`null` ise o gün menü
            yok** — `package` ve `items` boş döner, `is_orderable` yanlıştır.
        date: { type: string, format: date }
        title:
          type: [string, 'null']
          description: 'Günün adı, örn. "Ev Yemeği Menüsü".'
        description: { type: [string, 'null'] }
        image_url: { type: [string, 'null'], format: uri }
        package:
          oneOf:
            - $ref: '#/components/schemas/DailyMenuPackage'
            - type: 'null'
          description: |
            Menünün bütün olarak satılan hâli. O gün paket satılmıyorsa
            (yönetici paket fiyatı girmediyse) `null` — kalemler yine tek
            tek satılabilir.
        items_total:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: |
            Kalemlerin tek tek alınması hâlindeki toplam. `package.price` ile
            arasındaki fark müşteriye "paketle şu kadar avantaj" olarak
            gösterilebilir. Sunucu hesaplar; istemci çıkarma yapmak zorunda
            kalmasın diye alan olarak veriliyor — para hesabı tek yerde.
        currency: { $ref: '#/components/schemas/Currency' }
        closed:
          type: boolean
          default: false
          description: |
            İşletmenin kapalı olduğu gün (`veykemtu_closed_days`). Menü
            girilmiş olsa bile bu gün sipariş alınmaz: kapalı gün kazanır.
        is_orderable:
          type: boolean
          description: |
            Bu güne **şu anda** sipariş verilebilir mi? Menünün yayında
            olmasını, günün kapalı olmamasını, kesim saatinin geçmemiş
            olmasını ve azami ileri görüş penceresinin aşılmamasını birlikte
            özetler. Bağlayıcı olan yine `POST /orders` anındaki denetimdir.
        unavailable_reason:
          type: [string, 'null']
          enum: [null, closed_day, not_published, cutoff_passed, past, too_far]
          description: |
            `is_orderable` yanlışken sebebin makine okunur hâli. Kullanıcıya
            gösterilecek metni istemci kendi diliyle yazar — sunucudan gelen
            cümleyi ekrana basmak, arayüz metnini sunucu sürümüne bağlar.
        items:
          type: array
          description: |
            Menüyü oluşturan kalemler, yöneticinin verdiği sırada.
            `price` **o gün için geçerli** birim fiyattır (ürünün kendi
            fiyatı ya da o güne girilmiş istisna).
          items: { $ref: '#/components/schemas/MenuItem' }

    DailyMenuPackage:
      type: object
      required: [menu_id, name, price, is_available, components]
      properties:
        menu_id:
          type: integer
          format: int64
          description: |
            **Sipariş verirken `items[].menu_id` alanına yazılacak değer.**
            Paket, sözleşme açısından bir ürün gibi sipariş edilir; sunucu
            bu kimliği tanır ve fiyatı o günün paket fiyatından alır.
        name: { type: string }
        price:
          allOf: [$ref: '#/components/schemas/Money']
          description: Paketin o günkü fiyatı.
        is_available:
          type: boolean
          description: |
            Paket bugün satılabilir mi? İçindeki **zorunlu** bir kalem
            "bugün tükendi" işaretlendiyse paket de düşer: ana yemeği
            olmayan bir menüyü satmak, kırk telefon özrü demek.
        sold_out_reason: { type: [string, 'null'] }
        components:
          type: array
          description: Paketin içindekiler — mutfağın pişireceği yemekler.
          items:
            type: object
            required: [menu_id, name, quantity]
            properties:
              menu_id: { type: integer, format: int64 }
              name: { type: string }
              quantity:
                type: integer
                minimum: 1
                description: Bir pakette bu kalemden kaç porsiyon var.
              image_url: { type: [string, 'null'], format: uri }
              allergens:
                type: array
                items: { type: string }

    MenuCalendarDay:
      type: object
      required: [date, has_menu, closed, is_orderable]
      properties:
        date: { type: string, format: date }
        has_menu: { type: boolean }
        closed: { type: boolean }
        is_orderable: { type: boolean }
        title: { type: [string, 'null'] }
        package_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        note:
          type: [string, 'null']
          description: 'Kapalı günün açıklaması ("Kurban Bayramı") ya da `null`.'

    MenuCategory:
      type: object
      required: [id, name, sort, items]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sort: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/MenuItem' }

    MenuItem:
      type: object
      required: [id, name, price, currency, is_available]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        image_url: { type: [string, 'null'], format: uri }
        is_available:
          type: boolean
          description: |
            `false` ürün yanıtta kalır; istemci soluk gösterir, sepete eklemez.

            İki sebepten biriyle `false` olur: yöneticinin kalıcı kararı
            (`menus.menu_status`) ya da mutfağın günlük "bugün tükendi"
            işareti (`sold_out_today`). Kullanıcı için sonuç aynı; sebep
            ayrı alanda çünkü farklı beklenti yaratır.
        sold_out_today:
          type: boolean
          default: false
          description: Mutfak bugünlük tükendi işaretledi mi? (K-11)
        sold_out_reason:
          type: [string, 'null']
          description: '`sold_out_today` doğruyken mutfağın yazdığı sebep.'
        allergens:
          type: array
          items: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/MenuOption' }

    MenuOption:
      type: object
      required: [id, name, type, required, values]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type:
          type: string
          description: |
            Bilinen değerler: `radio` (tek seçim), `checkbox` (çok seçim), `select`.
            Kapalı enum değildir — TastyIgniter'ın gerçek değer kümesi `B-02`'de
            doğrulanacak (bkz. BILINMEYENLER). İstemci bilinmeyen tipi `radio` gibi ele alır.
          examples: [radio]
        required: { type: boolean }
        values:
          type: array
          items: { $ref: '#/components/schemas/MenuOptionValue' }

    MenuOptionValue:
      type: object
      required: [id, name, price_delta]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        price_delta:
          type: integer
          format: int64
          description: Kuruş cinsinden **işaretli** fark; negatif olabilir.

    # ── Sipariş ─────────────────────────────────────────────────────────

    Address:
      type: object
      required: [line1, district, city]
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Siparişin **değişmez** adres kopyası, tek satır. Zorunlu kalır:
            mutfak fişi, kurye fişi ve `OrderPresenter` bu alanı basıyor ve
            hiçbiri aşağıdaki yapılandırılmış alanları okumak zorunda
            bırakılmamalı.

            İstemci yapılandırılmış alanları gönderip `line1`'i boş bırakırsa
            sunucu onlardan türetir.
        neighbourhood:
          type: [string, 'null']
          maxLength: 96
          description: |
            Mahalle. Beş yapılandırılmış alanın hepsi **isteğe bağlıdır**
            (B-21, additive): adresi elle tek satır yazan müşteri de sipariş
            verebilmeli. Dolu geldiklerinde sipariş kopyasına aynen yazılır —
            adres defterindeki kayıt sonradan düzelse bile geçmiş siparişin
            kopyası değişmez.
          examples: ['Feritpaşa Mah.']
        street: { type: [string, 'null'], maxLength: 128, description: 'Cadde / sokak.' }
        building_no: { type: [string, 'null'], maxLength: 24, description: 'Bina / dış kapı no. Metin: `12/A` yaygın.' }
        floor: { type: [string, 'null'], maxLength: 16, description: 'Kat. `Zemin` gibi değerler de geçerli.' }
        door_no: { type: [string, 'null'], maxLength: 16, description: 'Daire / iç kapı no.' }
        district: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        note: { type: [string, 'null'] }
        latitude:
          type: [number, 'null']
          format: double
          minimum: -90
          maximum: 90
          description: |
            Haritadan seçilen teslimat noktası. **İsteğe bağlı** — konum izni
            vermeyen ya da adresi elle yazan müşteri de sipariş verebilir.

            `longitude` ile birlikte anlamlıdır: yalnızca biri gönderilirse
            ikisi de yok sayılır, yanıtta ikisi de `null` döner. Yarısı dolu
            bir koordinat haritada gösterilemez.
        longitude:
          type: [number, 'null']
          format: double
          minimum: -180
          maximum: 180
          description: '`latitude` ile birlikte anlamlıdır.'

    OrderCreateRequest:
      type: object
      required: [location_id, items, delivery_type, payment_method]
      properties:
        location_id: { type: integer, format: int64 }
        items:
          type: array
          minItems: 1
          description: |
            Sepet satırları. Şekil **değişmedi**: menü paketi de bir
            `menu_id` ile sipariş edilir — paketin kimliği
            `DailyMenu.package.menu_id` alanında gelir. Böylece istemci
            "paket mi ürün mü" ayrımını istek biçiminde taşımaz; sunucu
            o kimliği tanır, fiyatı o günün paket fiyatından alır ve
            içindekileri satırın altına açar.
          items:
            type: object
            required: [menu_id, quantity]
            properties:
              menu_id:
                type: integer
                format: int64
                description: |
                  Ürün ya da menü paketi. **Yalnızca o günün yayınlanmış
                  menüsünde yer alan kimlikler kabul edilir**; başkası
                  `422 ITEM_UNAVAILABLE` döner.
              quantity: { type: integer, minimum: 1 }
              option_value_ids:
                type: array
                description: Paket satırında yok sayılır — paketin seçeneği olmaz.
                items: { type: integer, format: int64 }
              note: { type: [string, 'null'], maxLength: 255 }
        service_date:
          type: [string, 'null']
          format: date
          description: |
            Siparişin **hangi gün için** olduğu (Europe/Istanbul).
            Verilmezse `requested_at`'in işletme saatindeki tarihi, o da
            yoksa bugün.

            `requested_at` ile birlikte gönderilirse **ikisinin günü aynı
            olmak zorundadır**, yoksa `422 VALIDATION_FAILED`. Aksi hâlde
            "cuma menüsünü perşembe saat 12:00'ye" gibi, mutfağın
            karşılayamayacağı bir sipariş doğardı.
        delivery_type: { $ref: '#/components/schemas/DeliveryType' }
        address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: '`delivery` ise zorunlu, `pickup` ise yok sayılır.'
        requested_at:
          type: [string, 'null']
          format: date-time
          description: İstenen teslim zamanı. `order_cutoff` kuralına takılırsa `LOCATION_CLOSED`.
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        customer_note: { type: [string, 'null'], maxLength: 500 }

    Payment:
      type: object
      required: [method, status]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        redirect_url:
          type: [string, 'null']
          format: uri
          description: |
            Yalnızca `online` yönteminde ve sipariş **henüz ödenmemişken**
            dolu; istemci kullanıcıyı buraya yönlendirir. Ödendikten sonra
            `null` döner — kullanıcı ikinci kez ödeme sayfasına
            gönderilmemelidir.

            Faz 1'de bu adres bir **simülasyon** sayfasıdır (gerçek tahsilat
            yok). Akış gerçek sanal POS ile birebir aynıdır; sağlayıcı
            devreye girdiğinde yalnızca adresin işaret ettiği sayfa değişir.

    OrderCreated:
      type: object
      required: [id, order_number, status, total, currency, payment, created_at]
      properties:
        id: { type: integer, format: int64 }
        order_number: { type: string, examples: ['S-5012'] }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        payment: { $ref: '#/components/schemas/Payment' }
        created_at: { type: string, format: date-time }

    OrderSummary:
      type: object
      required: [id, order_number, status, total, currency, item_count, created_at]
      properties:
        id: { type: integer, format: int64 }
        order_number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        item_count: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        service_date:
          type: string
          format: date
          description: |
            Siparişin **hangi gün için** olduğu (Europe/Istanbul). Sipariş
            listesinde "20 Ağustos menüsü" yazabilmek için gerekiyor:
            `created_at` siparişin verildiği andır ve ileri tarihli
            siparişte o gün ile servis günü ayrıdır.
        subscription_id:
          type: [integer, 'null']
          format: int64
          description: Abonelikten üretildiyse abonelik kimliği; elle siparişte null.

    OrderItem:
      type: object
      required: [menu_id, name, quantity, unit_price, line_total]
      properties:
        menu_id: { type: integer, format: int64 }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        options:
          type: array
          items: { type: string }
        note: { type: [string, 'null'] }
        unit_price:
          allOf: [$ref: '#/components/schemas/Money']
          description: Seçenek farkları **dahil** birim fiyat.
        line_total: { $ref: '#/components/schemas/Money' }
        role:
          type: string
          default: item
          enum: [item, package, component]
          description: |
            Satırın rolü:

            * `item` — sıradan ürün satırı (varsayılan; eski istemciler
              alanı hiç görmese de davranış değişmez).
            * `package` — menü paketi. Parayı **bu satır taşır**.
            * `component` — paketin içindeki yemek. `unit_price` ve
              `line_total` **sıfırdır**; parası paket satırındadır.
              Bu satırlar mutfağa "ne pişecek" bilgisini verir ve üretim
              listesinde gerçek `menu_id`'leriyle toplanır.

            İstemci toplamı satırlardan hesaplamaz (hiçbir zaman
            hesaplamıyordu) — `subtotal`/`total` sunucudan gelir.
        included_in:
          type: [integer, 'null']
          description: |
            `role: component` satırlarında, ait olduğu paket satırının
            `items` dizisindeki sırası. Diğer satırlarda `null`.
            İstemci paketi ve içindekileri iç içe gösterebilsin diye.
        daily_menu_id:
          type: [integer, 'null']
          format: int64
          description: Satır o günün menüsünden geldiyse menünün kimliği.

    StatusHistoryEntry:
      type: object
      required: [status, at]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        at: { type: string, format: date-time }

    OrderDetail:
      type: object
      required:
        [id, order_number, status, items, subtotal, delivery_fee, total, currency,
         delivery_type, payment, status_history, created_at]
      properties:
        id: { type: integer, format: int64 }
        order_number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }
        subtotal: { $ref: '#/components/schemas/Money' }
        delivery_fee:
          allOf: [$ref: '#/components/schemas/Money']
          description: '`pickup` siparişte her zaman `0`.'
        total: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        delivery_type: { $ref: '#/components/schemas/DeliveryType' }
        address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: '`pickup` siparişte `null`.'
        requested_at: { type: [string, 'null'], format: date-time }
        service_date:
          type: string
          format: date
          description: |
            Siparişin hangi gün için olduğu (Europe/Istanbul). `requested_at`
            doluysa onun işletme saatindeki tarihi, boşsa siparişin verildiği
            gün. Mutfak panosu ve üretim listesi bu güne göre çalışır.
        customer_note: { type: [string, 'null'] }
        payment: { $ref: '#/components/schemas/Payment' }
        status_history:
          type: array
          items: { $ref: '#/components/schemas/StatusHistoryEntry' }
        created_at: { type: string, format: date-time }
        subscription_id:
          type: [integer, 'null']
          format: int64
          description: Abonelikten üretildiyse abonelik kimliği; elle siparişte null.
        revision_no:
          type: integer
          minimum: 0
          default: 0
          description: |
            Kaçıncı revizyon (K-12). Sipariş mutfakta düzenlendiğinde
            artar. İstemciler "Revize edildi" rozetini ve "siparişiniz
            güncellendi" bildirimini bu alanın DEĞİŞMESİNE bağlar —
            yalnız duruma bakan bir tekilleştirme, içerik değiştiğinde
            müşteriyi hiç uyarmaz.
        revisions:
          type: array
          description: |
            Revizyon özeti, eskiden yeniye. İç alanlar (kim yaptı, hangi
            kasa, ham anlık görüntüler) **dönmez**.
          items:
            type: object
            required: [revision_no, reason, refund, extra_charge, created_at]
            properties:
              revision_no: { type: integer, minimum: 1 }
              reason: { type: string }
              refund:
                allOf: [$ref: '#/components/schemas/Money']
                description: Müşteriye iade edilen tutar; yoksa 0.
              extra_charge:
                allOf: [$ref: '#/components/schemas/Money']
                description: Ek tahsil edilecek fark; yoksa 0.
              created_at: { type: string, format: date-time }

    # ── Mutfak ──────────────────────────────────────────────────────────

    KitchenOrderItem:
      type: object
      required: [name, quantity]
      description: Fiyat alanı **yoktur** — mutfak kapsamı fiyat görmez.
      properties:
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        options:
          type: array
          items: { type: string }
        note: { type: [string, 'null'] }

    KitchenOrder:
      type: object
      required: [id, order_number, status, delivery_type, items, created_at, updated_at]
      description: |
        Fiyat, adres ve e-posta **içermez**.

        **KURAL DEĞİŞTİ (K-14, 11.08.2026):** telefon artık içerir.
        Önceki sürüm üç ayrı yerde "mutfak listesinde telefon GÖRÜNMEZ"
        diyordu ve sipariş düzenleme (K-12) gelene kadar doğruydu:
        mutfağın telefona ihtiyacı yoktu. Artık personel müşteriyi
        **arayıp** anlaşmak zorunda ve numarayı görmek için fiş basmak
        (ya da basılmış fişi aramak) saçma. Fiyat ve adres gizliliği
        aynen duruyor — kural kaldırılmadı, daraltıldı.
      properties:
        id: { type: integer, format: int64 }
        order_number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        requested_at: { type: [string, 'null'], format: date-time }
        delivery_type: { $ref: '#/components/schemas/DeliveryType' }
        customer_label:
          type: [string, 'null']
          examples: ['Ayşe Y.']
        customer_name:
          type: [string, 'null']
          description: Tam ad (K-14). Personel arayacaksa baş harf yetmiyor.
          examples: ['Ayşe Yılmaz']
        customer_phone:
          type: [string, 'null']
          description: |
            Müşterinin telefonu (K-14). Personelin düzenleme öncesi
            arayabilmesi için.
          examples: ['0555 123 45 67']
        revision_no:
          type: integer
          minimum: 0
          default: 0
          description: |
            Kaçıncı revizyon (K-12). Artması, mutfak ve kurye fişlerinin
            yeniden basılması gerektiği anlamına gelir.
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/KitchenOrderItem' }
        customer_note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        is_subscription:
          type: boolean
          description: Abonelikten üretilen sipariş — KDS kartında rozet.

    KitchenSubscriptionOrders:
      type: object
      required: [today, tomorrow, server_time]
      description: |
        Bugün ve yarının abonelik siparişleri, gün gün gruplu. Mutfağın yemek
        kuyruğunu önceden planlaması için — durum ilerletme ana panoda kalır.
      properties:
        today:
          type: array
          items: { $ref: '#/components/schemas/KitchenOrder' }
        tomorrow:
          type: array
          items: { $ref: '#/components/schemas/KitchenOrder' }
        server_time: { type: string, format: date-time }

    ReceiptLine:
      type: object
      required: [quantity, name]
      properties:
        quantity: { type: integer, minimum: 1 }
        name: { type: string }
        options:
          type: array
          items: { type: string }
        note: { type: [string, 'null'] }

    KitchenReceipt:
      type: object
      required: [type, order_number, delivery_type, lines]
      properties:
        type: { type: string, const: mutfak }
        order_number: { type: string }
        delivery_type: { $ref: '#/components/schemas/DeliveryType' }
        requested_at: { type: [string, 'null'], format: date-time }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReceiptLine' }
        customer_phone:
          type: [string, 'null']
          description: |
            Müşterinin telefonu. Fişte basılır; kurye kapıda kaldığında ya da
            adres tarifi yetmediğinde arayacak numara elinde olsun diye.

            KDS **kartında** (`KitchenOrder`) telefon yoktur ve eklenmeyecektir:
            ekran mutfakta gün boyu açık durur, kartta telefon olması her
            müşterinin numarasını salondan görünür kılardı. Fiş tek bir sipariş
            için basılıp pakete/kuryeye gider.
        customer_note: { type: [string, 'null'] }
        printed_at: { type: [string, 'null'], format: date-time }
        revision_no:
          type: integer
          minimum: 0
          default: 0
          description: |
            Kaçıncı revizyon (K-20). `0` = hiç düzenlenmedi. `>0` ise KDS fişin
            **başına** çift boy `GÜNCEL FİŞ — REVİZE #N / ÖNCEKİ FİŞİ ATIN`
            bandını basar.

            Mutfak fişi bu alanı K-20'ye kadar hiç almıyordu: düzenlenen
            sipariş için yeni kâğıt çıkıyor ama üstünde onu öncekinden ayıran
            hiçbir şey yazmıyordu. Tezgâhta iki kâğıt yan yana durduğunda
            hangisinin geçerli olduğu okunamıyordu.
        revision_summary:
          type: array
          items: { type: string }
          description: |
            Son revizyonun insan okur özeti (`Mercimek Çorbası: 20 -> 10`).
            Boş dizi, özetin çıkarılamadığı anlamına gelir; bant yine basılır,
            liste basılmaz.

    CustomerReceipt:
      type: object
      description: |
        **K-20 (14.08.2026): bu fiş artık kuryenin de fişidir.** Ayrı bir
        `kurye` fişi otomatik basılmıyor; kuryenin ihtiyaç duyduğu üç bilgi
        (kime, nereye, ne kadar tahsil edilecek) bu şemaya taşındı. Sipariş
        başına tam iki kâğıt çıkıyor: `onaylandi`da `mutfak`, `hazir`da
        `musteri`. Kâğıdı kapıda kurye okuyor, sonra müşteride kalıyor.

        `required` listesi **değişmedi** — eklenen alanların hepsi isteğe
        bağlı, eski istemciler kırılmıyor.
      required:
        [type, order_number, delivery_type, items, subtotal, delivery_fee, total,
         currency, payment]
      properties:
        type: { type: string, const: musteri }
        order_number: { type: string }
        delivery_type: { $ref: '#/components/schemas/DeliveryType' }
        requested_at: { type: [string, 'null'], format: date-time }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }
        subtotal: { $ref: '#/components/schemas/Money' }
        delivery_fee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        payment: { $ref: '#/components/schemas/Payment' }
        address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: |
            `delivery` siparişte dolu. Mutfak kapsamının müşteri adresini gördüğü
            **tek** yer burasıdır.
        customer_label: { type: [string, 'null'] }
        printed_at: { type: [string, 'null'], format: date-time }
        customer_name:
          type: [string, 'null']
          description: |
            Tam ad (K-20). Kurye kapıda "kime teslim ediyorum" sorusunu bu
            satırdan cevaplıyor; `customer_label` baş harfe indirgenmiş hâli
            olduğu için yetmiyor.
        customer_phone:
          type: [string, 'null']
          description: |
            Müşterinin telefonu (K-20). Kapı açılmadığında ya da adres tarifi
            yetmediğinde kuryenin arayacağı numara **bu fişte** olmak zorunda:
            ayrı kurye fişi artık basılmıyor.

            KDS **kartında** telefon yine yoktur (`KitchenOrder`) — ekran
            mutfakta gün boyu açık durur, kartta telefon olması her müşterinin
            numarasını salondan görünür kılardı. Fiş tek bir sipariş için
            basılıp kuryeye gider.
        customer_note: { type: [string, 'null'] }
        collect_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            Kapıda **tahsil edilecek** tutar (K-20). Ödenmiş siparişte `0`'dır
            ve KDS satırı hiç basmaz: sıfırlık bir "tahsil edilecek" satırı,
            kuryenin bir sonraki fişte gerçek tutarı gözden kaçırmasına yol
            açıyordu.

            `total` ile aynı olduğu hâlde ayrı bir alan: `total` siparişin
            bedeli, bu ise kuryenin eline geçecek para. Ödeme yöntemi
            değiştiğinde ikisi ayrışıyor.
        revision_no:
          type: integer
          minimum: 0
          default: 0
          description: |
            Kaçıncı revizyon (K-20). `>0` ise KDS fişin başına çift boy
            `GÜNCEL FİŞ — REVİZE #N / ÖNCEKİ FİŞİ ATIN` bandını basar.
        revision_summary:
          type: array
          items: { type: string }
          description: Son revizyonun insan okur özeti; boş dizi = özet yok.
        track_url:
          type: [string, 'null']
          format: uri
          description: |
            Sipariş takip sayfası; fişe QR olarak basılır (K-18). Müşteri
            numarayı elle yazmadan durumu izler.

            `FRONTEND_URL` tanımsızsa `null` gelir ve KDS QR basmaz —
            çalışmayan bir kare basmak, okutup boş sayfa gören müşteri
            üretmekten iyi değil.

            **K-20 — ADRES DEĞİŞTİ.** Eskiden `/siparis/{id}` idi ve o sayfa
            oturum istiyor: basılı QR'ı okutan müşteri sipariş durumunu değil
            **giriş ekranını** görüyordu. Yeni adres imzalı ve girişsiz:
            `/takip/{id}?e=<son geçerlilik>&s=<imza>`. Girişli
            `/siparis/{id}` sayfası olduğu gibi duruyor.
        deliver_url:
          type: [string, 'null']
          format: uri
          description: |
            "Teslim ettim" QR'ı (K-20). Kurye okutur, tek düğmeli bir onay
            sayfası açılır, onaylayınca sipariş `teslim_edildi` olur.

            **Kurye girişi yoktur**; yetki URL'deki imzadadır. Bağlantı tek
            kullanımlıktır ve bu ayrı bir bayrakla değil, durum makinesinin
            kendisiyle sağlanır: `teslim_edildi` terminaldir, ikinci okutma
            geçerli bir geçiş bulamaz.

            `null` olduğu hâller: gel-al siparişi (kurye yok) ya da imza sırrı
            yapılandırılmamış. İkisinde de KDS kareyi hiç basmaz.
        pay_url:
          type: [string, 'null']
          format: uri
          description: |
            Ödeme sayfası; fişe QR olarak basılır (K-19). Kapıda ödeme seçen
            müşteri nakit bulundurmak zorunda kalmasın diye.

            **Yalnızca ödenmemiş siparişte dolu.** Ödenmiş siparişin fişine
            ödeme QR'ı basmak, ikinci kez ödemeye davet etmek olurdu.

            **K-20:** sanal POS simülasyonu kapalıysa (`POS_ALLOW_SIMULATION`
            tanımsız üretim ortamı) rota hiç kaydedilmediği için burası da
            `null` döner. Eskiden ölü bir adrese giden bir kare basılıyordu.

    CourierReceipt:
      type: object
      description: |
        Kurye fişi (K-14). **K-20'den beri otomatik basılmıyor** — içeriği
        `CustomerReceipt`'e taşındı ve sipariş başına iki kâğıt çıkıyor. Bu
        şema, KDS'ten **elle yeniden bastırma** yolu için duruyor: kâğıt
        sıkışır ya da kurye fişi kaybederse personelin onu geri getirecek bir
        yolu olmalı.

        Sözleşmede K-20'ye kadar hiç tanımlanmamıştı; uç `kurye` tipini
        döndürdüğü hâlde `getReceipt` yanıtında listelenmiyordu. Burada
        eklenen şey **var olan davranışın belgelenmesidir**, yeni bir alan
        değil.
      required:
        [type, order_number, delivery_type, items, total, currency, payment]
      properties:
        type: { type: string, const: kurye }
        order_number: { type: string }
        delivery_type: { $ref: '#/components/schemas/DeliveryType' }
        requested_at: { type: [string, 'null'], format: date-time }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }
        total: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        payment: { $ref: '#/components/schemas/Payment' }
        address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
        customer_name: { type: [string, 'null'] }
        customer_phone: { type: [string, 'null'] }
        customer_note: { type: [string, 'null'] }
        revision_no: { type: integer, minimum: 0, default: 0 }
        revision_summary:
          type: array
          items: { type: string }
        collect_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Ödenmiş siparişte `0`; KDS satırı hiç basmaz.
        printed_at: { type: [string, 'null'], format: date-time }

    PublicOrderTracking:
      type: object
      description: |
        Siparişin **daraltılmış** yüzü — fişteki takip QR'ının arkasındaki
        veri (K-20). `OrderDetail` ile karıştırılmamalı.

        ADRES, AD, TELEFON VE KALEM LİSTESİ YOKTUR. Basılı bir kâğıt
        düşürülebilir, fotoğraflanabilir, çöpten çıkarılabilir; üstündeki
        bağlantı kâğıdın kendisinden fazlasını açmamalı. Buradan çıkarılan
        her şey zaten o kâğıdın üstünde yazıyor — kâğıttan daha uzun yaşayan
        bir URL üzerinden ikinci kez sızdırmak hiçbir şey kazandırmıyor.
      required:
        [id, order_number, status, delivery_type, total, currency, payment,
         status_history, created_at, server_time]
      properties:
        id: { type: integer, format: int64 }
        order_number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        delivery_type: { $ref: '#/components/schemas/DeliveryType' }
        requested_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        total: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        payment:
          type: object
          description: |
            `redirect_url` **taşımaz** — ödeme başlatma girişli akışın işidir.
          required: [method, status]
          properties:
            method: { $ref: '#/components/schemas/PaymentMethod' }
            status: { $ref: '#/components/schemas/PaymentStatus' }
        revision_no: { type: integer, minimum: 0, default: 0 }
        status_history:
          type: array
          items: { $ref: '#/components/schemas/StatusHistoryEntry' }
        server_time: { type: string, format: date-time }

    # ─────────────────────────── SİTE İÇERİĞİ ───────────────────────────
    #
    # Bu şemalardaki alanların çoğu `null` olabilir ve bu bir hata değildir:
    # panelde henüz doldurulmamış demektir. Sitenin davranışı `content/site.ts`
    # başındaki gerekçeyle aynı — bilinmeyen bilgi uydurulmaz, ilgili blok hiç
    # çizilmez.

    ContactChannel:
      type: object
      required: [display, href]
      properties:
        display:
          type: string
          description: Ekranda görünen biçim, örn. `0212 000 00 00`.
        href:
          type: string
          description: |
            `tel:` / `mailto:` / `https://wa.me/...`. Panelde ayrı bir alan
            DEĞİLDİR; yöneticinin yazdığı okunur numaradan sunucuda türetilir,
            böylece biçim hatası yüzünden çalışmayan bağlantı oluşmaz.

    SiteBrand:
      type: object
      properties:
        name: { type: string }
        short_name: { type: string }
        parent_group: { type: string }
        tagline: { type: string }
        description: { type: string }
        logo_url:
          type: [string, 'null']
          description: Panelden yüklenir. Boşsa site harf işaretini kullanır.
        primary_color:
          type: [string, 'null']
          description: |
            `#RRGGBB`. Kaydedilmeden önce beyaz metinle kontrastı ölçülür;
            WCAG AA eşiğini (4,5:1) geçmeyen renk reddedilir.

    SiteContact:
      type: object
      properties:
        phone:
          oneOf: [{ $ref: '#/components/schemas/ContactChannel' }, { type: 'null' }]
        whatsapp:
          oneOf: [{ $ref: '#/components/schemas/ContactChannel' }, { type: 'null' }]
        email:
          oneOf: [{ $ref: '#/components/schemas/ContactChannel' }, { type: 'null' }]
        address:
          type: [object, 'null']
          description: Açık adres ve il birlikte doldurulmadıysa `null` döner.
          properties:
            street_address: { type: string }
            district: { type: string }
            city: { type: string }
            postal_code: { type: [string, 'null'] }
            map_embed_url: { type: [string, 'null'] }
        working_hours:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: string }
        social:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              href: { type: string }

    SiteService:
      type: object
      required: [slug, title, summary, intro, icon]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        intro: { type: string }
        icon:
          type: string
          description: |
            Lucide ikon bileşeninin adı. İstemci tanımadığı adı sessizce
            varsayılana düşürür — boş kutu göstermez.
        body_html:
          type: [string, 'null']
          description: |
            Serbest anlatım. Zengin metin editöründen gelir ve **kayıt anında**
            sunucuda izin listesine göre temizlenir; istemci ek temizlik yapmaz.
        audience: { type: array, items: { type: string } }
        how_it_works:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              body: { type: string }
        benefits: { type: array, items: { type: string } }
        menu_planning: { type: string }
        quote_needs: { type: array, items: { type: string } }

    SitePost:
      type: object
      required: [slug, title, description, category, published_at, body_html]
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        published_at: { type: string, format: date }
        reading_minutes:
          type: integer
          description: Elle girilmediyse gövdeden hesaplanır.
        body_html:
          type: string
          description: Sunucuda temizlenmiş HTML (bkz. `SiteService.body_html`).

    SiteContent:
      type: object
      required: [faq, sectors, services, posts]
      properties:
        brand:
          oneOf: [{ $ref: '#/components/schemas/SiteBrand' }, { type: 'null' }]
        contact:
          oneOf: [{ $ref: '#/components/schemas/SiteContact' }, { type: 'null' }]
        company:
          type: [object, 'null']
          properties:
            mission: { type: string }
            vision: { type: string }
            group_relation: { type: string }
            values:
              type: array
              items:
                type: object
                properties: { title: { type: string }, body: { type: string } }
            process_steps:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  icon: { type: string }
                  body: { type: string }
            differentiators:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  icon: { type: string }
                  body: { type: string }
        faq:
          type: array
          items:
            type: object
            properties: { question: { type: string }, answer: { type: string } }
        sectors:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              title: { type: string }
              icon: { type: string }
              need: { type: string }
              answer: { type: string }
              service_slug: { type: string }
        menus:
          type: [object, 'null']
          properties:
            solutions:
              type: array
              items:
                type: object
                properties:
                  slug: { type: string }
                  title: { type: string }
                  summary: { type: string }
                  audience: { type: string }
                  principle: { type: string }
                  courses:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        examples:
                          description: |
                            Panelde virgülle ayrılmış tek metin olarak girilir;
                            istemci diziye çevirir.
                          oneOf:
                            - type: string
                            - type: array
                              items: { type: string }
            seasonal:
              type: array
              items:
                type: object
                properties: { season: { type: string }, note: { type: string } }
        quality:
          type: [object, 'null']
          properties:
            chain:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  icon: { type: string }
                  body: { type: string }
            allergen:
              type: array
              items:
                type: object
                properties: { text: { type: string } }
            certifications:
              description: |
                **Boş dizi anlamlıdır**: firma belge beyan etmemiştir ve site
                sertifika iddiası içermeyen bir açıklama gösterir. Doldurulan
                her belge sitede yayınlanır.
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  issuer: { type: string }
                  valid_until: { type: [string, 'null'] }
        services:
          type: array
          items: { $ref: '#/components/schemas/SiteService' }
        posts:
          type: array
          items: { $ref: '#/components/schemas/SitePost' }
        updated_at:
          type: [string, 'null']
          format: date-time
          description: |
            Üç içerik tablosunun en son değişme zamanı. İstemci bunu yeniden
            çizim gerekip gerekmediğine karar vermek için kullanır.

    # ── Teklif talebi ───────────────────────────────────────────────────

    QuoteStatus:
      type: string
      enum: [yeni, okundu, cevaplandi, kapandi]
      description: |
        Talebin panel içindeki takip durumu. **Ziyaretçi bunu görmez ve
        gönderirken belirleyemez** — gövdede `status` alanı gelse bile yok
        sayılır, yeni kayıt her zaman `yeni` doğar.

        Dört kademe var çünkü üçü yetmiyordu: `cevaplandi` (teklif gönderildi,
        cevap bekleniyor) ile `kapandi` (iş alındı veya kaybedildi)
        ayrılmasaydı liste zamanla takip edilemeyecek kadar şişerdi.

    QuoteRequestInput:
      type: object
      required: [full_name, kvkk_accepted]
      description: |
        Sitedeki teklif formunun gövdesi (`website/lib/validation/quote.ts`).

        **Şemada olmayan alanlar hata değildir, sessizce yok sayılır** — uç
        gerekçesi `POST /quote-requests` açıklamasındadır. `status` ve
        `admin_note` gibi panele ait alanlar gövdeden ATANAMAZ.
      properties:
        full_name:
          type: string
          maxLength: 120
          description: Zorunlu. 120 karakteri aşan değer kesilir, reddedilmez.
        organization: { type: [string, 'null'], maxLength: 160 }
        telephone:
          type: [string, 'null']
          maxLength: 32
          description: |
            Site başında sıfır olmadan 10 hane gönderir, ama uç ham metni de
            kabul eder (dahili no, uluslararası numara). **`telephone` ve
            `email`'den en az biri dolu olmalıdır**; ikisi de boşsa firma
            teklifi kimseye gönderemez ve kayıt yalnızca kişisel veri
            biriktirir.
        email: { type: [string, 'null'], maxLength: 160 }
        service_type:
          type: [string, 'null']
          maxLength: 64
          description: |
            `website/content/services.ts` slug'ı. **Enum DEĞİL** — aşağıdaki
            liste bilgi amaçlıdır.
          examples:
            - kurumsal-toplu-yemek
            - tasima-yemek
            - yerinde-uretim
            - okul-yemek-hizmeti
            - saglik-kuruluslari
            - santiye-yemek
            - davet-organizasyon
            - toplanti-ikram
        headcount:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000
          description: |
            Rakam olmayan değer `null` olarak kaydedilir, talebi düşürmez.
            Tavanı aşan değer tavana çekilir; gerçek sayı zaten `message`
            alanına yazılır.
        frequency:
          type: [string, 'null']
          maxLength: 32
          description: |
            Tek seferlik hizmetlerde (davet, toplantı ikramı) sorulmaz.
            **Enum değil.**
          examples: [gunluk, haftaici, haftalik-birkac, donemsel]
        start_date:
          type: [string, 'null']
          description: |
            Tek seferlik hizmetlerde etkinlik tarihi, sürekli hizmetlerde
            başlangıç tercihi. `YYYY-MM-DD` beklenir; **çözümlenemeyen değer
            `null` olarak kaydedilir**, talep yine durur.
          examples: ['2026-09-01']
        location: { type: [string, 'null'], maxLength: 160 }
        menu_preference:
          type: [string, 'null']
          maxLength: 32
          description: '**Enum değil**, örnek değerler.'
          examples: [siz-onerin, dort-kap, uc-kap, kahvalti-ikram, ozel-beslenme]
        kitchen_note:
          type: [string, 'null']
          maxLength: 2000
          description: Yalnızca yerinde üretim hizmetinde sorulan mutfak altyapısı notu.
        message: { type: [string, 'null'], maxLength: 5000 }
        kvkk_accepted:
          type: boolean
          const: true
          description: |
            **`true` DEĞİLSE TALEP KAYDEDİLMEZ ve `422` döner.** Onaysız
            kişisel veri saklamak hukuki sorundur; bu, ucun kaybı göze aldığı
            iki durumdan biridir. Onay anı sunucuda damgalanır — istemcinin
            bildirdiği bir zaman hukuki kayıt için delil değildir.
        submitted_at:
          type: [string, 'null']
          format: date-time
          description: |
            Sitenin bildirdiği gönderim anı. `created_at` ile aynı olmak
            zorunda değil: site kuyruğa alıp gecikmeli iletebilir.

    # ── Kontrol Merkezi (K-21) ──────────────────────────────────────────

    ControlIntent:
      type: object
      required: [actor, reason]
      description: |
        **Her yazma ucunun taşımak zorunda olduğu üç alan.** Okuma uçları
        bunları istemez.

        Gövde eksikse istek `422` alır ve **denetim satırı yazılmaz** —
        geçerli bir istek hiç oluşmadı.
      properties:
        actor:
          type: string
          minLength: 2
          maxLength: 120
          description: |
            İşlemi yapan kişi — **serbest metin**. BLD'de bir hesaba
            bağlanmıyor ve bağlanmayacak: Kontrol Merkezi ayrı bir depo,
            ayrı bir kullanıcı tablosu. Yabancı anahtar vermek iki sistemi
            birbirine bağlardı. Doğruluğu Kontrol Merkezi'nin
            sorumluluğundadır; imza zaten isteğin oradan geldiğini
            kanıtlıyor.
          examples: ['Ayşe Yönetici']
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: |
            Gerekçe — `veykemtu_control_audit.reason` sütununa yazılır.

            **En az 10 karakter.** Sınır olmasaydı "ok" yazıp geçmek
            serbest olurdu ve denetim izi, doldurulmuş ama hiçbir şey
            anlatmayan bir sütuna dönerdi. On karakter bir cümlenin
            başlangıcını zorluyor.
          examples: ['Sahada denetim için yapıldı']
        dry_run:
          type: boolean
          default: false
          description: |
            **Kuru prova.** `true` ise **hiçbir yazma yapılmaz**; yanıt
            `would` nesnesiyle "ne olurdu"yu döner. Ön denetimler yine
            çalışır (iptal edilmiş kasa, düzenlenemez sipariş, geçersiz
            durum geçişi hâlâ `422` verir).

            **Denetim satırı YİNE YAZILIR**, `result = "dry_run"` ile.
            "Denedim ama uygulamadım" bir eylemdir ve yanlış kasaya kilit
            uygulamaya çalışan birinin ilk adımı çoğu zaman odur.

    ControlOrderIntent:
      type: object
      required: [actor, reason]
      description: |
        `ControlIntent` ile aynı, tek farkla: **`reason` en fazla 160
        karakter.**

        `veykemtu_order_revisions.reason` 160 karakterlik bir sütun ve aynı
        metin oraya da yazılıyor. Kabuğun 500'lük sınırı sipariş uçlarında
        160'a daralıyor; taşan gerekçe **sessizce kırpılmak yerine `422`**
        alıyor.
      properties:
        actor: { type: string, minLength: 2, maxLength: 120 }
        reason: { type: string, minLength: 10, maxLength: 160 }
        dry_run: { type: boolean, default: false }

    ControlWriteEnvelope:
      type: object
      required: [ok, dry_run, audit_id]
      description: |
        **Her yazma ucunun ortak yanıt zarfı.** Eyleme özgü alanlar
        (`device`, `order`, `revision`, `command`, `would`) bu zarfın
        **yanına**, kökte durur.
      properties:
        ok: { type: boolean, const: true }
        dry_run:
          type: boolean
          description: 'İsteğin kuru prova olarak işlenip işlenmediği.'
        audit_id:
          type: integer
          format: int64
          description: |
            Bu istek için açılan `veykemtu_control_audit` satırının kimliği.
            **Kuru provada da doludur.** Satır işlemden **önce** açılıyor:
            sonra açılsaydı yarıda kalan bir yazma (veritabanı hatası,
            zaman aşımı) hiçbir iz bırakmazdı — oysa "denendi ve olmadı"
            tam da soruşturulması gereken hâldir.
        would:
          type: object
          additionalProperties: true
          description: |
            **Yalnız `dry_run: true` iken vardır.** Uygulansaydı ne olacağı.
            Gerçek gönderimde bu anahtar hiç gelmez; onun yerine eylemin
            kendi sonucu (`device` / `order` / `revision` / `command`)
            döner.

    ControlDevice:
      type: object
      required: [id, name, online, pairing, health, settings, pending_command_count]
      description: |
        Kontrol Merkezi'nin gördüğü kasa. Admin panelindeki kasa ekranının
        makine okunur karşılığı; **davranış birebir aynı** — iki yüzey aynı
        modeli ve aynı servisi çağırıyor.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 64 }
        online:
          type: boolean
          description: |
            `last_seen_at` son **3 dakika** içinde **VE** kasa iptal
            edilmemiş. İptal edilmiş bir kasa dakikalar önce görülmüş
            olabilir ama artık hiçbir uca giremez; onu "çevrimiçi"
            göstermek yöneticiye çalışan bir mutfak ekranı olduğunu
            düşündürürdü.
        last_seen_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: |
            Dolu ise kasa iptal edilmiştir. **Satır silinmez**; ikinci bir
            iptal isteği bu damgayı oynatmaz.
        pairing:
          type: object
          required: [usable]
          properties:
            code:
              type: [string, 'null']
              pattern: '^[A-Z0-9]{4}-[A-Z0-9]{4}$'
              description: |
                Eşleme kodu, biçim `XXXX-XXXX` (**9 karakter**; sütun
                `varchar(16)`). Karıştırılması kolay karakterler (`0`/`O`,
                `1`/`I`) alfabede yoktur.

                **YALNIZ İKİ YERDE AÇILIR:** kodu üreten uçların
                yanıtlarında (`POST /control/kds/devices`,
                `POST /control/kds/devices/{id}/pairing-code`) ve listede
                kod hâlâ **kullanılabilirken**. Kullanılmış ya da süresi
                dolmuş bir kodu göstermek yöneticiye çalışmayan bir kod
                okutur ve "kod yanlış" diye destek çağrısı üretirdi.
              examples: ['K7QP-3MXR']
            expires_at: { type: [string, 'null'], format: date-time }
            usable:
              type: boolean
              description: |
                Kod var, süresi geçmemiş ve kasa iptal edilmemiş.
        health:
          type: object
          description: |
            **Kasanın BEYAN ettiği** sağlık. Sunucu hiçbirini doğrulayamaz;
            fiş kuyruğu kasanın diskinde ve sunucuda karşılığı yok.
          properties:
            reported_at: { type: [string, 'null'], format: date-time }
            printer_ok:
              type: [boolean, 'null']
              description: |
                **Üç hâl ayrıdır:** `null` "kasa hiç bildirmedi", `false`
                "arızalı", `true` "sağlam". `null` ile `false`'u
                birleştirmek, yeni kurulan her kasa için var olmayan bir
                yazıcı arızası aratırdı.
            print_queue_pending: { type: [integer, 'null'], minimum: 0 }
            print_queue_failed: { type: [integer, 'null'], minimum: 0 }
            app_version: { type: [string, 'null'] }
        settings:
          allOf:
            - $ref: '#/components/schemas/KitchenSettings'
          description: |
            Yönetilen ayarlar **ve kilitler**. `updated_at` anahtarı burada
            **yoktur**; damga nesnenin kendi `settings_updated_at` alanında
            duruyor ve iki yerde taşımak sözleşmedeki anahtar listesine
            yazılamayan bir anahtar daha eklerdi.
        settings_updated_at: { type: [string, 'null'], format: date-time }
        pending_command_count:
          type: integer
          minimum: 0
          description: |
            Kasaya henüz teslim edilmemiş komut sayısı. Sonucu gelmeyen
            komut 10 dakika sonra yeniden gönderilir.

    ControlCommandLog:
      type: object
      required: [id, command, payload]
      description: |
        Komut geçmişi satırı. `KitchenCommand` şeması kasaya **giden**
        komuttur; bu ise Kontrol Merkezi'nin gördüğü **kayıttır** ve üç
        damgayı da taşır.
      properties:
        id: { type: integer, format: int64 }
        command:
          type: string
          enum: [test_receipt, reprint, clear_failed, silence_alarm, restart]
        payload:
          type: object
          additionalProperties: true
          description: '`reprint` için `order_id` ve `type`; diğerlerinde boş.'
        created_at:
          type: [string, 'null']
          format: date-time
          description: '**Gönderildi mi?** — komut kuyruğa girdiği an.'
        delivered_at:
          type: [string, 'null']
          format: date-time
          description: '**Kasaya ulaştı mı?** — sağlık yanıtına bindiği an.'
        executed_at:
          type: [string, 'null']
          format: date-time
          description: '**Çalıştı mı?** — kasanın sonucu bildirdiği an.'
        succeeded:
          type: [boolean, 'null']
          description: |
            Sonuç. `null` = kasa henüz bildirmedi. Tek bir "durum" alanı
            "kasa aldı ama çalıştıramadı" hâlini anlatamazdı.
        result: { type: [string, 'null'], maxLength: 255 }

    ControlPrintJob:
      type: object
      required: [id, order_id, type, revision]
      description: |
        Fiş **denetim** satırı — kuyruk değil (bkz. `GET /control/kds/print-jobs`).
        Tekillik `(order_id, type, revision)` üçlüsüdür.
      properties:
        id: { type: integer, format: int64 }
        order_id: { type: integer, format: int64 }
        order_number:
          type: [string, 'null']
          description: |
            Sipariş silinmişse (`veykemtu:siparis-temizle`) **`null`**;
            denetim satırı yerinde kalır, numara boşalır.
        type: { $ref: '#/components/schemas/ReceiptType' }
        revision:
          type: integer
          minimum: 0
          description: 'K-20 öncesi satırlarda `0`: düzenlenmemiş siparişin ilk basımı.'
        printed_at: { type: [string, 'null'], format: date-time }
        device_id: { type: [integer, 'null'], format: int64 }
        device_name: { type: [string, 'null'] }

    ControlOverview:
      type: object
      required: [devices, orders, print_jobs, server_time]
      description: |
        Panel açılış özeti. **Sayılar tanımdır, tahmin değil.**
      properties:
        devices:
          type: object
          required: [total, online, revoked, printer_fault, queue_pending, queue_failed]
          properties:
            total:
              type: integer
              minimum: 0
              description: 'Bütün kasalar — iptal edilmişler **dâhil**.'
            online:
              type: integer
              minimum: 0
              description: 'İptal edilmemiş ve son 3 dakika içinde görülmüş kasalar.'
            revoked: { type: integer, minimum: 0 }
            printer_fault:
              type: integer
              minimum: 0
              description: |
                `printer_ok === false` olan **iptal edilmemiş** kasalar.
                **`null` SAYILMAZ:** hiç sağlık bildirmemiş bir kasa arızalı
                değil, sessizdir. İkisini toplamak yeni kurulan her kasayı
                arıza sayacına yazardı.
            queue_pending:
              type: integer
              minimum: 0
              description: |
                Kasaların **beyan ettiği** bekleyen fiş sayısının toplamı.
                Sunucu doğrulayamaz — fiş kuyruğu kasanın diskinde.
            queue_failed: { type: integer, minimum: 0 }
        orders:
          type: object
          required: [active, by_status, today, late]
          properties:
            active:
              type: integer
              minimum: 0
              description: 'Terminal olmayan siparişler. `by_status` toplamına eşittir.'
            by_status:
              type: object
              description: |
                Aktif siparişlerin durum dağılımı.

                **TERMİNAL KODLAR ANAHTAR OLARAK BULUNMAZ:**
                `teslim_edildi` ve `iptal` zaten aktif kümenin dışında ve
                her seferinde `0` dönerlerdi. Kalan beş kod ise sipariş
                yokken bile `0` ile durur — istemcinin eksik anahtar için
                savunma yazmasına gerek kalmasın.
              required: [yeni, onaylandi, hazirlaniyor, hazir, yolda]
              properties:
                yeni: { type: integer, minimum: 0 }
                onaylandi: { type: integer, minimum: 0 }
                hazirlaniyor: { type: integer, minimum: 0 }
                hazir: { type: integer, minimum: 0 }
                yolda: { type: integer, minimum: 0 }
            today:
              type: integer
              minimum: 0
              description: |
                Bugün oluşturulan sipariş sayısı — **iptaller hariç**. Gün
                sınırı Europe/Istanbul: UTC gece yarısı kullanılsaydı
                00:00–03:00 arası siparişler "dün" sayılırdı ve catering'de
                gece siparişi olağan.
            late:
              type: integer
              minimum: 0
              description: |
                **Planlanan teslim saati geçmiş ve hâlâ teslim edilmemiş**
                aktif sipariş. Sunucunun kendi başına bilebileceği tek
                dürüst tanım bu.

                **Kasanın `late_after_minutes` eşiği KULLANILMAZ:** o eşik
                cihaz başına ayarlanıyor ve `null` bırakıldığında kasanın
                kendi derleme varsayılanı geçerli oluyor — sunucu o
                varsayılanı bilmiyor. İki kasanın farklı eşiği olduğunda
                "hangi kasanın gecikmesi" diye bir soru doğardı; oysa
                buradaki sayı **işletmenin tamamına** ait.

                **"En kısa sürede" siparişler SAYILMAZ.** Planlanmış bir
                saati yoktur; onları saymak için bir bekleme eşiği uydurmak
                gerekirdi ve uydurulan her eşik yanlış bir alarm üretirdi.
        print_jobs:
          type: object
          required: [today]
          properties:
            today:
              type: integer
              minimum: 0
              description: 'İşletme günü içinde basıldığı bildirilen fiş sayısı.'
        server_time: { type: string, format: date-time }

    ControlOrderRevision:
      type: object
      required: [revision_no, reason]
      description: |
        `OrderRevision` ile aynı, üstüne `created_by_device_id`.
      properties:
        revision_no: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 160 }
        note:
          type: [string, 'null']
          description: |
            Merkezden yapılan revizyonlarda **ilk satır**
            `Kontrol Merkezi · <actor>` etiketidir; personelin notu varsa
            alt satıra yazılır.
        refund_kurus: { $ref: '#/components/schemas/Money' }
        extra_charge_kurus: { $ref: '#/components/schemas/Money' }
        created_by_device_id:
          type: [integer, 'null']
          format: int64
          description: |
            Revizyonu yazan kasa. **`null` = Kontrol Merkezi'nden yapıldı**
            (kasa yok). "Kasadan mı merkezden mi" ayrımı hem bu alandan hem
            `note` etiketinden okunabilir.
        created_at: { type: [string, 'null'], format: date-time }

    ControlMenuItem:
      type: object
      required: [menu_id, name, price_kurus, sold_out, options]
      description: |
        Düzenleme ekranının ürün seçicisindeki kalem. `KitchenMenuItem`'in
        aksine **fiyat ve seçenek kimlikleri taşır** — gerekçesi
        `GET /control/kds/menu` açıklamasında.
      properties:
        menu_id: { type: integer, format: int64 }
        name: { type: string }
        price_kurus: { $ref: '#/components/schemas/Money' }
        sold_out:
          type: boolean
          description: 'Mutfağın günlük kararı. Tükenmiş ürün listede kalır, işaretlenir.'
        options:
          type: array
          items: { $ref: '#/components/schemas/ControlMenuOption' }

    ControlMenuOption:
      type: object
      required: [id, name, values]
      properties:
        id:
          type: integer
          format: int64
          description: '`menu_option_id`.'
        name: { type: string }
        type:
          type: string
          description: 'Görüntüleme tipi (`radio`, `checkbox`, `select`, `quantity`…).'
        required: { type: boolean }
        values:
          type: array
          items:
            type: object
            required: [id, name, price_delta_kurus]
            properties:
              id:
                type: integer
                format: int64
                description: |
                  `menu_option_value_id` — revizyon gövdesindeki
                  `items[].option_value_ids` alanına **doğrudan
                  konabilecek** kimlik (`LineResolver::resolve`). Yalnız adı
                  döndürmek, seçeneğin kaydedilirken sessizce düşmesine yol
                  açardı.
              name: { type: string }
              price_delta_kurus:
                allOf:
                  - $ref: '#/components/schemas/Money'
                description: 'Seçeneğin birim fiyata eklediği fark.'
