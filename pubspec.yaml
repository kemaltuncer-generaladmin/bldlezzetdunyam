name: bld_workspace
description: >
  Benim Lezzet Dünyam — pub workspace kökü. Kendisi bir paket değildir, yalnızca
  packages/ altındaki paketleri tek bağımlılık çözümünde toplar (ADR-10).
publish_to: none

environment:
  sdk: ^3.9.0

# mutfakapp/ (Flutter Linux desktop) K-01'de eklendi; kökteki komut artık
# `flutter pub get`'tir. musteriapp/ M-01'de eklenecektir.
workspace:
  - packages/core
  - packages/api_client
  - packages/design_system
  - mutfakapp
